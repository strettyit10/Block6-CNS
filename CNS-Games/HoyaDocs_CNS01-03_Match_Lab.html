:root{

}

  --ok:#6fd08f; --ok-bg:#16301f; --bad:#f28b82; --bad-bg:#3a1b19; --once:#f0c070; --once-bg:#3a2e12;
  --hy-bg:#3a3110; --hy-line:#b8952a; --hy-ink:#f5e6a8;
  --k1:#8fb1f0; --k2:#b9a3f5; --k3:#f08aa5; --k4:#f5a65b; --k5:#5cc2c0; --k6:#e3bb63; --k7:#6fd08f; --k8:#7cc4f0;
  --given:#1d262f; --lock:#161d24; --clue-bg:#1c2b44; --clue-ink:#c4d6f7; --clue-line:#3b5687; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#11161c; --surface:#19212a; --sunk:#141b22; --ink:#e6eaee; --muted:#9aa6b2; --line:#2c3642; --chip:#232c36;
  --neuro:#8fb1f0; --path:#f08aa5; --drt:#5cc2c0; --pharm:#e3bb63; --accent:#8fb1f0; --accent-ink:#0d1520;
  --ok:#6fd08f; --ok-bg:#16301f; --bad:#f28b82; --bad-bg:#3a1b19; --once:#f0c070; --once-bg:#3a2e12;
  --hy-bg:#3a3110; --hy-line:#b8952a; --hy-ink:#f5e6a8;
  --k1:#8fb1f0; --k2:#b9a3f5; --k3:#f08aa5; --k4:#f5a65b; --k5:#5cc2c0; --k6:#e3bb63; --k7:#6fd08f; --k8:#7cc4f0;
  --given:#1d262f; --lock:#161d24; --clue-bg:#1c2b44; --clue-ink:#c4d6f7; --clue-line:#3b5687; color-scheme:dark }
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font:15px/1.5 var(--f-body);margin:0}
.wrap{max-width:1120px;margin:0 auto;padding:20px 16px 48px;display:grid;gap:16px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;line-height:1.2}
button{font:inherit;color:inherit}
a{color:var(--accent)}
.meta{font:500 .74rem var(--f-mono);letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin:0}
header.top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:end;gap:12px}
header.top h1{font-size:clamp(1.5rem,3.4vw,2rem)}
header.top .lede{margin:4px 0 0;color:var(--muted);max-width:66ch}
.back{font:600 .8rem var(--f-body);text-decoration:none;color:var(--muted)}
.back:hover{color:var(--ink)}
.hdr-actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{font:600 .86rem var(--f-body);background:var(--chip);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px 13px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;text-decoration:none}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn[disabled]{opacity:.45;cursor:default}
.btn.sm{padding:5px 10px;font-size:.8rem}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{font:700 .82rem var(--f-body);letter-spacing:.04em;text-transform:uppercase;background:none;border:0;border-bottom:3px solid transparent;padding:10px 12px 8px;color:var(--muted);cursor:pointer;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0}
.panel h2{font-size:1.15rem}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media (max-width:760px){.grid2{grid-template-columns:minmax(0,1fr)}}
.mode-card{display:grid;gap:10px;align-content:start}
.mode-card .k{font:500 .7rem var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.mode-card h2{font-size:1.45rem}
.mode-card p{margin:0;color:var(--muted)}
.opts{display:grid;gap:8px}
.optrow{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.optrow .lab{font:500 .7rem var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);min-width:76px}
.seg{display:inline-flex;background:var(--chip);border-radius:9px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{font:600 .8rem var(--f-body);border:0;background:transparent;padding:5px 10px;border-radius:7px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.14)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:600 .78rem var(--f-body);border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 10px;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--c,var(--muted));flex:none}
.chip[aria-pressed="false"]{opacity:.5;text-decoration:line-through;text-decoration-color:var(--muted)}
.chip .n{font:500 .7rem var(--f-mono);color:var(--muted)}
.statrow{display:flex;flex-wrap:wrap;gap:18px}
.stat b{display:block;font:700 1.25rem var(--f-body);font-variant-numeric:tabular-nums}
.stat span{font:500 .68rem var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.bar{height:6px;background:var(--chip);border-radius:3px;overflow:hidden}
.bar > i{display:block;height:100%;background:var(--ok);border-radius:3px;transition:width .3s}
.lecrow{display:grid;grid-template-columns:auto minmax(0,1fr) 120px auto;gap:4px 10px;align-items:center;padding:6px 0;border-top:1px solid var(--line);font-size:.88rem}
.lecrow:first-of-type{border-top:0}
.lecrow .pct{font:500 .75rem var(--f-mono);color:var(--muted);font-variant-numeric:tabular-nums;min-width:52px;text-align:right}
@media (max-width:560px){.lecrow{grid-template-columns:auto minmax(0,1fr) auto}.lecrow .bar{grid-column:1/-1;order:5}}
.tag{font:600 .68rem var(--f-mono);letter-spacing:.05em;text-transform:uppercase;border-radius:5px;padding:2px 6px;color:#fff;background:var(--lc,var(--neuro));white-space:nowrap}
:root[data-theme="dark"] .tag{color:#0d1520}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .tag{color:#0d1520} }
.hy{font:700 .66rem var(--f-mono);letter-spacing:.06em;background:var(--hy-bg);color:var(--hy-ink);border:1px solid var(--hy-line);border-radius:5px;padding:1px 6px}
.hybox{background:var(--hy-bg);border:1.5px solid var(--hy-line);color:var(--hy-ink);border-radius:10px;padding:10px 12px;font-size:.9rem}
.hybox b{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;display:block;margin-bottom:2px}
details.how{font-size:.9rem}
details.how summary{cursor:pointer;font-weight:700}
details.how ul{margin:8px 0 0;padding-left:18px;color:var(--muted)}
details.how li{margin:3px 0}

/* Rapid fire */
.rf-top{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between}
.timer{height:5px;background:var(--chip);border-radius:3px;overflow:hidden}
.timer i{display:block;height:100%;background:var(--accent);width:100%}
.timer i.low{background:var(--bad)}
.qcard{display:grid;gap:14px;max-width:820px;margin:0 auto;width:100%}
.qhead{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.kind{font:700 .72rem var(--f-body);letter-spacing:.04em;text-transform:uppercase;color:var(--kc);border:1.5px solid var(--kc);border-radius:6px;padding:2px 8px}
.qset{font-size:.82rem;color:var(--muted)}
.prompt-lab{font:500 .7rem var(--f-mono);letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.prompt{font:600 clamp(1.15rem,2.6vw,1.45rem)/1.35 var(--f-display);margin:2px 0 0}
.ask{font-size:.88rem;color:var(--muted);margin:0}
.options{display:grid;gap:8px}
.opt{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;align-items:start;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:11px 12px;cursor:pointer;font-size:.95rem;line-height:1.4}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt .key{font:500 .75rem var(--f-mono);color:var(--muted);border:1px solid var(--line);border-radius:6px;height:24px;display:grid;place-items:center}
.opt.correct{border-color:var(--ok);background:var(--ok-bg)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt[disabled]{cursor:default}
.opt.dim{opacity:.55}
.fb{border-radius:10px;padding:12px 14px;display:grid;gap:8px;font-size:.92rem}
.fb.ok{background:var(--ok-bg);border:1px solid var(--ok)}
.fb.bad{background:var(--bad-bg);border:1px solid var(--bad)}
.fb h3{font:700 .95rem var(--f-body)}
.fb p{margin:0}
.fb .also{font-size:.86rem;color:var(--muted)}
.fb .also b{color:var(--ink)}
.navrow{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center}
.kbd{font:500 .72rem var(--f-mono);color:var(--muted)}
/* sequence */
.seq-done{display:grid;gap:6px;counter-reset:s;padding:0;margin:0;list-style:none}
.seq-done li{counter-increment:s;display:grid;grid-template-columns:26px minmax(0,1fr);gap:8px;align-items:start;background:var(--ok-bg);border:1px solid var(--ok);border-radius:8px;padding:7px 10px;font-size:.92rem}
.seq-done li::before{content:counter(s);font:700 .8rem var(--f-mono);color:var(--ok);text-align:center}
.seq-done li.slot{background:transparent;border:1.5px dashed var(--line);color:var(--muted)}
.seq-done li.slot::before{color:var(--muted)}
.seq-pool{display:grid;gap:6px}
.seq-pool .opt{grid-template-columns:minmax(0,1fr)}
.shake{animation:shake .32s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@media (prefers-reduced-motion:reduce){.shake{animation:none}}
/* end */
.end{display:grid;gap:14px;max-width:820px;margin:0 auto;width:100%}
.big{font:700 clamp(2rem,6vw,3rem)/1 var(--f-display)}
.misslist{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.misslist li{border:1px solid var(--line);border-left:4px solid var(--bad);border-radius:8px;padding:8px 12px;font-size:.9rem;background:var(--surface)}
.misslist .a{font-weight:700}
.misslist .b{color:var(--muted)}

/* Grid list */
.glist{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.gcard{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;cursor:pointer;display:grid;gap:6px;align-content:start}
.gcard:hover{border-color:var(--accent)}
.gcard h3{font-size:1.02rem}
.gcard p{margin:0;font-size:.84rem;color:var(--muted)}
.gcard .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font:500 .72rem var(--f-mono);color:var(--muted)}
.stars{font-size:.85rem;letter-spacing:1px;color:var(--once)}
.stars .off{color:var(--line)}
/* Grid play */
.gwrap{display:grid;gap:12px}
.gtable-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table.gt{border-collapse:separate;border-spacing:0;width:100%;min-width:560px}
.gt th{font:700 .74rem var(--f-body);letter-spacing:.04em;text-transform:uppercase;text-align:left;padding:10px;border-bottom:1px solid var(--line);background:var(--sunk);vertical-align:bottom}
.gt th small{display:block;font:500 .66rem var(--f-mono);letter-spacing:.03em;text-transform:none;color:var(--muted);margin-top:2px}
.gt th.clue{background:var(--clue-bg);color:var(--clue-ink)}
.gt th.clue small{color:var(--clue-ink)}
.gt td{padding:5px;border-bottom:1px solid var(--line);vertical-align:top;min-width:120px}
.gt tr:last-child td{border-bottom:0}
.gt td + td,.gt th + th{border-left:1px solid var(--line)}
.cell{width:100%;min-height:44px;border-radius:8px;padding:7px 9px;font-size:.88rem;line-height:1.3;text-align:left;display:flex;align-items:center;gap:6px}
.cell.given{background:var(--given);font-weight:600}
.cell.clue{background:var(--clue-bg);color:var(--clue-ink);border:1px solid var(--clue-line);font-weight:600}
.cell.empty{border:1.5px dashed var(--line);background:transparent;cursor:pointer;color:var(--muted)}
.cell.empty:hover,.cell.empty.drop{border-color:var(--accent);color:var(--ink)}
.cell.sel{border:2px solid var(--accent);background:color-mix(in srgb,var(--accent) 10%,transparent);color:var(--ink)}
.cell.locked{background:var(--lock);color:var(--muted);border:1px solid var(--line);cursor:not-allowed;font-size:.78rem}
.cell.locked svg{width:13px;height:13px;flex:none}
.cell.filled{background:var(--ok-bg);border:1px solid var(--ok);font-weight:600}
.cell.pop{animation:pop .35s}
@keyframes pop{0%{transform:scale(.94)}60%{transform:scale(1.03)}100%{transform:scale(1)}}
.cell.err{animation:shake .32s;border-color:var(--bad)}
.bank{background:var(--surface);border:1.5px solid var(--accent);border-radius:12px;padding:12px;display:grid;gap:8px;scroll-margin-bottom:16px}
.bank .bh{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center;font-size:.86rem}
.bank .bh b{font-weight:700}
.tiles{display:flex;flex-wrap:wrap;gap:6px;max-height:34vh;overflow:auto}
.tile{font:600 .84rem var(--f-body);background:var(--sunk);border:1.5px solid var(--line);border-radius:8px;padding:7px 10px;cursor:grab;display:inline-flex;gap:6px;align-items:center;max-width:100%;text-align:left}
.tile:hover:not([disabled]){border-color:var(--accent)}
.tile .ct{font:500 .7rem var(--f-mono);color:var(--muted)}
.tile.out{opacity:.45;text-decoration:line-through;cursor:default}
.tile.dragging{opacity:.4}
.toast{font-size:.86rem;font-weight:600}
.toast:empty{display:none}
@media (max-width:560px){.tabs .long{display:none}}
.toast.bad{color:var(--bad)}
.toast.ok{color:var(--ok)}
.notes{display:grid;gap:6px;margin:0;padding:0;list-style:none}
.notes li{border-left:3px solid var(--ok);background:var(--surface);border-radius:6px;padding:6px 10px;font-size:.88rem}
.notes li b{font-weight:700}
.gdone{display:grid;gap:12px}
footer{font-size:.78rem;color:var(--muted);border-top:1px solid var(--line);padding-top:12px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.empty-state{color:var(--muted);font-size:.9rem}
#app{display:grid;gap:16px;min-width:0}
</style>

const DATA = {"id": "cns01-03", "code": "CNS01–03", "title": "Neurons, Glia & Synaptic Signaling", "blurb": "Match glia, neuron parts, synapse machinery, transmitters, receptors and toxins — then lock in synthesis pathways and receptor charts.", "lectures": [{"k": "01", "name": "Cells of the CNS: Glia and Neurons", "disc": "neuro"}, {"k": "02", "name": "Neuronal Communication I: Synapses & Neurotransmitters", "disc": "neuro"}, {"k": "03", "name": "Neuronal Communication II: Neurotransmitters & Neuromodulators", "disc": "neuro"}], "los": {"01.1": "List and describe key features and functions of CNS glial cell types (astrocytes, oligodendrocytes, microglia).", "01.2": "Know the role of glia in neurologic disorders (gliomas, MS, PML, HIV, neurodegeneration, stroke, meningitis).", "01.3": "Know neuron structure and the function of cytoskeleton, dendrites, cell body, axon, axon hillock, terminals and synapse.", "01.4": "Know the role of anterograde (kinesin) and retrograde (dynein) axonal transport in neuron function and disease.", "02.1": "Know the basic components of a chemical synapse and how it differs from an electrical synapse.", "02.2": "Explain the steps in chemical neurotransmission, including ionotropic vs metabotropic postsynaptic signaling.", "02.3": "Know the criteria a molecule must meet to be considered a neurotransmitter.", "02.4": "Explain synthesis, storage, release, receptor binding and termination for acetylcholine and glutamate.", "02.5": "Know the location of major nuclei rich in acetylcholine and glutamate and their receptors.", "03.1": "Know the role of neuromodulators and which neurotransmitters act as neuromodulators.", "03.2": "Know the class of each neurotransmitter (amino acid, catecholamine, biogenic amine, peptide, lipid).", "03.3": "Explain synthesis, storage, release, receptors and termination for amines, GABA, glycine, peptides, endocannabinoids.", "03.4": "Know the location of major nuclei with high concentrations of each neurotransmitter and their receptors.", "03.5": "Identify CNS neurotransmitters and receptors that are predominantly excitatory vs inhibitory.", "03.6": "Compare synthesis, storage, release and metabolism of neuropeptides vs small-molecule neurotransmitters."}, "sets": [{"id": "s01", "lec": "01", "lo": "01.1", "kind": "structure-function", "title": "Glial cell → defining function", "left": "Cell", "right": "Defining function", "pairs": [{"a": "Astrocyte", "b": "GFAP-positive star-shaped cell whose endfeet on capillaries help form the BBB and buffer ions", "why": "Most abundant and largest glia. GFAP is the marker; protoplasmic (gray) vs fibrous (white) forms. Endfeet + endothelium = BBB; endfeet + pia = glia limitans.", "hy": true}, {"a": "Interfascicular oligodendrocyte", "b": "White-matter cell that wraps its membrane around segments of several different CNS axons", "why": "One oligodendrocyte myelinates MANY axons (vs one Schwann cell per internode). Myelin is ~80% lipid and contains CNS-specific proteins such as myelin basic protein.", "hy": true}, {"a": "Perineuronal oligodendrocyte", "b": "Gray-matter cell hugging neuronal cell bodies; makes no myelin, supports via soluble factors", "why": "Trap: not every oligodendrocyte makes myelin. Gray-matter (perineuronal) oligodendrocytes surround somata and are thought to support neurons by releasing soluble molecules."}, {"a": "Microglia", "b": "Smallest glial cell; resident macrophage-like immune cell that surveys, phagocytoses and prunes synapses", "why": "Microglia are the CNS resident immune cells (mesoderm/monocyte lineage). They migrate, phagocytose debris and dying cells, and prune synapses throughout life.", "hy": true}, {"a": "Radial glia", "b": "Developmental scaffold of long processes along which newborn neurons migrate outward", "why": "During development, radial glia provide the scaffolding for migrating neurons — part of the astrocyte lineage's role in guiding neuronal migration."}, {"a": "Schwann cell", "b": "Peripheral glial cell that myelinates a single internode of one PNS axon", "why": "Contrast: CNS axons are myelinated by oligodendrocytes, PNS axons by Schwann cells. Explains why MS spares peripheral nerves and Guillain-Barré spares the CNS."}]}, {"id": "s02", "lec": "01", "lo": "01.1", "kind": "term-def", "title": "Microglial state → meaning", "left": "Microglial feature", "right": "What it means", "pairs": [{"a": "Ramified morphology", "b": "Highly branched resting form that continuously surveys the local environment", "why": "Resting microglia are ramified (branched); they extend and retract processes to monitor the parenchyma for damage or infection."}, {"a": "Amoeboid morphology", "b": "Rounded, retracted, motile form of an activated phagocytic cell", "why": "Activation shifts microglia from ramified to amoeboid — the morphology of a cell that is migrating and phagocytosing debris."}, {"a": "M1 activation phenotype", "b": "Proinflammatory, neurotoxic state releasing TNFα and IL-1β", "why": "M1 = proinflammatory/neurotoxic. TNFα and IL-1β from M1 microglia drive secondary neuron death after stroke/trauma and BBB opening in meningitis.", "hy": true}, {"a": "M2 activation phenotype", "b": "Anti-inflammatory, neuroprotective state that supports tissue repair", "why": "M2 = anti-inflammatory/neuroprotective. Real activation is a spectrum with more subtypes and transition states than this simple binary."}, {"a": "Pathogen-sensing surface receptors", "b": "Bind viral and bacterial molecules to trigger rapid activation", "why": "Like peripheral macrophages, microglia carry receptors for pathogen molecules; their hallmark is the ability to become activated quickly."}, {"a": "Synaptic pruning", "b": "Phagocytic removal of synapses and dying cells during development and life", "why": "Microglia phagocytose neurons undergoing developmental programmed cell death and prune synapses throughout life — key to synaptic plasticity."}]}, {"id": "s03", "lec": "01", "lo": "01.2", "kind": "disease-finding", "title": "Neurologic disorder → glial role", "left": "Disorder", "right": "Glial role / finding", "pairs": [{"a": "Glioblastoma (GBM)", "b": "Grade IV astrocytoma; most malignant glial tumor with very poor survival", "why": "Astrocytomas are the most common glial tumor, graded I–IV by differentiation. GBM = grade IV astrocytoma (GFAP+); often a ring-enhancing mass crossing the corpus callosum.", "hy": true}, {"a": "Multiple sclerosis", "b": "Autoimmune attack on myelin basic protein after BBB breach; oligodendrocytes and myelin lost", "why": "Idiopathic inflammatory demyelination. When the BBB is compromised, CNS-specific myelin proteins trigger autoimmunity via infiltrating peripheral immune cells.", "hy": true}, {"a": "Progressive multifocal leukoencephalopathy", "b": "JC polyomavirus destroys oligodendrocytes, causing fatal multifocal demyelination", "why": "PML = JC virus (human polyomavirus 2) infecting oligodendrocytes, classically in immunosuppressed patients (AIDS, natalizumab). Rare and fatal.", "hy": true}, {"a": "HIV-associated neurologic disease", "b": "Virus infects microglia, driving inflammation and bystander neuron death", "why": "Microglia are the main CNS cell infected by HIV (they express CD4/CCR5); infected microglia fuse into multinucleated giant cells and release neurotoxic factors."}, {"a": "Spinal cord or brain injury", "b": "Reactive astrogliosis forms a dense glial scar at the lesion", "why": "Astrocytes can proliferate (astrogliosis) and form scar after injury; the scar walls off damage but also impedes axon regrowth."}, {"a": "Secondary injury after stroke", "b": "Activated microglia secrete TNFα and IL-1β that kill neurons beyond the initial insult", "why": "Part of secondary neuron death after stroke and trauma is due to neurotoxic proinflammatory molecules (TNFα, IL-1β) from activated microglia."}, {"a": "Bacterial meningitis", "b": "Excess microglial cytokines open the BBB, letting leukocytes flood in and worsen infection", "why": "Excessive TNFα and IL-1β promote BBB opening; leukocyte infiltration exacerbates the infection and inflammation."}]}, {"id": "s04", "lec": "01", "lo": "01.3", "kind": "structure-function", "title": "Neuron structure → function", "left": "Neuron part", "right": "Function", "pairs": [{"a": "Dendrites", "b": "Unmyelinated, branched processes that carry input from distal to proximal toward the soma", "why": "Dendrites receive signals via postsynaptic receptors; information converges at the cell body. Primary dendrites branch off the soma, secondary off primary."}, {"a": "Dendritic spine head", "b": "Small protrusion that is the major site of postsynaptic ionotropic glutamate signaling", "why": "Mature spines are mushroom-shaped (flat head, short shaft) and change with activity. Autism is associated with an excess of thin, immature spines.", "hy": true}, {"a": "Cell body (soma)", "b": "Metabolic center with euchromatic nucleus, big nucleolus and extensive RER and Golgi", "why": "Highly active neurons need constant gene expression (euchromatin), rRNA (nucleolus), protein synthesis (RER = Nissl substance) and sorting (Golgi), plus many mitochondria.", "hy": true}, {"a": "Axon hillock", "b": "Cone where the single axon leaves the soma; with the initial segment, the AP trigger zone", "why": "Axons arise at the hillock. Summed EPSPs/IPSPs are read at the hillock–initial segment region (dense Na⁺ channels, lowest threshold), where the action potential is initiated."}, {"a": "Presynaptic (axon) terminal", "b": "Site of small-molecule transmitter synthesis and Ca²⁺-triggered vesicle release", "why": "Small-molecule transmitters are made locally in the terminal from enzymes shipped down the axon; neuropeptides, by contrast, are made in the soma."}, {"a": "Node of Ranvier", "b": "Unmyelinated gap packed with Na⁺ channels where the AP regenerates and leaps", "why": "Low resistance and dense Na⁺ channels at nodes allow saltatory conduction — the AP jumps node to node, greatly speeding conduction.", "hy": true}, {"a": "Internode", "b": "Myelin-wrapped axon segment whose high resistance insulates and speeds conduction", "why": "Each myelinated segment (internode) is followed by a node. Myelin raises membrane resistance so current spreads quickly to the next node."}, {"a": "Axonal microtubules", "b": "Polarized cytoskeletal tracks along which kinesin and dynein carry cargo", "why": "The cytoskeleton has microtubules, neurofilaments (intermediate filaments) and actin. Microtubules plus MAPs (e.g., tau) support shape and transport."}]}, {"id": "s05", "lec": "01", "lo": "01.4", "kind": "term-app", "title": "Axonal transport: cargo or agent → route", "left": "Motor / cargo / agent", "right": "Transport and consequence", "pairs": [{"a": "Kinesin", "b": "Motor protein carrying cargo away from the soma toward the axon terminal (anterograde)", "why": "Kinesin = anterograde (soma → terminal). Memory: Kinesin Kicks cargo out to the periphery.", "hy": true}, {"a": "Dynein", "b": "Motor protein carrying cargo from the terminal back toward the soma (retrograde)", "why": "Dynein = retrograde (terminal → soma). Memory: Dynein Drags cargo home. Hijacked by rabies, HSV and tetanus toxin.", "hy": true}, {"a": "Neurotrophins (growth factors)", "b": "Taken up at the terminal and carried retrograde to the soma to signal survival", "why": "Retrograde transport returns endocytic vesicles, organelles and neurotrophins from terminals and dendrites to the cell body."}, {"a": "ChAT and other synthetic enzymes", "b": "Made on soma RER and carried anterograde so the terminal can make transmitter", "why": "Small-molecule transmitter enzymes are synthesized in the soma, sent anterograde, and then make transmitter locally in the terminal."}, {"a": "Rabies virus", "b": "Enters nerve terminals at the bite site and climbs retrograde into the CNS", "why": "Rabies travels retrograde via dynein; incubation length reflects distance from bite to CNS. Negri bodies in Purkinje cells and hippocampus.", "hy": true}, {"a": "Herpes simplex virus", "b": "Travels retrograde to the sensory ganglion for latency, anterograde on reactivation", "why": "HSV rides retrograde to the trigeminal or dorsal root ganglion, lies latent, then travels anterograde to cause recurrent lesions."}, {"a": "Tetanus toxin", "b": "Ascends retrograde into the cord, then blocks inhibitory transmitter release causing spasm", "why": "Tetanospasmin moves retrograde to spinal inhibitory interneurons and cleaves SNAREs, blocking glycine/GABA release → spastic paralysis, trismus, risus sardonicus.", "hy": true}]}, {"id": "s06", "lec": "02", "lo": "02.1", "kind": "structure-function", "title": "Synapse component → function", "left": "Component", "right": "Function", "pairs": [{"a": "Gap junction (connexons)", "b": "Pore linking two neurons' cytoplasm for direct, passive, bidirectional current flow", "why": "Electrical synapses are extremely fast and bidirectional, synchronizing populations (e.g., brainstem neurons generating respiratory rhythm).", "hy": true}, {"a": "Active zone", "b": "Specialized presynaptic membrane region where vesicles dock and fuse", "why": "Transmitter is secreted at the active zone, usually at the axon terminal; clathrin-mediated endocytosis occurs away from it."}, {"a": "Synaptic cleft", "b": "20–40 nm gap; pre- and postsynaptic cytoplasm is NOT shared", "why": "Chemical synapses have no intercellular continuity — the signal must cross the cleft as a chemical, making transmission unidirectional."}, {"a": "Postsynaptic density", "b": "Protein scaffold anchoring receptors and adaptors at excitatory synapses", "why": "The postsynaptic density holds neurotransmitter receptors plus adaptor proteins that stabilize them; it is prominent at excitatory (glutamatergic) synapses."}, {"a": "Voltage-gated Ca²⁺ channels", "b": "Open on depolarization so terminal Ca²⁺ rises about 1000-fold", "why": "Ca²⁺ entry via VGCCs is the trigger for release — the reason release is Ca²⁺-dependent (a criterion for a neurotransmitter)."}, {"a": "Synaptotagmin", "b": "Ca²⁺ sensor on the vesicle that triggers fusion when Ca²⁺ binds", "why": "Synaptotagmin senses the Ca²⁺ rise and triggers the SNARE machinery to complete fusion."}, {"a": "SNARE complex", "b": "Protein complex zippering vesicle to membrane; cleaved by botulinum and tetanus toxins", "why": "Both botulinum and tetanus toxins are proteases that cleave SNAREs; they differ in which neurons they hit (motor terminals vs spinal inhibitory interneurons).", "hy": true}, {"a": "Clathrin", "b": "Coat protein forming pits that retrieve vesicle membrane for recycling", "why": "After fusion, clathrin-coated pits form away from the active zone; the coat is removed, SNAREs are added, and vesicles are reloaded."}]}, {"id": "s07", "lec": "02", "lo": "02.3", "kind": "term-app", "title": "Neurotransmitter criterion → evidence that meets it", "left": "Criterion", "right": "Supporting evidence", "pairs": [{"a": "Synthesized in the neuron", "b": "ChAT is found only in cholinergic neurons, so ACh is made where it is released", "why": "Criterion 1: the molecule (and its biosynthetic machinery) must be present in the presynaptic neuron."}, {"a": "Ca²⁺-dependent release on depolarization", "b": "Stimulating the terminal in a Ca²⁺-free bath abolishes release of the molecule", "why": "Criterion 2: release must follow presynaptic depolarization and depend on Ca²⁺ influx through VGCCs.", "hy": true}, {"a": "Specific postsynaptic receptors", "b": "Applying the molecule mimics the synaptic response; a selective antagonist blocks it", "why": "Criterion 3: receptors on the postsynaptic cell bind the molecule with high specificity."}, {"a": "Specific termination mechanism", "b": "AChE hydrolysis or transporter reuptake rapidly clears the molecule from the cleft", "why": "Criterion 4: there must be a way to end its action. Every criterion step is also a drug target."}, {"a": "Unconventional transmitter status", "b": "Release is Ca²⁺-dependent but molecule is not stored in vesicles and acts retrograde", "why": "Endocannabinoids count as transmitters (Ca²⁺-dependent, interneuronal signaling) but are unconventional: no vesicles, made postsynaptically, act presynaptically."}]}, {"id": "s08", "lec": "02", "lo": "02.4", "kind": "drug-mech", "title": "Cholinergic drug/toxin → mechanism", "left": "Agent", "right": "Mechanism / effect", "pairs": [{"a": "Botulinum toxin", "b": "Cleaves SNAREs in cholinergic terminals → no ACh release → flaccid paralysis", "why": "Botulinum = flaccid (descending paralysis, floppy baby with honey). Tetanus = spastic. Same SNARE target, different neurons.", "hy": true}, {"a": "α-Bungarotoxin", "b": "Snake-venom competitive antagonist of the ionotropic (nicotinic) ACh receptor", "why": "α-Bungarotoxin binds nicotinic receptor α subunits, blocking fast ACh transmission; used experimentally to label nicotinic receptors."}, {"a": "Atropine", "b": "Competitive antagonist of the metabotropic (muscarinic, M1–M5) ACh receptors", "why": "Atropine blocks muscarinic GPCRs — dry, hot, red, blind, mad; it does NOT block nicotinic receptors at the NMJ.", "hy": true}, {"a": "Donepezil", "b": "Inhibits acetylcholinesterase → more synaptic ACh; used in Alzheimer disease", "why": "Alzheimer disease involves degeneration of cholinergic neurons (nucleus basalis) with reduced cortical/hippocampal ACh; AChE inhibitors partially compensate.", "hy": true}, {"a": "Hemicholinium-3", "b": "Blocks the choline transporter, the rate-limiting step of ACh synthesis", "why": "ACh synthesis is limited by choline availability (uptake via ChT), not by ChAT activity. Blocking choline uptake depletes ACh."}, {"a": "Nicotine", "b": "Agonist at the fast ACh-gated Na⁺/K⁺ channel (e.g., brain α4β2 subtype)", "why": "Nicotinic receptors are ionotropic with α/β subunit combinations; α4β2 is the common brain subtype. Response is brief and fast."}, {"a": "Muscarine", "b": "Agonist at the slow G-protein–coupled ACh receptors, pre- and postsynaptic", "why": "Muscarinic receptors (M1–M5) are metabotropic: slower, longer-lasting responses, found both pre- and postsynaptically."}]}, {"id": "s09", "lec": "02", "lo": "02.4", "kind": "cause-effect", "title": "Postsynaptic event → consequence", "left": "Event", "right": "Consequence", "pairs": [{"a": "Glutamate opens AMPA receptors", "b": "Fast EPSP: Na⁺ entry makes the membrane less negative within milliseconds", "why": "AMPA receptors have fast kinetics and desensitize rapidly; they provide the initial depolarization at glutamatergic synapses."}, {"a": "GABA opens GABA-A receptors", "b": "Fast IPSP: Cl⁻ entry makes the membrane more negative, firing less likely", "why": "Ion selectivity determines the effect. Cl⁻ influx hyperpolarizes (in the mature brain; GABA is excitatory in the developing brain)."}, {"a": "GABA activates GABA-B receptors", "b": "Slow, prolonged hyperpolarization via G-protein–opened K⁺ channels", "why": "GABA-B is metabotropic: G proteins open K⁺ channels (K⁺ efflux) and inhibit Ca²⁺ influx — slow inhibition."}, {"a": "Depolarization of an NMDA-bearing spine", "b": "Mg²⁺ is expelled from the pore so the glutamate-bound channel can conduct", "why": "NMDA receptors are both ligand-gated and voltage-dependent: they need glutamate, a co-agonist (glycine/serine), AND depolarization to relieve Mg²⁺ block.", "hy": true}, {"a": "Ca²⁺ entry through NMDA receptors", "b": "Activates intracellular kinase pathways underlying plasticity, learning and memory", "why": "NMDA is permeable to Ca²⁺ (unlike most AMPA receptors); Ca²⁺ acts as a second messenger driving long-term potentiation."}, {"a": "Massive glutamate release after ischemia", "b": "Ca²⁺ overload and excitotoxic neuronal death", "why": "Glutamate is implicated in ischemic brain damage, stroke and epilepsy — excess NMDA-mediated Ca²⁺ entry triggers excitotoxicity.", "hy": true}, {"a": "Presynaptic mGluR activation", "b": "Presynaptic inhibition: less transmitter released per action potential", "why": "Metabotropic glutamate receptors on the terminal reduce release; postsynaptic mGluRs can excite or inhibit depending on G protein."}, {"a": "Summation of EPSPs and IPSPs", "b": "Decides whether threshold is reached at the axon initial segment and an AP fires", "why": "The postsynaptic cell integrates all excitatory and inhibitory potentials; only the net depolarization at the trigger zone determines firing."}]}, {"id": "s10", "lec": "03", "lo": "03.3", "kind": "drug-mech", "title": "GABA/glycine drug or toxin → mechanism", "left": "Agent", "right": "Mechanism / effect", "pairs": [{"a": "Benzodiazepines", "b": "Bind GABA-A α/γ2 interface → ↑ Cl⁻ opening frequency; anxiolytic and anticonvulsant", "why": "Benzos (FREnzodiazepines) ↑ opening frequency and need GABA present; broad α-subunit binding gives anxiolytic, anticonvulsant and hypnotic effects. Reversal agent: flumazenil.", "hy": true}, {"a": "Barbiturates", "b": "Bind GABA-A allosterically → ↑ duration of Cl⁻ channel opening", "why": "Barbs (barbiDURATes) prolong opening and can open the channel directly at high doses — narrower safety margin than benzodiazepines.", "hy": true}, {"a": "Muscimol", "b": "Classic direct agonist at the GABA-A ligand-binding site", "why": "Muscimol (from Amanita mushrooms) is the classic GABA-A agonist and a CNS depressant."}, {"a": "Bicuculline", "b": "Classic competitive antagonist at the GABA-A ligand-binding site", "why": "Bicuculline competes with GABA at its binding site; blocking GABA-A inhibition induces seizures."}, {"a": "Picrotoxin", "b": "Blocks the GABA-A Cl⁻ pore itself (non-competitive) → seizures", "why": "Picrotoxin is a channel blocker, not a binding-site antagonist — distinguish from bicuculline. Both are convulsants."}, {"a": "Strychnine", "b": "Blocks the glycine-gated Cl⁻ channel in brainstem and cord → convulsions", "why": "About half of spinal inhibitory synapses use glycine; losing that inhibition causes violent convulsions and opisthotonus with a clear sensorium.", "hy": true}, {"a": "Baclofen", "b": "Agonist at the GABA-B G-protein receptor; used for spasticity", "why": "Baclofen activates GABA-B (metabotropic: ↑K⁺ efflux, ↓Ca²⁺ influx) to reduce spasticity, e.g., in MS or spinal cord injury."}, {"a": "Zolpidem", "b": "Nonbenzodiazepine hypnotic selective for α1 (BZ1) GABA-A; little anticonvulsant effect", "why": "Zolpidem acts at the benzodiazepine site but only on α1-containing GABA-A receptors, so it is mainly a sleep aid with weak anxiolytic/anticonvulsant action; also reversed by flumazenil."}]}, {"id": "s11", "lec": "03", "lo": "03.3", "kind": "structure-function", "title": "Receptor → ion channel or G protein", "left": "Receptor", "right": "Mechanism", "pairs": [{"a": "AMPA receptor", "b": "Fast Na⁺/K⁺ channel; edited GluA2 subunit makes most Ca²⁺-impermeable", "why": "AMPA, NMDA and kainate are named for their synthetic agonists. AMPA: tetramer, fast kinetics, rapid desensitization.", "hy": true}, {"a": "NMDA receptor", "b": "Na⁺/K⁺/Ca²⁺ channel needing glycine co-agonist and depolarization to expel Mg²⁺", "why": "Unique: ligand-gated AND voltage-dependent. Slower kinetics than AMPA. Glycine/D-serine is a required co-agonist.", "hy": true}, {"a": "GABA-A receptor", "b": "Pentameric ligand-gated Cl⁻ channel with benzodiazepine and barbiturate sites", "why": "GABA-A: two GABA binding sites; potentiated by benzodiazepines, barbiturates, alcohol, anesthetics, zolpidem."}, {"a": "GABA-B receptor", "b": "Gi/o-coupled receptor opening K⁺ channels and blocking Ca²⁺ entry; activated by baclofen", "why": "Slow inhibition. Implicated in seizures, dystonia, pain and psychiatric disorders; target of baclofen."}, {"a": "Glycine receptor", "b": "Pentameric strychnine-sensitive Cl⁻ channel concentrated in brainstem and cord", "why": "Glycine signals through ionotropic receptors ONLY. Structure resembles GABA-A (pentamer)."}, {"a": "5-HT3 receptor", "b": "Only ionotropic serotonin receptor: nonselective cation channel blocked by antiemetics", "why": "All other 5-HT receptors are GPCRs. 5-HT3 antagonists (ondansetron) treat chemotherapy-induced and postoperative nausea.", "hy": true}, {"a": "D1-like dopamine receptor", "b": "Gs-coupled: ↑ adenylyl cyclase → ↑ cAMP and protein phosphorylation", "why": "Catecholamines act ONLY through metabotropic receptors. D1-like = Gs (stimulatory)."}, {"a": "D2-like dopamine receptor", "b": "Gi-coupled: ↓ adenylyl cyclase → ↓ cAMP; blocked by antipsychotics", "why": "D2-like = Gi (inhibitory); the main target of antipsychotics (blockade). Presynaptic catecholamine autoreceptors are also Gi. GABA-B is Gi/o too, but is defined by K⁺ opening and baclofen.", "hy": true}]}, {"id": "s12", "lec": "03", "lo": "03.1", "kind": "term-def", "title": "Neuromodulation concept → definition", "left": "Concept", "right": "Definition", "pairs": [{"a": "Neuromodulator", "b": "Transmitter that influences many neurons at once by altering responses to other transmitters", "why": "Neuromodulators (DA, NE, 5-HT, histamine, ACh, neuropeptides, endocannabinoids) don't simply carry excitation or inhibition; they tune circuits.", "hy": true}, {"a": "Volume transmission", "b": "Diffuse release that spreads beyond the cleft to reach distant receptors", "why": "Neuromodulators are often released away from synapses or diffuse out of the cleft, affecting groups of neurons."}, {"a": "Retrograde signaling", "b": "Messenger made by the postsynaptic cell that acts back on the presynaptic terminal", "why": "Endocannabinoids are the prototype: postsynaptic synthesis, presynaptic CB1 action."}, {"a": "Co-localization", "b": "Neuropeptide and small-molecule transmitter stored together in one terminal", "why": "Example: opioid peptides with GABA. The peptide may diffuse laterally to enhance small-molecule transmitter release at neighboring terminals."}, {"a": "Dense-core vesicle", "b": "Large vesicle that carries neuropeptides from the soma to the terminal", "why": "Neuropeptides are packaged in dense-core vesicles in the soma, unlike small-molecule transmitters loaded into small clear vesicles at the terminal."}, {"a": "Presynaptic inhibition", "b": "Reduced transmitter release caused by receptor activation on the terminal", "why": "Produced by presynaptic mGluRs, Gi autoreceptors, GABA-B and CB1 receptors; neuromodulators often act presynaptically."}, {"a": "Prepropeptide processing", "b": "Proteolytic cleavage of one precursor into several active peptides", "why": "Removing the signal sequence and further cleavage can yield multiple active neuropeptides from one precursor (e.g., POMC → ACTH, β-endorphin)."}, {"a": "GPCR signal amplification", "b": "One receptor activates many G proteins, generating thousands of second messengers", "why": "Why metabotropic signaling is slow but potent and long-lasting (seconds to hours)."}]}, {"id": "s13", "lec": "03", "lo": "03.4", "kind": "term-app", "title": "CNS nucleus → transmitter and clinical link", "left": "Nucleus / site", "right": "Transmitter and clinical link", "pairs": [{"a": "Substantia nigra pars compacta", "b": "Dopamine neurons projecting to striatum; lost in Parkinson disease", "why": "Midbrain dopamine neurons: SNc (nigrostriatal motor pathway) and VTA (reward). Loss of SNc neurons → bradykinesia, rigidity, resting tremor.", "hy": true}, {"a": "Ventral tegmental area", "b": "Dopamine neurons of the mesolimbic reward pathway; drug addiction", "why": "VTA dopamine projects to nucleus accumbens/limbic cortex — the drug reward pathway."}, {"a": "Locus ceruleus", "b": "Norepinephrine neurons projecting almost everywhere; arousal, fear and stress", "why": "Pontine locus ceruleus = main NE source; regulates sleep-wake, anxiety, depression. Target of antidepressants, anxiolytics and antihypertensives.", "hy": true}, {"a": "Raphe nuclei", "b": "Serotonin neurons regulating sleep and mood; pathway targeted by SSRIs and MAOIs", "why": "Midline brainstem raphe nuclei produce CNS serotonin (though ~80% of body serotonin is made in the gut).", "hy": true}, {"a": "Tuberomammillary hypothalamus", "b": "Histamine neurons for arousal; sedating antihistamines block them", "why": "CNS histamine comes from hypothalamic neurons with sparse but widespread projections; also controls vestibular reactivity. Diphenhydramine crosses the BBB → sedation."}, {"a": "Medulla and lateral tegmental system", "b": "Sparse epinephrine neurons projecting to hypothalamus; respiration and cardiac control", "why": "Adrenergic (epinephrine) neurons are found at low levels in the brain; PNMT is present only in these neurons and the adrenal medulla."}, {"a": "Brainstem and spinal cord interneurons", "b": "Glycine-releasing inhibitory neurons; target of strychnine", "why": "Glycine receptors are localized to brainstem and spinal cord; ~half of spinal inhibitory synapses use glycine."}, {"a": "Striatal and cerebellar projection neurons", "b": "GABA projection neurons (medium spiny, Purkinje) rather than local interneurons", "why": "GABA is used at ~1/3 of brain synapses, mostly by local interneurons, but striatal medium spiny neurons and cerebellar Purkinje cells are GABAergic projection neurons."}]}, {"id": "s14", "lec": "02", "lo": "02.5", "kind": "term-app", "title": "Cholinergic or glutamatergic site → role", "left": "Site", "right": "Transmitter and role", "pairs": [{"a": "Nucleus basalis of Meynert", "b": "Cholinergic projection neurons to cortex; degenerate early in Alzheimer disease", "why": "Loss of basal forebrain cholinergic neurons → reduced cortical/hippocampal ACh — rationale for AChE inhibitors (donepezil).", "hy": true}, {"a": "Medial septal nucleus", "b": "Cholinergic projection neurons to the hippocampus supporting memory", "why": "Septo-hippocampal cholinergic input helps drive hippocampal rhythms used in learning and memory."}, {"a": "Striatal interneurons", "b": "Local-circuit cholinergic interneurons modulating striatal output", const pool=()=>ITEMS.filter(it=>F.lecs.has(it.lec)&&F.kinds.has(it.kind)&&(F.focus==="all"||(F.focus==="new"?!mastered(it.key):(S.items[it.key]&&S.items[it.key].last===false))));

/* ---------- router ---------- */
let view="home";
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>go(b.dataset.view));
function go(v,arg){
  stopTimer();
  view=v;
  document.querySelectorAll(".tabs button").forEach(b=>b.setAttribute("aria-selected",String(b.dataset.view===(v==="rfplay"||v==="rfend"?"rf":v==="grid"?"glist":v))));
  if(v==="home")renderHome();
  else if(v==="rf")renderRFSetup();
  else if(v==="rfplay")renderQ();
  else if(v==="rfend")renderEnd();
  else if(v==="glist")renderGList();
  else if(v==="grid")startGrid(arg);
  window.scrollTo({top:0,behavior:"smooth"});
}

/* ---------- shared bits ---------- */
function segHTML(name,label,opts,cur){return `<div class="optrow"><span class="lab">${label}</span><div class="seg" role="group" aria-label="${label}">${opts.map(([v,t])=>`<button type="button" data-${name}="${v}" aria-pressed="${v===cur}">${t}</button>`).join("")}</div></div>`;}
function bindSeg(root,name,cb){root.querySelectorAll(`[data-${name}]`).forEach(b=>b.onclick=()=>{F[name]=b.dataset[name];root.querySelectorAll(`[data-${name}]`).forEach(x=>x.setAttribute("aria-pressed",String(x===b)));cb&&cb();});}
function lecChips(){return `<div class="optrow"><span class="lab">Lectures</span><div class="chips">${DATA.lectures.map(l=>`<button type="button" class="chip" data-lec="${l.k}" aria-pressed="${F.lecs.has(l.k)}" style="--c:var(--${l.disc})"><i></i>${esc(lecLabel(l.k))} · ${esc(l.name)}</button>`).join("")}</div></div>`;}
function kindChips(){const present=[...new Set(ITEMS.map(i=>i.kind))];return `<div class="optrow"><span class="lab">Match types</span><div class="chips">${present.map(k=>`<button type="button" class="chip" data-kind="${k}" aria-pressed="${F.kinds.has(k)}" style="--c:var(${KIND[k].c})"><i></i>${KIND[k].l} <span class="n">${ITEMS.filter(i=>i.kind===k).length}</span></button>`).join("")}</div></div>`;}
function bindChips(root,cb){
  root.querySelectorAll("[data-lec]").forEach(b=>b.onclick=()=>{const k=b.dataset.lec;if(F.lecs.has(k)){if(F.lecs.size>1)F.lecs.delete(k);}else F.lecs.add(k);b.setAttribute("aria-pressed",String(F.lecs.has(k)));cb&&cb();});
  root.querySelectorAll("[data-kind]").forEach(b=>b.onclick=()=>{const k=b.dataset.kind;if(F.kinds.has(k)){const vis=[...F.kinds].filter(x=>ITEMS.some(i=>i.kind===x));if(vis.length>1)F.kinds.delete(k);}else F.kinds.add(k);b.setAttribute("aria-pressed",String(F.kinds.has(k)));cb&&cb();});
}
function stars(n){return `<span class="stars" aria-label="${n} of 3 stars">${[1,2,3].map(i=>i<=n?"★":'<span class="off">★</span>').join("")}</span>`;}

/* ---------- RAPID FIRE: setup ---------- */
function renderRFSetup(){
  $("#app").innerHTML=`
  <section class="panel opts">
    <h2>Rapid Fire setup</h2>
    ${lecChips()}
    ${kindChips()}
    ${segHTML("len","Length",[["10","10"],["20","20"],["40","40"],["all","All"]],F.len)}
    ${segHTML("timer","Shot clock",[["off","Off"],["20","20 s"],["10","10 s"]],F.timer)}
    ${segHTML("dir","Direction",[["fwd","Forward"],["mixed","Mixed"]],F.dir)}
    ${segHTML("focus","Focus",[["all","Everything"],["new","Not mastered"],["miss","Last missed"]],F.focus)}
    <div class="navrow"><span class="ask" id="poolCt"></span><button class="btn primary" id="startRF" type="button">Start &rarr;</button></div>
  </section>`;

/* ---------- RAPID FIRE: play ---------- */
let RF=null, timerId=null;
function stopTimer(){if(timerId){cancelAnimationFrame(timerId);timerId=null;}}
function startRF(){
  let p=shuffle(pool());
  // interleave so the same set doesn't come back to back
  const out=[];while(p.length){let i=p.findIndex(x=>!out.length||sid(x)!==sid(out[out.length-1]));if(i<0)i=0;out.push(p.splice(i,1)[0]);}
  const n=F.len==="all"?out.length:Math.min(out.length,+F.len);
  RF={q:out.slice(0,n).map(it=>({it,retry:false})),i:0,score:0,streak:0,best:0,first:0,firstOk:0,misses:[],answered:false};
  go("rfplay");
}
const sid=it=>it.t==="pair"?it.set.id:it.q.id;
function topBar(){
  const tot=RF.q.length;
  return `<div class="rf-top">
    <div class="statrow">
      <div class="stat"><b>${Math.min(RF.i+1,tot)}/${tot}</b><span>Card</span></div>
      <div class="stat"><b>${RF.score}</b><span>Score</span></div>
      <div class="stat"><b>${RF.streak}</b><span>Streak</span></div>
      <div class="stat"><b>${RF.first?Math.round(100*RF.firstOk/RF.first)+"%":"—"}</b><span>First-try accuracy</span></div>
    </div>
    <button class="btn sm" type="button" id="quitRF">End round</button>
  </div>
  <div class="bar"><i style="width:${100*RF.i/tot}%;background:var(--accent)"></i></div>`;
}
function renderQ(){
  if(RF.i>=RF.q.length){go("rfend");return;}
  const cur=RF.q[RF.i]; RF.answered=false;
  if(cur.it.t==="seq")return renderSeq(cur);
  const it=cur.it,s=it.set,p=it.p;
  if(cur.rev===undefined)cur.rev=F.dir==="mixed"&&Math.random()<.3;
  if(!cur.opts){
    const others=shuffle(s.pairs.filter((_,j)=>j!==it.i)).slice(0,3);
    cur.opts=shuffle([p,...others]);
  }
  const K=KIND[s.kind]||KIND["term-def"];
  const promptLab=cur.rev?s.right:s.left, ansLab=cur.rev?s.left:s.right;
  $("#app").innerHTML=`${topBar()}
  <section class="qcard panel">
    <div class="qhead"><span class="kind" style="--kc:var(${K.c})">${cur.rev?esc(K.l.split(" → ").reverse().join(" → ")):K.l}</span>${lecTag(it.lec)}<span class="qset">${esc(s.title)}</span>${cur.retry?'<span class="hy" style="background:var(--once-bg);border-color:var(--once);color:var(--ink)">Retry</span>':""}</div>
    ${F.timer!=="off"?'<div class="timer" aria-hidden="true"><i id="tbar"></i></div>':""}
    <div><div class="prompt-lab">${esc(promptLab)}</div><p class="prompt">${esc(cur.rev?p.b:p.a)}</p></div>
    <p class="ask">Pick the matching ${esc(ansLab.toLowerCase())}.</p>
    <div class="options" role="group" aria-label="Answer choices">
      ${cur.opts.map((o,k)=>`<button type="button" class="opt" data-k="${k}"><span class="key">${k+1}</span><span>${esc(cur.rev?o.a:o.b)}</span></button>`).join("")}
    </div>
    <div id="fbSlot"></div>
  </section>`;
  $("#quitRF").onclick=()=>go("rfend");
  document.querySelectorAll(".opt[data-k]").forEach(b=>b.onclick=()=>answer(+b.dataset.k));
  if(F.timer!=="off")runTimer(+F.timer,()=>answer(-1));
}
function runTimer(sec,onEnd){
  const t0=performance.now();
  const tick=now=>{const f=Math.max(0,1-(now-t0)/(sec*1000));const bar=$("#tbar");if(bar){bar.style.width=(f*100)+"%";bar.classList.toggle("low",f<.3);}RF.tleft=f;if(f<=0){timerId=null;onEnd();return;}timerId=requestAnimationFrame(tick);};
  timerId=requestAnimationFrame(tick);
}
function record(cur,ok){
  const st=itemStat(cur.it.key);st.n++;if(ok){st.ok++;st.run++;}else st.run=0;st.last=ok;
  if(!cur.retry){RF.first++;if(ok)RF.firstOk++;}
  if(ok){RF.streak++;RF.best=Math.max(RF.best,RF.streak);S.best=Math.max(S.best||0,RF.best);}else{RF.streak=0;}
  if(!ok){
    if(!RF.misses.includes(cur.it))RF.misses.push(cur.it);
    if(!cur.retry){const at=Math.min(RF.q.length,RF.i+3+Math.floor(Math.random()*3));RF.q.splice(at,0,{it:cur.it,retry:true});}
  }
  save();
}
function answer(k){
  if(RF.answered)return;RF.answered=true;stopTimer();
  const cur=RF.q[RF.i],it=cur.it,s=it.set,p=it.p;
  const chosen=k>=0?cur.opts[k]:null, ok=chosen===p;
  let pts=0;if(ok){pts=100+Math.min(50,RF.streak*10);if(F.timer!=="off")pts+=Math.round(50*(RF.tleft||0));}
  RF.score+=pts;record(cur,ok);
  document.querySelectorAll(".opt[data-k]").forEach(b=>{const o=cur.opts[+b.dataset.k];b.disabled=true;if(o===p)b.classList.add("correct");else if(o===chosen)b.classList.add("wrong");else b.classList.add("dim");});
  const ansTxt=cur.rev?p.a:p.b;
  let also="";
  if(chosen&&!ok)also=`<p class="also">You picked <b>${esc(cur.rev?chosen.a:chosen.b)}</b>, which matches <b>${esc(cur.rev?chosen.b:chosen.a)}</b>.</p>`;
  $("#fbSlot").innerHTML=`<div class="fb ${ok?"ok":"bad"}">
    <h3>${ok?`Correct · +${pts}`:k<0?"Time's up":"Not quite"}</h3>
    ${ok?"":`<p>Correct match: <b>${esc(ansTxt)}</b></p>`}
    ${p.why?`<p>${esc(p.why)}</p>`:""}
    ${also}
    ${p.hy?`<div class="hybox"><b>High yield · Step 1</b>${esc(p.a)} → ${esc(p.b)}</div>`:""}
    <div class="navrow"><span class="kbd">${ok?"":"This one comes back later in the round. "}Enter = next</span><button class="btn primary" id="nextQ" type="button">Next &rarr;</button></div>
  </div>`;
  $("#nextQ").onclick=next;$("#nextQ").focus({preventScroll:true});
  $("#fbSlot").scrollIntoView({block:"nearest",behavior:"smooth"});
}
function next(){RF.i++;renderQ();}
function renderSeq(cur){
  const q=cur.it.q;
  if(!cur.order){cur.order=shuffle(q.steps.map((_,i)=>i));if(cur.order.every((v,i)=>v===i)&&q.steps.length>1)cur.order.reverse();}
  cur.placed=0;cur.err=0;
  const draw=()=>{
    $("#app").innerHTML=`${topBar()}
    <section class="qcard panel">
      <div class="qhead"><span class="kind" style="--kc:var(${KIND.sequence.c})">${KIND.sequence.l}</span>${lecTag(q.lec)}<span class="qset">${esc(q.title)}</span>${cur.retry?'<span class="hy" style="background:var(--once-bg);border-color:var(--once);color:var(--ink)">Retry</span>':""}</div>
      ${F.timer!=="off"?'<div class="timer" aria-hidden="true"><i id="tbar"></i></div>':""}
      <p class="prompt">${esc(q.prompt)}</p>
      <ol class="seq-done">${q.steps.map((s,i)=>i<cur.placed?`<li>${esc(s)}</li>`:i===cur.placed?`<li class="slot">Tap step ${i+1}…</li>`:"").join("")}</ol>
      <div class="seq-pool" role="group" aria-label="Steps to place">${cur.order.filter(i=>i>=cur.placed).map(i=>`<button type="button" class="opt" data-s="${i}"><span>${esc(q.steps[i])}</span></button>`).join("")}</div>
      <div class="navrow"><span class="kbd">Mistakes: ${cur.err}</span><button class="btn sm" type="button" id="giveUp">Show order</button></div>
      <div id="fbSlot"></div>
    </section>`;
    $("#quitRF").onclick=()=>go("rfend");
    $("#giveUp").onclick=()=>{cur.err=Math.max(cur.err,3);cur.placed=q.steps.length;finishSeq(cur,true);};
    document.querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>{
      const i=+b.dataset.s;
      if(i===cur.placed){cur.placed++;if(cur.placed>=q.steps.length){finishSeq(cur);}else draw();}
      else{cur.err++;b.classList.remove("shake");void b.offsetWidth;b.classList.add("shake");$(".navrow .kbd").textContent="Mistakes: "+cur.err;}
    });
  };
  draw();
  if(F.timer!=="off")runTimer(+F.timer*2,()=>{cur.err=Math.max(cur.err,3);cur.placed=q.steps.length;finishSeq(cur,true);});
}
function finishSeq(cur,gaveUp){
  if(RF.answered)return;RF.answered=true;stopTimer();
  const q=cur.it.q, ok=!gaveUp&&cur.err===0;
  const pts=gaveUp?0:Math.max(0,100-25*cur.err)+(ok?Math.min(50,RF.streak*10):0);
  RF.score+=pts;record(cur,ok);
  $("#app").querySelector(".seq-done").innerHTML=q.steps.map(s=>`<li>${esc(s)}</li>`).join("");
  $("#app").querySelector(".seq-pool").innerHTML="";
  $("#giveUp").remove();
  $("#fbSlot").innerHTML=`<div class="fb ${ok?"ok":"bad"}">
    <h3>${ok?`Perfect order · +${pts}`:gaveUp?"Here's the order":`Done with ${cur.err} mistake${cur.err===1?"":"s"} · +${pts}`}</h3>
    ${q.why?`<p>${esc(q.why)}</p>`:""}
    ${q.hy?`<div class="hybox"><b>High yield · Step 1</b>${esc(q.title)}: know this order cold.</div>`:""}
    <div class="navrow"><span class="kbd">${ok?"":"This one comes back later in the round. "}Enter = next</span><button class="btn primary" id="nextQ" type="button">Next &rarr;</button></div>
  </div>`;
  $("#nextQ").onclick=next;$("#nextQ").focus({preventScroll:true});
}
document.addEventListener("keydown",e=>{
  if(view!=="rfplay"||e.metaKey||e.ctrlKey||e.altKey)return;
  if(/^[1-4]$/.test(e.key)&&!RF.answered){const b=$(`.opt[data-k="${+e.key-1}"]`);if(b){e.preventDefault();b.click();}}
  else if(e.key==="Enter"&&RF.answered&&document.activeElement&&document.activeElement.id!=="quitRF"){const n=$("#nextQ");if(n&&document.activeElement!==n){e.preventDefault();n.click();}}
});

    <h2>Round complete</h2>
    <div class="statrow">
      <div class="stat"><b class="big">${acc}%</b><span>First-try accuracy</span></div>
      <div class="stat"><b class="big">${RF.score}</b><span>Score</span></div>
      <div class="stat"><b class="big">${RF.best}</b><span>Best streak</span></div>
    </div>
    ${RF.misses.length?`<h3>Review your misses</h3><ul class="misslist">${RF.misses.map(it=>it.t==="pair"?`<li>${lecTag(it.lec)} <span class="a">${esc(it.p.a)}</span> → <span class="b">${esc(it.p.b)}</span></li>`:`<li>${lecTag(it.lec)} <span class="a">${esc(it.q.title)}</span><br><span class="b">${it.q.steps.map(esc).join(" → ")}</span></li>`).join("")}</ul>`:`<p>No misses. Try a longer round, the shot clock, or Hard Grid Lock.</p>`}
    <div class="navrow">
      <button class="btn" type="button" id="home2">Home</button>

    </div>
  </section>`;
  $("#home2").onclick=()=>go("home");
  $("#again").onclick=startRF;
  const d=$("#drill");if(d)d.onclick=()=>{RF={q:shuffle(RF.misses).map(it=>({it,retry:false})),i:0,score:0,streak:0,best:0,first:0,firstOk:0,misses:[],answered:false};go("rfplay");};
}

/* ---------- GRID LOCK: list ---------- */
function renderGList(){
  const gs=DATA.grids.filter(g=>F.lecs.has(g.lec));
  $("#app").innerHTML=`<section class="panel opts">
    <h2>Grid Lock</h2>
    ${segHTML("diff","Difficulty",[["easy","Easy · anchors + some cells given"],["hard","Hard · clue column only, locked chain"]],F.diff)}
    ${lecChips()}
  </section>
  <div class="glist">${gs.length?gs.map(g=>{const st=S.grids[g.id]||{};return `<button type="button" class="gcard" data-g="${g.id}">
    <div class="row">${lecTag(g.lec)}<span>${g.rows.length} rows × ${g.cols.length} cols</span></div>
    <h3>${esc(g.title)}</h3><p>${esc(g.blurb)}</p>

/* ---------- GRID LOCK: play ---------- */
let G=null;
function startGrid(id){
  const g=DATA.grids.find(x=>x.id===id); if(!g){go("glist");return;}
  const hard=F.diff==="hard", given=new Set(hard?g.hardGiven:g.easyGiven);
  const cells=g.rows.map(r=>r.map((v,c)=>({v,given:given.has(c),filled:false})));
  if(!hard){ // reveal ~30% of the remaining cells, but leave at least 2 blanks per column
    g.cols.forEach((_,c)=>{if(given.has(c))return;const idx=shuffle(g.rows.map((_,r)=>r));const k=Math.min(Math.floor(g.rows.length*.3+Math.random()*.6),g.rows.length-2);idx.slice(0,Math.max(0,k)).forEach(r=>cells[r][c].given=true);});
  }
  const tileOrder={};g.cols.forEach((_,c)=>{tileOrder[c]=shuffle([...new Set(g.rows.map(r=>r[c])),...((g.decoys||{})[c]||[])]);});
  G={g,hard,cells,sel:null,mistakes:0,hints:0,t0:Date.now(),tried:{},tileOrder,doneRows:new Set(),done:false,msg:"",msgCls:""};
  g.rows.forEach((_,r)=>{if(rowDone(r))G.doneRows.add(r);});
  G.sel=nextOpen(-1);
  drawGrid();
}
const isOk=(r,c)=>G.cells[r][c].given||G.cells[r][c].filled;
const rowDone=r=>G.cells[r].every((_,c)=>isOk(r,c));
function locked(r,c){if(!G.hard)return false;const d=G.g.cols[c].dep;if(d===undefined||d===null)return false;return !isOk(r,d);}
function open(r,c){return !isOk(r,c)&&!locked(r,c);}
function nextOpen(from){const R=G.g.rows.length,C=G.g.cols.length,N=R*C;for(let k=1;k<=N;k++){const x=(from+k)%N,r=Math.floor(x/C),c=x%C;if(from<0&&k===N+1)break;if(open(r,c))return [r,c];}return null;}
function remaining(c){const m={};G.g.rows.forEach((row,r)=>{if(!isOk(r,c))m[row[c]]=(m[row[c]]||0)+1;});return m;}
function rowName(r){const g=G.g;const k=(G.hard?g.hardGiven:g.easyGiven)[0];return g.rows[r][k];}
function drawGrid(){
  const g=G.g,C=g.cols.length;
  const tot=g.rows.length*C, done=g.rows.reduce((a,_,r)=>a+g.cols.reduce((b,_,c)=>b+(isOk(r,c)?1:0),0),0);
  const givenCols=new Set(G.hard?g.hardGiven:g.easyGiven);
  const head=g.cols.map((col,c)=>{const clue=G.hard&&givenCols.has(c);const dep=col.dep;return `<th scope="col" class="${clue?"clue":""}">${esc(col.h)}${clue?"<small>Clue · given</small>":G.hard&&dep!=null?`<small>${LOCK.replace('aria-hidden','style="width:10px;height:10px;vertical-align:-1px" aria-hidden')} after ${esc(g.cols[dep].h)}</small>`:""}</th>`;}).join("");
  const body=g.rows.map((row,r)=>`<tr>${row.map((v,c)=>{
    const cl=G.cells[r][c];
    if(cl.given){const clue=G.hard&&givenCols.has(c);return `<td><div class="cell ${clue?"clue":"given"}">${esc(v)}</div></td>`;}
    if(cl.filled)return `<td><div class="cell filled${cl.pop?" pop":""}">${esc(v)}</div></td>`;
    if(locked(r,c))return `<td><button type="button" class="cell locked" disabled title="Solve ${esc(g.cols[g.cols[c].dep].h)} for this row first">${LOCK}<span>${esc(g.cols[g.cols[c].dep].h)} first</span></button></td>`;
    const sel=G.sel&&G.sel[0]===r&&G.sel[1]===c;
    return `<td><button type="button" class="cell empty${sel?" sel":""}${cl.err?" err":""}" data-r="${r}" data-c="${c}" aria-label="${esc(g.cols[c].h)}, row ${r+1}, empty">${sel?"Pick a tile":"—"}</button></td>`;
  }).join("")}</tr>`).join("");
  g.rows.forEach((_,r)=>g.cols.forEach((_,c)=>{G.cells[r][c].pop=false;G.cells[r][c].err=false;}));
  const elapsed=Math.round((Date.now()-G.t0)/1000);
  let bank="";
  if(!G.done){
    if(G.sel){
      const c=G.sel[1],rem=remaining(c),tried=G.tried[c]||new Set();
      const tiles=G.tileOrder[c].filter(v=>rem[v]||(!g.rows.some(rr=>rr[c]===v))).map(v=>{const dec=!g.rows.some(rr=>rr[c]===v);const out=dec&&tried.has(v);return `<button type="button" class="tile${out?" out":""}" ${out?"disabled":""} draggable="${!out}" data-v="${esc(v)}">${esc(v)}${rem[v]>1?`<span class="ct">×${rem[v]}</span>`:""}</button>`;}).join("");
      bank=`<div class="bank" id="bank"><div class="bh"><span>Tiles for <b>${esc(g.cols[c].h)}</b> · row ${G.sel[0]+1}${G.hard?"":` (${esc(rowName(G.sel[0]))})`}</span><span class="toast ${G.msgCls}" id="toast" role="status">${esc(G.msg)}</span></div><div class="tiles">${tiles}</div></div>`;
    } else bank=`<div class="bank"><span class="toast ${G.msgCls}" role="status">${esc(G.msg)||"Tap an empty cell to see its tiles."}</span></div>`;
  }
  const notes=[...G.doneRows].sort((a,b)=>a-b).filter(r=>g.notes&&g.notes[r]).map(r=>`<li><b>${esc(g.rows[r][g.easyGiven[0]])}:</b> ${esc(g.notes[r])}</li>`).join("");
  $("#app").innerHTML=`<section class="gwrap">
    <div class="rf-top">
      <div>${lecTag(g.lec)} <span class="qset">${G.hard?"Hard":"Easy"}</span><h2 style="margin-top:4px">${esc(g.title)}</h2><p class="ask">${esc(g.blurb)}</p></div>
      <div class="statrow"><div class="stat"><b>${done}/${tot}</b><span>Cells</span></div><div class="stat"><b>${G.mistakes}</b><span>Mistakes</span></div><div class="stat"><b>${G.hints}</b><span>Hints</span></div><div class="stat"><b id="clock">${fmt(elapsed)}</b><span>Time</span></div></div>
    </div>
    <div class="navrow"><button class="btn sm" type="button" id="gBack">&larr; All grids</button><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn sm" type="button" id="gHint" ${G.done?"disabled":""}>Hint (fill one cell)</button><button class="btn sm" type="button" id="gRestart">Restart</button><button class="btn sm" type="button" id="gSwap">Switch to ${G.hard?"Easy":"Hard"}</button></div></div>
    <div class="gtable-wrap"><table class="gt"><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>
    ${G.done?doneHTML():bank}
    ${notes&&!G.done?`<div><h3 style="font-size:1rem;margin-bottom:6px">Solved rows</h3><ul class="notes">${notes}</ul></div>`:""}
  </section>`;
  $("#gBack").onclick=()=>go("glist");
  $("#gRestart").onclick=()=>startGrid(g.id);
  $("#gSwap").onclick=()=>{F.diff=G.hard?"easy":"hard";startGrid(g.id);};
  $("#gHint").onclick=hint;
  document.querySelectorAll(".cell.empty").forEach(b=>{
    b.onclick=()=>{G.sel=[+b.dataset.r,+b.dataset.c];G.msg="";drawGrid();const t=$(".tile:not([disabled])");if(t)t.focus({preventScroll:true});const bk=$("#bank");if(bk)bk.scrollIntoView({block:"nearest",behavior:"smooth"});};
    b.ondragover=e=>{e.preventDefault();b.classList.add("drop");};
    b.ondragleave=()=>b.classList.remove("drop");
    b.ondrop=e=>{e.preventDefault();const v=e.dataTransfer.getData("text/plain");place(+b.dataset.r,+b.dataset.c,v);};
  });
  document.querySelectorAll(".tile[data-v]").forEach(t=>{
    t.onclick=()=>{if(G.sel)place(G.sel[0],G.sel[1],t.dataset.v);};
    t.ondragstart=e=>{e.dataTransfer.setData("text/plain",t.dataset.v);t.classList.add("dragging");};
    t.ondragend=()=>t.classList.remove("dragging");
  });
  const d=$("#gDone");if(d)d.onclick=()=>go("glist");
  const h=$("#gHard");if(h)h.onclick=()=>{F.diff="hard";startGrid(g.id);};
  const nx=$("#gNext");if(nx)nx.onclick=()=>{const L=DATA.grids;const i=L.indexOf(g);go("grid",L[(i+1)%L.length].id);};
  tickClock();
}
const fmt=s=>Math.floor(s/60)+":"+String(s%60).padStart(2,"0");
let clockT=null;
function tickClock(){clearTimeout(clockT);if(view!=="grid"||!G||G.done)return;clockT=setTimeout(()=>{const el=$("#clock");if(el)el.textContent=fmt(Math.round((Date.now()-G.t0)/1000));tickClock();},1000);}
function place(r,c,v){
  if(G.done||!open(r,c))return;
  const g=G.g;
  if(g.rows[r][c]===v){
    G.cells[r][c].filled=true;G.cells[r][c].pop=true;
    G.msg="Correct.";G.msgCls="ok";
    if(!G.doneRows.has(r)&&rowDone(r))G.doneRows.add(r);
    const C=g.cols.length;G.sel=nextOpen(r*C+c);
    if(!G.sel&&g.rows.every((_,rr)=>rowDone(rr)))finishGrid();
  } else {
    G.mistakes++;G.cells[r][c].err=true;G.msgCls="bad";
    const inCol=g.rows.some(rr=>rr[c]===v);
    if(inCol){G.msg=`“${v}” belongs in this column, but not this row.`;}
    else{(G.tried[c]=G.tried[c]||new Set()).add(v);G.msg=`“${v}” is a decoy. It isn't in this chart.`;}
    G.sel=[r,c];
  }
  drawGrid();
}
function hint(){
  if(G.done)return;let t=G.sel&&open(...G.sel)?G.sel:nextOpen(-1);if(!t)return;
  G.hints++;G.cells[t[0]][t[1]].filled=true;G.cells[t[0]][t[1]].pop=true;
  if(rowDone(t[0]))G.doneRows.add(t[0]);
  G.msg=`Hint: filled “${G.g.rows[t[0]][t[1]]}”.`;G.msgCls="";
  const C=G.g.cols.length;G.sel=nextOpen(t[0]*C+t[1]);
  if(!G.sel&&G.g.rows.every((_,rr)=>rowDone(rr)))finishGrid();
  drawGrid();
}
function finishGrid(){
  G.done=true;G.secs=Math.round((Date.now()-G.t0)/1000);
  const pen=G.mistakes+2*G.hints;G.stars=pen===0?3:pen<=2?2:1;
  const st=S.grids[G.g.id]||(S.grids[G.g.id]={});const k=G.hard?"hard":"easy";st[k]=Math.max(st[k]||0,G.stars);save();
}
function doneHTML(){
  const g=G.g;
  return `<section class="panel gdone">
    <div class="statrow" style="align-items:center"><h2>Grid solved</h2>${stars(G.stars)}<span class="ask">${fmt(G.secs)} · ${G.mistakes} mistake${G.mistakes===1?"":"s"} · ${G.hints} hint${G.hints===1?"":"s"}</span></div>
    ${g.hy?`<div class="hybox"><b>High yield · Step 1</b>${esc(g.hy)}</div>`:""}
    <ul class="notes">${g.rows.map((row,r)=>g.notes&&g.notes[r]?`<li><b>${esc(row[g.easyGiven[0]])}:</b> ${esc(g.notes[r])}</li>`:"").join("")}</ul>
    <div class="navrow"><button class="btn" type="button" id="gDone">All grids</button><div style="display:flex;gap:8px;flex-wrap:wrap">${G.hard?"":'<button class="btn" type="button" id="gHard">Try it on Hard</button>'}<button class="btn primary" type="button" id="gNext">Next grid &rarr;</button></div></div>
  </section>`;
}

go("home");
})();
</script>
</body>
</html>
