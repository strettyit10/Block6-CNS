  --ok:#6fd08f; --ok-bg:#16301f; --bad:#f28b82; --bad-bg:#3a1b19; --once:#f0c070; --once-bg:#3a2e12;
  --hy-bg:#3a3110; --hy-line:#b8952a; --hy-ink:#f5e6a8;
  --k1:#8fb1f0; --k2:#b9a3f5; --k3:#f08aa5; --k4:#f5a65b; --k5:#5cc2c0; --k6:#e3bb63; --k7:#6fd08f; --k8:#7cc4f0;
  --given:#1d262f; --lock:#161d24; --clue-bg:#1c2b44; --clue-ink:#c4d6f7; --clue-line:#3b5687; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#11161c; --surface:#19212a; --sunk:#141b22; --ink:#e6eaee; --muted:#9aa6b2; --line:#2c3642; --chip:#232c36;
  --neuro:#8fb1f0; --path:#f08aa5; --drt:#5cc2c0; --pharm:#e3bb63; --accent:#8fb1f0; --accent-ink:#0d1520;
  --ok:#6fd08f; --ok-bg:#16301f; --bad:#f28b82; --bad-bg:#3a1b19; --once:#f0c070; --once-bg:#3a2e12;

  --given:#1d262f; --lock:#161d24; --clue-bg:#1c2b44; --clue-ink:#c4d6f7; --clue-line:#3b5687; color-scheme:dark }
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font:15px/1.5 var(--f-body);margin:0}
.wrap{max-width:1120px;margin:0 auto;padding:20px 16px 48px;display:grid;gap:16px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;line-height:1.2}
button{font:inherit;color:inherit}
a{color:var(--accent)}
.meta{font:500 .74rem var(--f-mono);letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin:0}
header.top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:end;gap:12px}
header.top h1{font-size:clamp(1.5rem,3.4vw,2rem)}
header.top .lede{margin:4px 0 0;color:var(--muted);max-width:66ch}
.back{font:600 .8rem var(--f-body);text-decoration:none;color:var(--muted)}
.back:hover{color:var(--ink)}
.hdr-actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{font:600 .86rem var(--f-body);background:var(--chip);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px 13px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;text-decoration:none}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn[disabled]{opacity:.45;cursor:default}
.btn.sm{padding:5px 10px;font-size:.8rem}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{font:700 .82rem var(--f-body);letter-spacing:.04em;text-transform:uppercase;background:none;border:0;border-bottom:3px solid transparent;padding:10px 12px 8px;color:var(--muted);cursor:pointer;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0}
.panel h2{font-size:1.15rem}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media (max-width:760px){.grid2{grid-template-columns:minmax(0,1fr)}}
.mode-card{display:grid;gap:10px;align-content:start}
.mode-card .k{font:500 .7rem var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.mode-card h2{font-size:1.45rem}
.mode-card p{margin:0;color:var(--muted)}
.opts{display:grid;gap:8px}
.optrow{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.optrow .lab{font:500 .7rem var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);min-width:76px}
.seg{display:inline-flex;background:var(--chip);border-radius:9px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{font:600 .8rem var(--f-body);border:0;background:transparent;padding:5px 10px;border-radius:7px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.14)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:600 .78rem var(--f-body);border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 10px;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--c,var(--muted));flex:none}
.chip[aria-pressed="false"]{opacity:.5;text-decoration:line-through;text-decoration-color:var(--muted)}
.chip .n{font:500 .7rem var(--f-mono);color:var(--muted)}
.statrow{display:flex;flex-wrap:wrap;gap:18px}
.stat b{display:block;font:700 1.25rem var(--f-body);font-variant-numeric:tabular-nums}
.stat span{font:500 .68rem var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.bar{height:6px;background:var(--chip);border-radius:3px;overflow:hidden}
.bar > i{display:block;height:100%;background:var(--ok);border-radius:3px;transition:width .3s}
.lecrow{display:grid;grid-template-columns:auto minmax(0,1fr) 120px auto;gap:4px 10px;align-items:center;padding:6px 0;border-top:1px solid var(--line);font-size:.88rem}
.lecrow:first-of-type{border-top:0}
.lecrow .pct{font:500 .75rem var(--f-mono);color:var(--muted);font-variant-numeric:tabular-nums;min-width:52px;text-align:right}
@media (max-width:560px){.lecrow{grid-template-columns:auto minmax(0,1fr) auto}.lecrow .bar{grid-column:1/-1;order:5}}
.tag{font:600 .68rem var(--f-mono);letter-spacing:.05em;text-transform:uppercase;border-radius:5px;padding:2px 6px;color:#fff;background:var(--lc,var(--neuro));white-space:nowrap}
:root[data-theme="dark"] .tag{color:#0d1520}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .tag{color:#0d1520} }
.hy{font:700 .66rem var(--f-mono);letter-spacing:.06em;background:var(--hy-bg);color:var(--hy-ink);border:1px solid var(--hy-line);border-radius:5px;padding:1px 6px}
.hybox{background:var(--hy-bg);border:1.5px solid var(--hy-line);color:var(--hy-ink);border-radius:10px;padding:10px 12px;font-size:.9rem}
.hybox b{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;display:block;margin-bottom:2px}
details.how{font-size:.9rem}
details.how summary{cursor:pointer;font-weight:700}
details.how ul{margin:8px 0 0;padding-left:18px;color:var(--muted)}
details.how li{margin:3px 0}

/* Rapid fire */
.rf-top{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between}
.timer{height:5px;background:var(--chip);border-radius:3px;overflow:hidden}
.timer i{display:block;height:100%;background:var(--accent);width:100%}
.timer i.low{background:var(--bad)}
.qcard{display:grid;gap:14px;max-width:820px;margin:0 auto;width:100%}
.qhead{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.kind{font:700 .72rem var(--f-body);letter-spacing:.04em;text-transform:uppercase;color:var(--kc);border:1.5px solid var(--kc);border-radius:6px;padding:2px 8px}
.qset{font-size:.82rem;color:var(--muted)}
.prompt-lab{font:500 .7rem var(--f-mono);letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.prompt{font:600 clamp(1.15rem,2.6vw,1.45rem)/1.35 var(--f-display);margin:2px 0 0}
.ask{font-size:.88rem;color:var(--muted);margin:0}
.options{display:grid;gap:8px}
.opt{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;align-items:start;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:11px 12px;cursor:pointer;font-size:.95rem;line-height:1.4}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt .key{font:500 .75rem var(--f-mono);color:var(--muted);border:1px solid var(--line);border-radius:6px;height:24px;display:grid;place-items:center}
.opt.correct{border-color:var(--ok);background:var(--ok-bg)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt[disabled]{cursor:default}
.opt.dim{opacity:.55}
.fb{border-radius:10px;padding:12px 14px;display:grid;gap:8px;font-size:.92rem}
.fb.ok{background:var(--ok-bg);border:1px solid var(--ok)}
.fb.bad{background:var(--bad-bg);border:1px solid var(--bad)}
.fb h3{font:700 .95rem var(--f-body)}
.fb p{margin:0}
.fb .also{font-size:.86rem;color:var(--muted)}
.fb .also b{color:var(--ink)}
.navrow{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center}
.kbd{font:500 .72rem var(--f-mono);color:var(--muted)}
/* sequence */
.seq-done{display:grid;gap:6px;counter-reset:s;padding:0;margin:0;list-style:none}
.seq-done li{counter-increment:s;display:grid;grid-template-columns:26px minmax(0,1fr);gap:8px;align-items:start;background:var(--ok-bg);border:1px solid var(--ok);border-radius:8px;padding:7px 10px;font-size:.92rem}
.seq-done li::before{content:counter(s);font:700 .8rem var(--f-mono);color:var(--ok);text-align:center}
.seq-done li.slot{background:transparent;border:1.5px dashed var(--line);color:var(--muted)}
.seq-done li.slot::before{color:var(--muted)}
.seq-pool{display:grid;gap:6px}
.seq-pool .opt{grid-template-columns:minmax(0,1fr)}
.shake{animation:shake .32s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@media (prefers-reduced-motion:reduce){.shake{animation:none}}
/* end */
.end{display:grid;gap:14px;max-width:820px;margin:0 auto;width:100%}
.big{font:700 clamp(2rem,6vw,3rem)/1 var(--f-display)}
.misslist{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.misslist li{border:1px solid var(--line);border-left:4px solid var(--bad);border-radius:8px;padding:8px 12px;font-size:.9rem;background:var(--surface)}
.misslist .a{font-weight:700}
.misslist .b{color:var(--muted)}

/* Grid list */
.glist{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.gcard{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;cursor:pointer;display:grid;gap:6px;align-content:start}
.gcard:hover{border-color:var(--accent)}
.gcard h3{font-size:1.02rem}
.gcard p{margin:0;font-size:.84rem;color:var(--muted)}
.gcard .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font:500 .72rem var(--f-mono);color:var(--muted)}
.stars{font-size:.85rem;letter-spacing:1px;color:var(--once)}
.stars .off{color:var(--line)}
/* Grid play */
.gwrap{display:grid;gap:12px}
.gtable-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table.gt{border-collapse:separate;border-spacing:0;width:100%;min-width:560px}
.gt th{font:700 .74rem var(--f-body);letter-spacing:.04em;text-transform:uppercase;text-align:left;padding:10px;border-bottom:1px solid var(--line);background:var(--sunk);vertical-align:bottom}
.gt th small{display:block;font:500 .66rem var(--f-mono);letter-spacing:.03em;text-transform:none;color:var(--muted);margin-top:2px}
.gt th.clue{background:var(--clue-bg);color:var(--clue-ink)}
.gt th.clue small{color:var(--clue-ink)}
.gt td{padding:5px;border-bottom:1px solid var(--line);vertical-align:top;min-width:120px}
.gt tr:last-child td{border-bottom:0}
.gt td + td,.gt th + th{border-left:1px solid var(--line)}
.cell{width:100%;min-height:44px;border-radius:8px;padding:7px 9px;font-size:.88rem;line-height:1.3;text-align:left;display:flex;align-items:center;gap:6px}
.cell.given{background:var(--given);font-weight:600}
.cell.clue{background:var(--clue-bg);color:var(--clue-ink);border:1px solid var(--clue-line);font-weight:600}
.cell.empty{border:1.5px dashed var(--line);background:transparent;cursor:pointer;color:var(--muted)}
.cell.empty:hover,.cell.empty.drop{border-color:var(--accent);color:var(--ink)}
.cell.sel{border:2px solid var(--accent);background:color-mix(in srgb,var(--accent) 10%,transparent);color:var(--ink)}
.cell.locked{background:var(--lock);color:var(--muted);border:1px solid var(--line);cursor:not-allowed;font-size:.78rem}
.cell.locked svg{width:13px;height:13px;flex:none}
.cell.filled{background:var(--ok-bg);border:1px solid var(--ok);font-weight:600}
.cell.pop{animation:pop .35s}
@keyframes pop{0%{transform:scale(.94)}60%{transform:scale(1.03)}100%{transform:scale(1)}}
.cell.err{animation:shake .32s;border-color:var(--bad)}
.bank{background:var(--surface);border:1.5px solid var(--accent);border-radius:12px;padding:12px;display:grid;gap:8px;scroll-margin-bottom:16px}
.bank .bh{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center;font-size:.86rem}
.bank .bh b{font-weight:700}
.tiles{display:flex;flex-wrap:wrap;gap:6px;max-height:34vh;overflow:auto}
.tile{font:600 .84rem var(--f-body);background:var(--sunk);border:1.5px solid var(--line);border-radius:8px;padding:7px 10px;cursor:grab;display:inline-flex;gap:6px;align-items:center;max-width:100%;text-align:left}
.tile:hover:not([disabled]){border-color:var(--accent)}
.tile .ct{font:500 .7rem var(--f-mono);color:var(--muted)}
.tile.out{opacity:.45;text-decoration:line-through;cursor:default}
.tile.dragging{opacity:.4}
.toast{font-size:.86rem;font-weight:600}
.toast:empty{display:none}
@media (max-width:560px){.tabs .long{display:none}}
.toast.bad{color:var(--bad)}
.toast.ok{color:var(--ok)}
.notes{display:grid;gap:6px;margin:0;padding:0;list-style:none}
.notes li{border-left:3px solid var(--ok);background:var(--surface);border-radius:6px;padding:6px 10px;font-size:.88rem}
.notes li b{font-weight:700}
.gdone{display:grid;gap:12px}
footer{font-size:.78rem;color:var(--muted);border-top:1px solid var(--line);padding-top:12px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.empty-state{color:var(--muted);font-size:.9rem}
#app{display:grid;gap:16px;min-width:0}
</style>

<script>
const DATA = {"id": "cns06-08", "code": "CNS06–08", "title": "Neuroimaging, Malformations & Trauma", "blurb": "Read CT and MRI like a radiologist, match malformations to genes and gross findings, and trace trauma from mechanism to hemorrhage, edema and herniation.", "lectures": [{"k": "06", "name": "Neuroradiology", "disc": "drt"}, {"k": "07", "name": "Perinatal Disorders & Malformations", "disc": "path"}, {"k": "08", "name": "Edema & CNS Trauma", "disc": "path"}], "los": {"06.1": "Distinguish CT from MRI and choose the right study for an acute vs non-acute clinical question", "06.2": "Explain basic imaging concepts: CT density, T1/T2/FLAIR/fat-sat, DWI restricted diffusion, and contrast enhancement", "06.3": "Identify basic intracranial pathology on CT/MRI (hemorrhage, infarct, edema, mass effect, enhancement patterns)", "07.1": "Define neural tube defects and forebrain anomalies; distinguish malformations from disruptions", "07.2": "Describe pathogenesis and pathologic findings of myelomeningocele, holoprosencephaly, lissencephaly and cortical dysplasia", "07.3": "Correlate clinical findings of CNS malformations with the pathologic diagnosis", "07.4": "Identify molecular genetic and chromosomal findings associated with CNS malformations", "07.5": "Characterize outcomes, prevention and possible treatments of CNS malformations", "07.6": "Describe risk factors, pathogenesis and pathology of perinatal injury: germinal matrix hemorrhage, WM necrosis, multicystic encephalopathy", "07.7": "Correlate perinatal brain injuries with clinical findings, outcomes and long-term complications", "08.1": "Describe the types and mechanisms of cerebral edema and how edema and raised ICP impair perfusion and function", "08.2": "Describe clinical manifestations and complications of raised ICP, including herniation syndromes", "08.3": "Classify TBI (concussion, contusion, diffuse axonal injury, hemorrhage) and correlate with clinical signs", "08.4": "Differentiate epidural, subdural, subarachnoid and intraparenchymal hemorrhage by mechanism, location, imaging and presentation", "08.5": "Correlate patterns of CNS injury with the mechanism of trauma and relevant neuroanatomy", "08.6": "Characterize CNS vascular trauma: arterial and venous injury, dissection, aneurysm and traumatic hemorrhage"}, "sets": [{"id": "s01", "lec": "06", "lo": "06.1", "kind": "image-finding", "title": "Non-contrast CT head: appearance → meaning", "left": "CT appearance", "right": "Interpretation", "pairs": [{"a": "Gray matter slightly brighter than white matter", "b": "Expected normal finding: fatty myelin lowers tissue density", "why": "CT only measures density. Myelin is fatty, so WM is hypodense to GM. This GM/WM difference should always be present.", "hy": true}, {"a": "Loss of gray–white differentiation", "b": "Early sign of acute infarct, seizure, or infection", "why": "When cortex swells (e.g., cytotoxic edema in stroke), it loses its slight brightness and blends into WM. Look for it before frank hypodensity appears.", "hy": true}, {"a": "Focal hyperdense collection minutes after trauma", "b": "Acute hemorrhage: clotted blood is denser than brain", "why": "Acute blood is hyperdense on CT, which is why CT is the first study for suspected hemorrhage. It fades toward isodense/hypodense over days to weeks."}, {"a": "Sulci and cisterns effaced; brain no longer 'smiling'", "b": "Diffuse cerebral edema crowding the CSF spaces", "why": "The CSF-filled basal cisterns and sulci normally make the brain 'smile.' Swelling effaces them, an ominous sign of rising ICP."}, {"a": "4th ventricle lost its slight 'frown'; midline shifted", "b": "Mass effect from an expanding lesion", "why": "A compressed or displaced 4th ventricle, or septum pushed past midline, means something is occupying space (hematoma, tumor, edema)."}, {"a": "Ventricles enlarged out of proportion to sulci", "b": "Hydrocephalus from impaired CSF flow or absorption", "why": "Big ventricles with small/normal sulci = hydrocephalus. Big ventricles with big sulci suggests atrophy (ex vacuo)."}, {"a": "Whitest structure on the scan, even brighter than blood", "b": "Calcified bone of the skull vault and base", "why": "CT density order: bone > acute blood > gray matter > white matter > CSF. Bone windows are used to look for fractures."}]}, {"id": "s02", "lec": "06", "lo": "06.2", "kind": "image-finding", "title": "MRI sequence → what it shows", "left": "MRI sequence", "right": "What it highlights / suppresses", "pairs": [{"a": "T1-weighted", "b": "Fat bright, fluid dark; white matter brighter than gray matter", "why": "'T1 likes fat.' Myelin is fatty, so WM is brighter than GM on T1, and CSF is dark. Good for anatomy.", "hy": true}, {"a": "T2-weighted", "b": "Fluid brightest; gray matter brighter than white matter", "why": "'T2 loves fluid' — nothing loves fluid more. CSF, edema and cysts are bright; fat is also bright on both T1 and T2.", "hy": true}, {"a": "FLAIR", "b": "T2-type image with free CSF signal nulled so edema stands out", "why": "FLAIR darkens normal CSF while abnormal tissue water (edema, gliosis, inflammation) stays bright — great next to ventricles and sulci."}, {"a": "Fat-saturation (FS)", "b": "Fat signal suppressed to prove a lesion contains fat", "why": "A lesion bright on T1 that goes dark with fat-sat is fat (e.g., lipoma/dermoid). MRI physics darkens normal tissue to expose the abnormal."}, {"a": "Diffusion-weighted imaging (DWI)", "b": "Bright where water motion is restricted: acute infarct, abscess", "why": "DWI shows restricted diffusion: swollen dead cells (acute stroke), viscous pus, or tightly packed cellular tumors such as lymphoma.", "hy": true}, {"a": "T1 after gadolinium", "b": "Bright where the blood–brain barrier is disrupted", "why": "Contrast leaks where the BBB is broken: tumors, infection, inflammation, meningeal disease. The enhancement pattern narrows the differential."}, {"a": "Thin-section high-resolution MRI", "b": "Fine slices that resolve individual cranial nerves", "why": "Extremely thin sections let you trace cranial nerves (e.g., vestibular schwannoma on CN VIII). Other special sequences separate hemorrhage from calcification."}]}, {"id": "s03", "lec": "06", "lo": "06.3", "kind": "disease-finding", "title": "MRI pattern → most likely diagnosis", "left": "MRI pattern", "right": "Diagnosis", "pairs": [{"a": "DWI-bright wedge in one arterial territory, sudden deficit", "b": "Acute ischemic infarct", "why": "ATP failure stops the Na⁺/K⁺ pump, water rushes into cells, extracellular water motion drops → bright DWI within minutes.", "hy": true}, {"a": "Multiple bilateral DWI foci, anterior + posterior circulation", "b": "Embolic infarcts from a central source", "why": "Bright DWI spots scattered across territories and both hemispheres point to emboli (heart, aortic arch) rather than one diseased artery."}, {"a": "Homogeneous enhancement crossing the corpus callosum, T2 dark", "b": "Primary CNS lymphoma", "why": "Lymphoma is highly cellular: T2 dark, mild restricted diffusion, diffuse homogeneous enhancement, often periventricular or crossing the corpus callosum.", "hy": true}, {"a": "Ring-enhancing lesion whose center is bright on DWI", "b": "Brain abscess", "why": "Thick pus restricts diffusion, so the abscess center is DWI bright; a necrotic tumor center is usually DWI dark — the key discriminator."}, {"a": "Diffuse leptomeningeal enhancement with fever and headache", "b": "Bacterial meningitis", "why": "Inflamed leptomeninges enhance. With fever, the next step is lumbar puncture to identify the organism."}, {"a": "Diffuse leptomeningeal enhancement in a lung cancer patient", "b": "Leptomeningeal carcinomatosis", "why": "The same enhancement pattern means seeding of the meninges by cancer when there is a known primary. LP with cytology confirms."}, {"a": "T1 dark, T2 bright, FLAIR dark, no enhancement", "b": "Simple CSF-filled cyst (e.g., arachnoid)", "why": "Behaves exactly like CSF on every sequence — bright only on T2 and nulled on FLAIR — so it is simple fluid."}, {"a": "T1 bright, T2 bright, dark after fat-saturation", "b": "Fat-containing lesion (lipoma/dermoid)", "why": "Bright on both T1 and T2 is the fat signature; disappearing with fat-sat confirms it."}]}, {"id": "s04", "lec": "06", "lo": "06.1", "kind": "term-app", "title": "Clinical question → best imaging choice", "left": "Clinical question", "right": "Best study", "pairs": [{"a": "Head trauma 1 hour ago — is there acute bleeding?", "b": "Non-contrast CT head", "why": "CT is fast, widely available and shows acute blood as bright. It is the first study for any acute CNS process.", "hy": true}, {"a": "Sudden aphasia; CT normal — is this an acute infarct?", "b": "MRI with diffusion-weighted imaging", "why": "Early infarcts may be invisible on CT, but DWI turns bright within minutes of ischemia.", "hy": true}, {"a": "Months of headache; CT shows vasogenic edema — what is it?", "b": "Contrast-enhanced MRI brain", "why": "CT shows mass effect and edema but not enough detail. Contrast MRI characterizes the lesion (enhancement, diffusion, location)."}, {"a": "Is this lesion fat or fluid?", "b": "MRI T1/T2 with fat-saturation", "why": "Fat: bright on T1 and T2, suppressed by fat-sat. Fluid: bright only on T2. CT cannot reliably make this distinction."}, {"a": "Pacemaker (no MRI); is there an enhancing mass or abscess?", "b": "CT head with IV contrast", "why": "Contrast on CT is used for masses and suspected infection: it shows enhancement where the BBB is broken. Use it when MRI is not possible."}, {"a": "MRI shows a dark focus: blood or calcium?", "b": "Special MRI sequence sensitive to blood products", "why": "Dedicated MRI sequences separate blood breakdown products from calcium, which can look similar on routine images."}, {"a": "Unilateral hearing loss — is CN VIII involved?", "b": "Thin-section MRI of the cranial nerves", "why": "Very thin MRI slices resolve cranial nerves in the cerebellopontine angle and internal auditory canal."}]}, {"id": "s05", "lec": "07", "lo": "07.2", "kind": "disease-finding", "title": "Neural tube & hindbrain defect → defining finding", "left": "Defect", "right": "Defining finding", "pairs": [{"a": "Anencephaly", "b": "Absent cranial vault; brain replaced by area cerebrovasculosa", "why": "Failure of anterior neuropore closure. Exposed brain degenerates into a ragged vascular mass. Maternal AFP ↑; shallow orbits with protruding eyes.", "hy": true}, {"a": "Myelomeningocele", "b": "Cord and meninges in a sac; flat open cord = area medullovasculosa", "why": "Most severe spinal NTD, usually lumbosacral. Nerve roots end blindly in skin. Chiari II in >95% plus hydrocephalus.", "hy": true}, {"a": "Meningocele", "b": "Only meninges and CSF herniate; spinal cord stays in canal", "why": "Milder than myelomeningocele because neural tissue is not in the sac, so deficits are fewer."}, {"a": "Occult spina bifida", "b": "Closed vertebral defect marked by hair tuft or sacral dimple", "why": "Mildest NTD, from faulty tail-bud (secondary neurulation). May hide hydromyelia, diastematomyelia, tethered cord or a lipoma.", "hy": true}, {"a": "Encephalocele", "b": "Brain tissue protrudes through a skull defect, often occipital", "why": "A cranial NTD where the vault partially forms; brain and meninges herniate through the gap."}, {"a": "Chiari II (Arnold-Chiari) malformation", "b": "Small posterior fossa; vermis/medulla herniate; tectal beaking", "why": "Nearly always paired with lumbosacral myelomeningocele. Downward hindbrain displacement blocks CSF → hydrocephalus; may cause hydromyelia.", "hy": true}, {"a": "Chiari I malformation", "b": "Cerebellar tonsils extend below foramen magnum; ± syrinx", "why": "Milder, often presents in teens/adults with occipital headache; a syrinx gives cape-like loss of pain and temperature."}, {"a": "Dandy-Walker malformation", "b": "Hypoplastic vermis with cystic dilation of the 4th ventricle", "why": "Distinguish from Chiari II: here the posterior fossa is ENLARGED by a cyst, not small and crowded."}]}, {"id": "s06", "lec": "07", "lo": "07.4", "kind": "cause-effect", "title": "Gene / chromosome → CNS phenotype", "left": "Genetic finding", "right": "CNS phenotype", "pairs": [{"a": "LIS1 deletion at 17p13.3", "b": "Type I lissencephaly, worst posteriorly; Miller-Dieker if larger deletion", "why": "LIS1 encodes a subunit of platelet-activating factor acetylhydrolase. Autosomal dominant; adjacent-gene loss adds Miller-Dieker facies.", "hy": true}, {"a": "DCX (doublecortin), Xq22", "b": "Anterior lissencephaly in males; double cortex in females", "why": "X-linked. Hemizygous males get smooth brain (anterior worst). Mosaic females get subcortical band heterotopia.", "hy": true}, {"a": "SHH (7q36) or trisomy 13", "b": "Holoprosencephaly with midline facial defects", "why": "Sonic hedgehog patterns the ventral forebrain; loss prevents hemisphere separation. Trisomy 13 is the most frequent chromosomal cause.", "hy": true}, {"a": "RELN (reelin), 7q22", "b": "Lissencephaly with cerebellar and hippocampal hypoplasia", "why": "Autosomal recessive. Reelin guides cortical layering; patients have severe ataxia, intellectual disability and seizures."}, {"a": "ARX on chromosome X", "b": "Lissencephaly with ambiguous genitalia in males", "why": "Also agenesis of the corpus callosum, severe seizures, temperature dysregulation and microcephaly."}, {"a": "FLNA (filamin-1)", "b": "Periventricular nodular heterotopia with epilepsy", "why": "Neurons fail to leave the ventricular zone and form nodules lining the ventricles; X-linked."}, {"a": "FCMD (fukutin)", "b": "Type II (cobblestone) lissencephaly with muscular dystrophy", "why": "Fukuyama congenital muscular dystrophy: overmigration through a defective pial surface gives polymicrogyria/cobblestone cortex."}, {"a": "KAL1", "b": "Absent olfactory bulbs and GnRH neurons (Kallmann)", "why": "GnRH neurons migrate with olfactory axons; failure gives anosmia + hypogonadotropic hypogonadism.", "hy": true}]}, {"id": "s07", "lec": "07", "lo": "07.1", "kind": "term-def", "title": "Malformation concepts → meaning", "left": "Concept", "right": "Meaning", "pairs": [{"a": "Malformation", "b": "Primary error in the developmental program itself; may recur", "why": "Intrinsic (often genetic) defect. Important for counseling because only primary malformations carry a significant recurrence risk.", "hy": true}, {"a": "Disruption", "b": "Insult (ischemia, infection, compression) on a normal program", "why": "Secondary defect from vascular accident, infection-induced necrosis or trauma; low recurrence risk."}, {"a": "Neural tube defect (dysraphism)", "b": "Failure of the neural folds to close into the neural tube", "why": "Primary neurulation failure → anencephaly or myelomeningocele; tail-bud failure → occult spina bifida."}, {"a": "Forebrain induction disorder", "b": "Failure of the forebrain to divide into two hemispheres", "why": "Holoprosencephaly is the prototype; commissures such as the corpus callosum also fail to form."}, {"a": "Neuronal migration disorder", "b": "Neurons end up in the wrong place; gyri too few or too many", "why": "Lissencephaly, heterotopia and polymicrogyria. Clinically seizures and psychomotor delay."}, {"a": "Early disruption (before glial repair)", "b": "Smooth-walled cavity with no gliosis", "why": "Macrophage clearance precedes any astrocytic response, so necrotic tissue is resorbed leaving a smooth-walled pore (e.g., porencephaly)."}, {"a": "Late disruption (glial repair possible)", "b": "Ragged destructive cavity lined by glial scar", "why": "Once astrocytes can react, injury looks more destructive histologically because of gliosis."}]}, {"id": "s08", "lec": "07", "lo": "07.5", "kind": "term-app", "title": "Condition → outcome, prevention or treatment", "left": "Condition", "right": "Outcome / management", "pairs": [{"a": "Anencephaly", "b": "Incompatible with prolonged life after birth", "why": "Most common brain malformation in fetuses; detected by ↑maternal AFP and ultrasound.", "hy": true}, {"a": "Myelomeningocele", "b": "Closure in utero improves function and lowers shunt need", "why": "Fetal surgery improves neurological function and decreases post-natal shunting for hydrocephalus."}, {"a": "Risk of neural tube defects", "b": "Periconceptional folic acid; inositol as adjunct", "why": "Folate must be given before conception and early pregnancy because the tube closes by ~day 28, often before pregnancy is recognized.", "hy": true}, {"a": "Severe germinal matrix hemorrhage", "b": "Post-hemorrhagic hydrocephalus needing CSF shunt", "why": "Organized blood blocks the aqueduct or 4th ventricle outlets; survivors risk cerebral palsy and seizures."}, {"a": "Focal cortical dysplasia type IIb", "b": "Drug-resistant epilepsy treated by surgical resection", "why": "A discrete dysplastic focus is a classic target for epilepsy surgery; hemimegalencephaly may need hemispherectomy."}, {"a": "Alobar holoprosencephaly", "b": "Facial dysmorphism, spasticity, apnea, unstable temperature", "why": "Often stillborn; liveborns have midline facial defects, psychomotor delay, spasticity, apnea and poor temperature control (no hypophysis, abnormal hypothalamus)."}, {"a": "Miller-Dieker syndrome", "b": "Profound delay, feeding problems, hypotonia, later seizures", "why": "Early hypotonia gives way to hypertonia and seizures; facies show bitemporal hollowing and small jaw."}]}, {"id": "s09", "lec": "07", "lo": "07.6", "kind": "cause-effect", "title": "Germinal matrix hemorrhage: risk & pathogenesis", "left": "Factor", "right": "Why it matters", "pairs": [{"a": "Germinal matrix", "b": "Subventricular zone lining lateral ventricles; persists to ~34 wk", "why": "Source of immature neurons and glia, most prominent at the caudothalamic groove. Because it involutes by ~34 weeks, GMH is a disease of preterm infants.", "hy": true}, {"a": "Gestational age at birth", "b": "Strongest predictor: >50% at 24 wk, ~40% at 26, ~10% at 30", "why": "The earlier the birth, the more matrix and the more fragile its vessels."}, {"a": "First 3–24 hours after birth", "b": "Window in which most hemorrhages occur", "why": "Late bleeds after 24 h associate with respiratory distress syndrome, vigorous resuscitation, hypoxemia and seizures."}, {"a": "Mechanical ventilation for lung immaturity", "b": "Most common clinical setting for GMH", "why": "Ventilated preemies have hypoxemia, hypercarbia and blood pressure swings — the triggers for bleeding."}, {"a": "Capillaries without supporting stroma", "b": "Fragile anastomosing vessels that rupture easily", "why": "The highly cellular, highly vascular matrix drains into thin-walled venules that only thicken after 34 weeks."}, {"a": "Hypoxic loss of autoregulation", "b": "BP swings overperfuse matrix vessels until they burst", "why": "Without autoregulation, systemic pressure is passed straight to fragile vessels at the striate–thalamic arterial border zone."}, {"a": "Excess local fibrinolytic activity", "b": "Poor hemostasis lets a small bleed enlarge", "why": "Clots break down readily in the matrix, so hemorrhage extends into the ventricles."}]}, {"id": "s10", "lec": "08", "lo": "08.2", "kind": "term-def", "title": "Intracranial pressure: numbers & signs", "left": "ICP concept", "right": "Meaning", "pairs": [{"a": "ICP 0–10 mmHg", "b": "Normal intracranial pressure", "why": "The skull is a rigid box; normal ICP stays ≤10 mmHg.", "hy": true}, {"a": "Prolonged ICP > 20 mmHg", "b": "Abnormal, pathologically raised pressure", "why": "Sustained elevation above 20 mmHg is abnormal and warrants treatment.", "hy": true}, {"a": "ICP > 40 mmHg", "b": "Neurologic dysfunction and compromised cerebral flow", "why": "Cerebral perfusion pressure = MAP − ICP, so high ICP starves the brain.", "hy": true}, {"a": "ICP > 60 mmHg", "b": "Fatal level of intracranial pressure", "why": "Perfusion fails and herniation follows."}, {"a": "Early compensation for an expanding mass", "b": "CSF and venous blood pushed out of the skull", "why": "Displacing CSF and venous blood buys time; once exhausted, small volume adds cause steep ICP rises."}, {"a": "Cushing triad", "b": "Hypertension, bradycardia, irregular respirations", "why": "A late sign of raised ICP/brainstem compression: BP rises to maintain perfusion, reflex bradycardia follows."}, {"a": "Papilledema", "b": "Swollen optic discs from pressure in the nerve sheath", "why": "Raised CSF pressure is transmitted along the optic nerve sheath, impeding axoplasmic flow and venous return."}]}, {"id": "s11", "lec": "08", "lo": "08.2", "kind": "lesion-deficit", "title": "Herniation: compressed structure → deficit", "left": "Compressed structure", "right": "Resulting deficit", "pairs": [{"a": "ACA pinned against the falx (subfalcine)", "b": "Contralateral leg weakness and sensory loss", "why": "Cingulate gyrus herniates under the falx and kinks the ACA → infarct of the medial (leg) cortex.", "hy": true}, {"a": "Ipsilateral CN III (uncal herniation)", "b": "Ipsilateral fixed, dilated 'blown' pupil", "why": "Superficial parasympathetic fibers are compressed first, so the pupil blows before ptosis and down-and-out gaze.", "hy": true}, {"a": "PCA against the tentorial edge", "b": "Contralateral homonymous hemianopia", "why": "Occipital lobe infarct from PCA compression during transtentorial herniation."}, {"a": "Contralateral cerebral peduncle (Kernohan notch)", "b": "Ipsilateral hemiparesis — a false localizing sign", "why": "Midbrain is shoved against the opposite tentorium, injuring corticospinal fibers that cross below.", "hy": true}, {"a": "Ipsilateral cerebral peduncle", "b": "Contralateral hemiparesis (true localizing sign)", "why": "Direct compression of the descending corticospinal tract above its decussation."}, {"a": "CN VI stretched over the petrous ligament", "b": "Inability to abduct the eye (lateral gaze palsy)", "why": "Long intracranial course makes CN VI a false localizing sign of raised ICP."}, {"a": "Medulla (cerebellar tonsillar herniation)", "b": "Cardiorespiratory arrest and sudden death", "why": "Tonsils plug the foramen magnum; pressure plus ischemia of medullary centers is fatal.", "hy": true}, {"a": "Basilar perforators stretched (axial shift)", "b": "Midline pontine hemorrhages and deep coma", "why": "Caudal brainstem displacement tears perforating branches → Duret hemorrhages."}]}, {"id": "s12", "lec": "08", "lo": "08.4", "kind": "image-finding", "title": "Imaging/gross appearance → traumatic lesion", "left": "Appearance", "right": "Lesion", "pairs": [{"a": "Lens-shaped (biconvex) blood that stops at sutures", "b": "Epidural hematoma", "why": "Arterial blood strips dura from the inner table; dura is tethered at sutures, so it cannot cross them.", "hy": true}, {"a": "Crescent of blood that crosses sutures, not falx", "b": "Subdural hematoma", "why": "Venous blood spreads freely in the subdural space across sutures but is stopped by dural reflections.", "hy": true}, {"a": "Blood filling sulci and basal cisterns", "b": "Subarachnoid hemorrhage", "why": "Blood mixes with CSF and outlines the brain surface; often accompanies contusions in severe TBI.", "hy": true}, {"a": "Parenchymal hematoma not breaking through the cortex", "b": "Intracerebral hemorrhage", "why": "Defined as a parenchymal hematoma not extending through the cortical surface; frontal and temporal lobes most common."}, {"a": "Hemorrhagic bruises on orbitofrontal gyri, temporal poles", "b": "Contre-coup contusions", "why": "Typical after a fall onto the occiput: brain strikes the rough anterior and middle fossa floors."}, {"a": "Old yellow-brown depressed scars on gyral crests", "b": "Plaques jaunes (healed contusion)", "why": "Hemosiderin-laden, gliotic craters mark old contusions."}, {"a": "Splenium of corpus callosum lesion after rotation", "b": "Diffuse axonal injury", "why": "Shear of long WM tracts; MRI shows callosal and gray-white junction lesions while CT may be near normal.", "hy": true}, {"a": "Small midline pontine bleeds after herniation", "b": "Duret hemorrhages", "why": "Secondary brainstem hemorrhage from caudal displacement stretching basilar perforators."}]}, {"id": "s13", "lec": "08", "lo": "08.3", "kind": "term-def", "title": "TBI category → definition", "left": "Injury", "right": "Definition", "pairs": [{"a": "Concussion", "b": "Immediate, reversible dysfunction; brief LOC and amnesia", "why": "Mildest TBI with no gross lesion; sparse axonal injury has been documented after death from other causes.", "hy": true}, {"a": "Contusion", "b": "Bruise of brain surface from small-vessel bleeding, pia intact", "why": "Crests of gyri are most affected because they hit the skull."}, {"a": "Laceration", "b": "Surface brain injury in which the pia mater is torn", "why": "A contusion becomes a laceration when the pia is torn."}, {"a": "Coup injury", "b": "Contusion directly beneath the point of impact", "why": "Typical when a stationary head is struck by an object."}, {"a": "Contre-coup injury", "b": "Contusion on the brain surface opposite the impact", "why": "Typical when a moving head stops suddenly (a fall).", "hy": true}, {"a": "Diffuse axonal injury", "b": "Rotational shear of long WM tracts; coma, no lucid interval", "why": "Microtubules break, axonal transport stops; most are comatose from the outset.", "hy": true}, {"a": "Chronic traumatic encephalopathy", "b": "Repeated concussions → tau in neurons and glia", "why": "Boxers (dementia pugilistica), football, hockey, military; mood change, memory loss, dementia; sometimes TDP-43."}, {"a": "Primary vs secondary injury", "b": "Immediate force damage vs delayed edema, ICP and ischemia", "why": "Secondary injury is the target of treatment: preventing hypoxia, hypotension and ICP rise."}]}, {"id": "s14", "lec": "08", "lo": "08.5", "kind": "cause-effect", "title": "Trauma mechanism → main pathology", "left": "Mechanism", "right": "Main pathology", "pairs": [{"a": "Impact: head contacts an object", "b": "Hemorrhages and fractures at the contact site", "why": "Contact forces cause scalp bruising, skull fractures, contusions and extra-axial hematomas."}, {"a": "Inertial loading (rotational acceleration)", "b": "Diffuse axonal injury, even with no head contact", "why": "Brain moves relative to skull and to itself → shear strain on long WM axons (car crashes, falls from height). Contact is not required.", "hy": true}, {"a": "Penetrating object (knife, bullet)", "b": "Local tissue necrosis along the tract", "why": "Damage is concentrated where the object travels; gunshots add cavitation."}, {"a": "Blast exposure", "b": "Diffuse brain swelling", "why": "Pressure waves in military/industrial blasts mainly produce swelling."}, {"a": "Force over a large area (simple fall)", "b": "Linear fracture through both skull tables", "why": "Distributed force gives a linear fracture; may be extensive."}, {"a": "Force concentrated on a small area (hammer)", "b": "Depressed / comminuted skull fracture", "why": "Focused energy drives bone fragments inward."}, {"a": "Severe force across the skull base", "b": "Basilar fracture: CSF leak, raccoon eyes, Battle sign", "why": "Needs high force (crash, big fall). Blood in sinuses, CSF rhinorrhea/otorrhea, periorbital and perimastoid bruising.", "hy": true}, {"a": "Hyperextension in a motorcycle crash", "b": "Brainstem tear at the pontomedullary junction", "why": "A primary brainstem injury, usually rapidly fatal."}]}, {"id": "s15", "lec": "08", "lo": "08.6", "kind": "cause-effect", "title": "Vascular injury → consequence", "left": "Vascular injury", "right": "Consequence", "pairs": [{"a": "Middle meningeal artery torn by temporal fracture", "b": "Epidural hematoma with lucid interval", "why": "Squamous temporal bone is thin; arterial bleeding rapidly expands → neurosurgical emergency (burr hole).", "hy": true}, {"a": "Bridging veins torn by acceleration/deceleration", "b": "Subdural hematoma, slow venous onset", "why": "Atrophy (elderly, alcoholics) stretches these veins; symptoms may lag hours to weeks.", "hy": true}, {"a": "Vertebral artery laceration from a blow to the neck", "b": "Traumatic basal SAH, rapid collapse in a young male", "why": "Young males; may involve atlanto-axial dislocation; collapse is very rapid with high mortality."}, {"a": "Ruptured saccular (berry) aneurysm", "b": "Non-traumatic SAH: 'worst headache of life'", "why": "Usually circle of Willis branch points; can mimic traumatic SAH."}, {"a": "Carotid dissection after neck trauma", "b": "Intramural hematoma → thromboembolic stroke", "why": "Intimal tear lets blood split the wall; thrombus forms and embolizes. Sympathetic fibers on the ICA can be stretched → ipsilateral partial Horner (ptosis, miosis) with neck pain.", "hy": true}, {"a": "Lenticulostriate rupture in chronic hypertension", "b": "Deep basal ganglia (putaminal) hematoma", "why": "Charcot-Bouchard microaneurysms; not traumatic, a key distractor for parenchymal bleeds."}, {"a": "Arteriovenous malformation (AVM)", "b": "Lobar intraparenchymal bleed in a young adult", "why": "AVMs sit within the hemisphere and bleed most often in young adults; lobar location contrasts with deep hypertensive bleeds."}]}], "seqs": [{"id": "q01", "lec": "07", "lo": "07.1", "title": "Neural tube closure", "prompt": "Put the events of neural tube formation in order (first → last).", "steps": ["Neural plate folds up into neural folds", "Folds first fuse at closure site 1 (~day 22 after ovulation)", "A separate fusion begins at closure site 2", "Anterior neuropore closes, completing cranial closure", "Posterior neuropore closes (~day 28)", "Secondary neurulation: tail-bud stem cells form the caudal cord"], "why": "Anterior neuropore failure → anencephaly; posterior neuropore failure → myelomeningocele; tail-bud failure → occult spina bifida. Closure is done by ~day 28, so folate must start before conception.", "hy": true}, {"id": "q02", "lec": "07", "lo": "07.6", "title": "Germinal matrix hemorrhage grades", "prompt": "Order germinal matrix hemorrhage from least to most severe (grade 1 → 4).", "steps": ["Hemorrhage confined to the germinal matrix", "Blood enters the ventricles without distending them", "Intraventricular blood distends the ventricles (hydrocephalus)", "Ventricular rupture with bleeding into surrounding white matter"], "why": "Grade 1 matrix only → 2 IVH without dilation → 3 IVH with ventricular dilation → 4 parenchymal extension. Grades 3–4 carry the highest risk of hydrocephalus, cerebral palsy and death.", "hy": true}, {"id": "q03", "lec": "07", "lo": "07.6", "title": "Germinal matrix hemorrhage pathogenesis", "prompt": "Order the cascade leading from preterm birth to post-hemorrhagic hydrocephalus.", "steps": ["Birth before 34 weeks with immature lungs needing ventilation", "Hypoxemia and hypercarbia abolish cerebral autoregulation", "Blood pressure swings overperfuse the germinal matrix", "Stroma-poor matrix capillaries and venules rupture", "Local fibrinolysis lets blood spread into the ventricles", "Organized blood blocks the aqueduct/4th ventricle outlets"], "why": "Risk = immature fragile matrix + unstable blood pressure. Late consequence is obstructive hydrocephalus (enlarged ventricles months later), plus seizures and poor development.", "hy": false}, {"id": "q04", "lec": "08", "lo": "08.1", "title": "Raised ICP cascade", "prompt": "Order the events as an expanding mass raises intracranial pressure.", "steps": ["Mass (hematoma, tumor, swelling) enlarges inside the rigid skull", "CSF and venous blood are displaced to compensate", "Compensation is exhausted; ICP rises steeply", "Pressure differential develops between compartments", "Brain tissue herniates past the falx, tentorium or foramen magnum", "Vessels and nerves are compressed → secondary infarcts and more edema"], "why": "A vicious cycle: infarcts add edema, which raises ICP further. Raised ICP from brain swelling is the most common cause of death in severe TBI.", "hy": true}, {"id": "q05", "lec": "08", "lo": "08.3", "title": "Diffuse axonal injury time course", "prompt": "Order the findings after diffuse axonal injury (earliest → latest).", "steps": ["Rotational shear breaks axonal microtubules, halting transport", "Within 2 h: focal β-APP accumulation on immunostain", "12–24 h: axonal varicosities visible on H&E", "24 h–2 months: axonal swellings (spheroids) and microglial nodules", "Long term: Wallerian degeneration and white matter atrophy"], "why": "β-APP is the most sensitive and specific early marker because transport-blocked proteins pile up at breaks. Spheroids appear later on H&E/silver stain.", "hy": true}, {"id": "q06", "lec": "08", "lo": "08.2", "title": "Uncal herniation progression", "prompt": "Order the progression of uncal (transtentorial) herniation from a unilateral mass.", "steps": ["Unilateral supratentorial mass shifts the medial temporal lobe", "Uncus herniates over the free edge of the tentorium", "Ipsilateral CN III compressed → fixed dilated pupil", "Midbrain pushed into opposite tentorium (Kernohan notch)", "Brainstem displaced caudally, stretching basilar perforators", "Duret hemorrhages in midbrain/pons → coma and death"], "why": "The blown pupil is the earliest localizing sign. Kernohan notch gives ipsilateral hemiparesis (false localizing). PCA compression may add an occipital infarct.", "hy": true}], "grids": [{"id": "g01", "lec": "06", "lo": "06.3", "title": "Neuroimaging case work-up", "blurb": "From the vignette, name the diagnosis, its key MRI finding and the next step.", "cols": [{"h": "Vignette clue"}, {"h": "Diagnosis", "dep": 0}, {"h": "Key MRI finding", "dep": 1}, {"h": "Next step", "dep": 1}], "rows": [["Sudden aphasia and right weakness, 1 h", "Acute left MCA infarct", "Bright DWI in MCA territory", "Thrombolysis/thrombectomy evaluation"], ["Scattered deficits, both hemispheres", "Embolic infarcts", "Bilateral DWI foci, many territories", "Echo/ECG for cardiac embolic source"], ["3 days of fever, headache, vomiting", "Meningitis", "Diffuse leptomeningeal enhancement", "LP for Gram stain and culture"], ["Lung cancer; 3 days of headache, vomiting", "Leptomeningeal carcinomatosis", "Diffuse leptomeningeal enhancement", "LP for CSF cytology"], ["Months of headache, confusion", "Primary CNS lymphoma", "Homogeneous enhancement across CC", "Stereotactic biopsy"], ["IV drug use, fever, new focal deficit", "Brain abscess", "Ring enhancement, DWI-bright center", "Drainage plus antibiotics"]], "easyGiven": [0], "hardGiven": [0], "decoys": {"1": ["Glioblastoma", "Subdural hematoma", "Hydrocephalus"], "2": ["Lens-shaped hyperdense collection", "Fat signal lost on fat-sat", "Ring enhancement, DWI-dark center"], "3": ["Repeat CT in 6 months", "Burr-hole evacuation", "Fat-saturated MRI"]}, "notes": ["Cytotoxic swelling restricts water motion, so DWI lights up within minutes; CT may still be normal.", "Multiple bilateral foci across anterior/posterior circulation = embolic source (heart, arch), so look for AF or a cardiac thrombus.", "Enhancing inflamed leptomeninges + fever → LP to find the organism.", "Identical enhancement, different history: a known primary means meningeal tumor seeding; LP cytology confirms.", "Cellular tumor: T2 dark, mild restricted diffusion, homogeneous enhancement, often crossing the corpus callosum.", "Pus restricts diffusion (bright center), unlike most necrotic tumors (dark center)."], "hy": "Same picture, different answer: diffuse leptomeningeal enhancement = meningitis with fever, carcinomatosis with known cancer. DWI bright = acute infarct, abscess, or highly cellular tumor (lymphoma)."}, {"id": "g02", "lec": "08", "lo": "08.1", "title": "Cerebral edema chart", "blurb": "Classify the edema in each scenario, then give its mechanism and where it sits.", "cols": [{"h": "Scenario"}, {"h": "Edema type", "dep": 0}, {"h": "Mechanism", "dep": 1}, {"h": "Distribution / imaging", "dep": 1}], "rows": [["Acute MCA territory infarct", "Cytotoxic", "Na⁺/K⁺-ATPase failure; cells swell", "GM ± WM; DWI bright"], ["Cardiac arrest with global hypoxia", "Cytotoxic", "Na⁺/K⁺-ATPase failure; cells swell", "GM ± WM; DWI bright"], ["Metastatic tumor", "Vasogenic", "BBB breakdown; protein + water leak", "WM only; finger-like spread"], ["Brain abscess", "Vasogenic", "BBB breakdown; protein + water leak", "WM only; finger-like spread"], ["Focal contusion with swelling", "Vasogenic", "BBB breakdown; protein + water leak", "WM only; finger-like spread"], ["Obstructive hydrocephalus", "Interstitial (hydrocephalic)", "CSF forced out of ventricles", "Periventricular rim around ventricles"]], "easyGiven": [0], "hardGiven": [0], "decoys": {"1": ["Osmotic", "Hemorrhagic"], "2": ["Plasma oncotic pressure falls", "Lymphatic obstruction in brain"], "3": ["Leptomeninges only", "Subdural crescent"]}, "notes": ["Ischemia stops ATP → pump failure → water into cells. Cell death means GM ± WM involvement and DWI restriction.", "Global hypoxia produces diffuse cytotoxic swelling with loss of gray-white differentiation on CT.", "Leaky tumor vessels let plasma and protein into extracellular space, tracking along WM fibers.", "Edema around an abscess is vasogenic, even though the pus itself restricts diffusion.", "Focal swelling around contusion or ICH is typically vasogenic due to BBB breakdown.", "Raised intraventricular pressure pushes CSF into periventricular extracellular space."], "hy": "Vasogenic = WM only, BBB breakdown, irritated/chronic (tumor, abscess, contusion), steroid-responsive. Cytotoxic = GM ± WM, cell death (infarct, hypoxia), DWI bright. Interstitial = periventricular, hydrocephalus."}, {"id": "g03", "lec": "08", "lo": "08.4", "title": "Intracranial hemorrhage chart", "blurb": "Read the vignette, name the bleed, then its source, CT shape and time course.", "cols": [{"h": "Vignette clue"}, {"h": "Hemorrhage", "dep": 0}, {"h": "Source", "dep": 1}, {"h": "Imaging", "dep": 1}, {"h": "Time course", "dep": 1}], "rows": [["Temple blow, brief LOC, wakes, then coma", "Epidural hematoma", "Middle meningeal artery", "Biconvex; stops at sutures", "Lucid interval, rapid decline"], ["Elderly fall; confusion 30 h later", "Subdural hematoma", "Bridging veins", "Crescent; crosses sutures", "Hours to weeks (venous)"], ["Thunderclap headache, no trauma", "Aneurysmal subarachnoid", "Saccular (berry) aneurysm", "Blood in sulci and cisterns", "Vasospasm risk days 3–14"], ["Blow to the neck, instant collapse", "Massive basal subarachnoid", "Vertebral artery laceration", "Blood in sulci and cisterns", "Very rapid collapse, high mortality"], ["Long-standing hypertension, hemiparesis", "Hypertensive intracerebral", "Lenticulostriate arteries", "Putamen/basal ganglia clot", "Minutes to hours"], ["Comatose after transtentorial herniation", "Duret hemorrhage", "Basilar perforating branches", "Midline pontine/midbrain bleeds", "Late, after herniation"]], "easyGiven": [0, 1], "hardGiven": [0], "decoys": {"1": ["Diffuse axonal injury", "Contre-coup contusion"], "2": ["Superior sagittal sinus", "Anterior choroidal artery", "Middle cerebral artery trunk"], "3": ["Ring-enhancing mass", "Splenium of corpus callosum", "Periventricular rim"], "4": ["Fixed deficit from birth", "Years, slowly progressive"]}, "notes": ["Squamous temporal fracture tears the MMA; dura is stuck at sutures, so the clot is lens-shaped. Burr-hole emergency.", "Atrophy stretches bridging veins; low-pressure bleeding gives a delayed, fluctuating course.", "Berry aneurysm rupture at circle of Willis branch points: worst headache of life, no trauma.", "Isolated massive basal SAH after a neck (not head) blow → vertebral artery injury, high mortality.", "Charcot-Bouchard microaneurysms of lenticulostriates; a common distractor for traumatic bleeds.", "Caudal brainstem displacement tears basilar perforators → secondary midline brainstem bleeds."], "hy": "EDH = MMA, temporal fracture, lens shape, lucid interval. SDH = bridging veins, elderly/alcoholics/shaken baby, crescent crossing sutures. SAH = berry aneurysm, thunderclap headache."}, {"id": "g04", "lec": "08", "lo": "08.2", "title": "Herniation syndromes", "blurb": "From the deficit, find the compressed structure, the herniation and what moved.", "cols": [{"h": "Herniation", "dep": 2}, {"h": "Tissue displaced", "dep": 0}, {"h": "Structure compressed", "dep": 3}, {"h": "Deficit"}], "rows": [["Subfalcine", "Cingulate gyrus under falx", "Anterior cerebral artery", "Contralateral leg weakness"], ["Uncal (transtentorial)", "Uncus over tentorial edge", "Ipsilateral CN III", "Ipsilateral blown pupil"], ["Uncal (transtentorial)", "Uncus over tentorial edge", "Posterior cerebral artery", "Contralateral hemianopia"], ["Uncal (transtentorial)", "Uncus over tentorial edge", "Contralateral peduncle", "Ipsilateral hemiparesis"], ["Central (axial)", "Brainstem displaced caudally", "Basilar perforating branches", "Duret hemorrhage, coma"], ["Tonsillar", "Cerebellar tonsils into foramen", "Medulla", "Cardiorespiratory arrest"]], "easyGiven": [0], "hardGiven": [3], "decoys": {"0": ["Upward cerebellar", "External (transcalvarial)"], "1": ["Temporal pole over sphenoid", "Vermis through tentorial notch"], "2": ["Middle cerebral artery", "Ipsilateral CN IV", "Pons"]}, "notes": ["Cingulate herniates under the falx and compresses the ACA → infarct of the medial (leg) motor/sensory cortex.", "Parasympathetic CN III fibers run superficially, so the pupil blows first.", "PCA is pinned against the tentorium → occipital infarct.", "Kernohan notch: the opposite peduncle hits the tentorium → ipsilateral weakness, a false localizing sign.", "Caudal shift stretches pontine perforators → Duret hemorrhages.", "Tonsils occlude the foramen magnum, blocking CSF and compressing medullary cardiorespiratory centers."], "hy": "Blown pupil = ipsilateral uncal herniation (CN III). Kernohan = ipsilateral hemiparesis. Subfalcine = ACA. Tonsillar = medulla → lissencephaly; mosaic females get a band of arrested neurons in WM.", "Many small fused gyri; causes include GPR56, metabolic disease and in-utero ischemia/infection (pore margins).", "Balloon cells: glassy eosinophilic cytoplasm, peripheral nucleus, CD34+; identical to TSC cortical tubers."], "hy": "Anencephaly/NTD → ↑AFP, prevent with folate. Holoprosencephaly → SHH, trisomy 13, cyclopia. Lissencephaly → LIS1 (17p13.3, Miller-Dieker). Chiari II ↔ myelomeningocele."}, {"id": "g06", "lec": "07", "lo": "07.7", "title": "Perinatal brain injury chart", "blurb": "From the timing and risk, name the lesion, then its pathogenesis, pathology and outcome.", "cols": [{"h": "Timing / risk"}, {"h": "Disorder", "dep": 0}, {"h": "Pathogenesis", "dep": 1}, {"h": "Pathology", "dep": 1}, {"h": "Outcome", "dep": 1}], "rows": [["Ventilated 26-wk preemie, first 24 h", "Germinal matrix hemorrhage", "Fragile matrix vessels + BP swings", "Subependymal bleed → IVH", "Post-hemorrhagic hydrocephalus"], ["Preterm sepsis/hypotension; later WM cysts", "Periventricular leukomalacia", "Ischemia of periventricular WM", "Chalky periventricular WM necrosis", "Spastic diplegia"], ["3rd trimester; co-twin died in utero", "Multicystic encephalopathy", "Global hypoxic-ischemic injury", "Spider-web gliovascular bands", "Microcephaly, seizures, early death"], ["Severe neonatal jaundice", "Kernicterus", "Unconjugated bilirubin crosses BBB", "Yellow basal ganglia/hippocampus", "Choreoathetosis, deafness"], ["Maternal primary infection in pregnancy", "Congenital CMV", "Viral necrosis of periventricular tissue", "Periventricular calcifications", "Hearing loss, microcephaly"]], "easyGiven": [0], "hardGiven": [0], "decoys": {"1": ["Holoprosencephaly", "Anencephaly"], "2": ["Failed neural tube closure", "LIS1 haploinsufficiency"], "3": ["Area cerebrovasculosa", "Balloon cells"], "4": ["Full recovery, no sequelae", "Ipsilateral hemiparesis"]}, "notes": ["Most GMH occurs within 24 h of birth in ventilated preemies; risk >50% at 24 weeks.", "Watershed periventricular WM is vulnerable in preterms; descending leg fibers run there → spastic diplegia.", "Late gestation global ischemia (↓fetal movement, co-twin death) destroys hemispheres; hydrocephalus ex vacuo.", "Bilirubin stains deep gray matter; no hemorrhage or aqueductal scarring.", "Periventricular necrosis with calcification; it does not cause GMH-type bleeding with aqueductal obstruction."], "hy": "Preemie (<34 wk) + ventilation + first day → germinal matrix hemorrhage → IVH → hydrocephalus. Periventricular leukomalacia → spastic diplegia."}, {"id": "g07", "lec": "08", "lo": "08.3", "title": "Traumatic brain injury chart", "blurb": "From the mechanism, identify the injury, where it hits and its hallmark and clinical picture.", "cols": [{"h": "Mechanism"}, {"h": "Injury", "dep": 0}, {"h": "Typical location", "dep": 1}, {"h": "Hallmark", "dep": 1}, {"h": "Clinical picture", "dep": 1}], "rows": [["Mild blow, rapid full recovery", "Concussion", "No gross lesion", "Sparse axonal injury at most", "Brief LOC and amnesia"], ["Stationary head struck by object", "Coup contusion", "Beneath the impact site", "Hemorrhagic gyral crests", "Focal deficit at impact site"], ["Moving head hits ground (occiput)", "Contre-coup contusion", "Orbitofrontal gyri, temporal poles", "Hemorrhagic gyral crests", "Behavior change, anosmia"], ["High-velocity rotation (car crash)", "Diffuse axonal injury", "Corpus callosum, gray-white junction", "β-APP, axonal spheroids", "Immediate coma, no lucid interval"], ["Repeated sub-concussive hits", "Chronic traumatic encephalopathy", "Depths of cortical sulci", "Tau in neurons and glia", "Mood change, memory loss, dementia"], ["Projectile or stab wound", "Penetrating injury", "Along the missile tract", "Local tissue necrosis", "Deficit depends on tract"]], "easyGiven": [0], "hardGiven": [0], "decoys": {"1": ["Epidural hematoma", "Duret hemorrhage"], "2": ["Occipital pole only", "Cerebellar tonsils"], "3": ["Amyloid plaques", "Balloon cells", "Lewy bodies"], "4": ["Lucid interval, then coma", "Fixed deficit from birth"]}, "notes": ["Mildest TBI; reversible. Rare autopsies show scattered β-APP-positive axons.", "Stationary head accelerated by a blow → bruise under the contact point.", "Fall on the occiput → brain hits the rough anterior/middle fossa floor; heals as plaques jaunes.", "Shear at density interfaces and midline WM; most are comatose from impact and stay severely disabled.", "Seen in boxers, football, hockey, soccer, military; may include TDP-43 inclusions.", "Damage concentrated along the path of the object."], "hy": "DAI = rotational acceleration, corpus callosum/gray-white junction, β-APP, no lucid interval. Contre-coup = orbitofrontal + temporal poles after an occipital fall. CTE = tau."}]};

/* ---------- shared bits ---------- */
function segHTML(name,label,opts,cur){return `<div class="optrow"><span class="lab">${label}</span><div class="seg" role="group" aria-label="${label}">${opts.map(([v,t])=>`<button type="button" data-${name}="${v}" aria-pressed="${v===cur}">${t}</button>`).join("")}</div></div>`;}
function bindSeg(root,name,cb){root.querySelectorAll(`[data-${name}]`).forEach(b=>b.onclick=()=>{F[name]=b.dataset[name];root.querySelectorAll(`[data-${name}]`).forEach(x=>x.setAttribute("aria-pressed",String(x===b)));cb&&cb();});}
function lecChips(){return `<div class="optrow"><span class="lab">Lectures</span><div class="chips">${DATA.lectures.map(l=>`<button type="button" class="chip" data-lec="${l.k}" aria-pressed="${F.lecs.has(l.k)}" style="--c:var(--${l.disc})"><i></i>${esc(lecLabel(l.k))} · ${esc(l.name)}</button>`).join("")}</div></div>`;}
function kindChips(){const present=[...new Set(ITEMS.map(i=>i.kind))];return `<div class="optrow"><span class="lab">Match types</span><div class="chips">${present.map(k=>`<button type="button" class="chip" data-kind="${k}" aria-pressed="${F.kinds.has(k)}" style="--c:var(${KIND[k].c})"><i></i>${KIND[k].l} <span class="n">${ITEMS.filter(i=>i.kind===k).length}</span></button>`).join("")}</div></div>`;}
function bindChips(root,cb){
  root.querySelectorAll("[data-lec]").forEach(b=>b.onclick=()=>{const k=b.dataset.lec;if(F.lecs.has(k)){if(F.lecs.size>1)F.lecs.delete(k);}else F.lecs.add(k);b.setAttribute("aria-pressed",String(F.lecs.has(k)));cb&&cb();});
  root.querySelectorAll("[data-kind]").forEach(b=>b.onclick=()=>{const k=b.dataset.kind;if(F.kinds.has(k)){const vis=[...F.kinds].filter(x=>ITEMS.some(i=>i.kind===x));if(vis.length>1)F.kinds.delete(k);}else F.kinds.add(k);b.setAttribute("aria-pressed",String(F.kinds.has(k)));cb&&cb();});
}
function stars(n){return `<span class="stars" aria-label="${n} of 3 stars">${[1,2,3].map(i=>i<=n?"★":'<span class="off">★</span>').join("")}</span>`;}

/* ---------- RAPID FIRE: play ---------- */
let RF=null, timerId=null;
function stopTimer(){if(timerId){cancelAnimationFrame(timerId);timerId=null;}}
function startRF(){
  let p=shuffle(pool());
  // interleave so the same set doesn't come back to back
  const out=[];while(p.length){let i=p.findIndex(x=>!out.length||sid(x)!==sid(out[out.length-1]));if(i<0)i=0;out.push(p.splice(i,1)[0]);}
  const n=F.len==="all"?out.length:Math.min(out.length,+F.len);
  RF={q:out.slice(0,n).map(it=>({it,retry:false})),i:0,score:0,streak:0,best:0,first:0,firstOk:0,misses:[],answered:false};
  go("rfplay");
}
const sid=it=>it.t==="pair"?it.set.id:it.q.id;
function topBar(){
  const tot=RF.q.length;
  return `<div class="rf-top">
    <div class="statrow">
      <div class="stat"><b>${Math.min(RF.i+1,tot)}/${tot}</b><span>Card</span></div>
      <div class="stat"><b>${RF.score}</b><span>Score</span></div>
      <div class="stat"><b>${RF.streak}</b><span>Streak</span></div>
      <div class="stat"><b>${RF.first?Math.round(100*RF.firstOk/RF.first)+"%":"—"}</b><span>First-try accuracy</span></div>
    </div>
    <button class="btn sm" type="button" id="quitRF">End round</button>
  </div>
  <div class="bar"><i style="width:${100*RF.i/tot}%;background:var(--accent)"></i></div>`;
}
function renderQ(){
  if(RF.i>=RF.q.length){go("rfend");return;}
  const cur=RF.q[RF.i]; RF.answered=false;
  if(cur.it.t==="seq")return renderSeq(cur);
  const it=cur.it,s=it.set,p=it.p;
  if(cur.rev===undefined)cur.rev=F.dir==="mixed"&&Math.random()<.3;
  if(!cur.opts){
    const others=shuffle(s.pairs.filter((_,j)=>j!==it.i)).slice(0,3);
    cur.opts=shuffle([p,...others]);
  }
  const K=KIND[s.kind]||KIND["term-def"];
  const promptLab=cur.rev?s.right:s.left, ansLab=cur.rev?s.left:s.right;
  $("#app").innerHTML=`${topBar()}
  <section class="qcard panel">
    <div class="qhead"><span class="kind" style="--kc:var(${K.c})">${cur.rev?esc(K.l.split(" → ").reverse().join(" → ")):K.l}</span>${lecTag(it.lec)}<span class="qset">${esc(s.title)}</span>${cur.retry?'<span class="hy" style="background:var(--once-bg);border-color:var(--once);color:var(--ink)">Retry</span>':""}</div>
    ${F.timer!=="off"?'<div class="timer" aria-hidden="true"><i id="tbar"></i></div>':""}
    <div><div class="prompt-lab">${esc(promptLab)}</div><p class="prompt">${esc(cur.rev?p.b:p.a)}</p></div>
    <p class="ask">Pick the matching ${esc(ansLab.toLowerCase())}.</p>
    <div class="options" role="group" aria-label="Answer choices">
      ${cur.opts.map((o,k)=>`<button type="button" class="opt" data-k="${k}"><span class="key">${k+1}</span><span>${esc(cur.rev?o.a:o.b)}</span></button>`).join("")}
    </div>
    <div id="fbSlot"></div>
  </section>`;
  $("#quitRF").onclick=()=>go("rfend");
  document.querySelectorAll(".opt[data-k]").forEach(b=>b.onclick=()=>answer(+b.dataset.k));
  if(F.timer!=="off")runTimer(+F.timer,()=>answer(-1));
}
function runTimer(sec,onEnd){
  const t0=performance.now();
  const tick=now=>{const f=Math.max(0,1-(now-t0)/(sec*1000));const bar=$("#tbar");if(bar){bar.style.width=(f*100)+"%";bar.classList.toggle("low",f<.3);}RF.tleft=f;if(f<=0){timerId=null;onEnd();return;}timerId=requestAnimationFrame(tick);};
  timerId=requestAnimationFrame(tick);
}
function record(cur,ok){
  const st=itemStat(cur.it.key);st.n++;if(ok){st.ok++;st.run++;}else st.run=0;st.last=ok;
  if(!cur.retry){RF.first++;if(ok)RF.firstOk++;}
  if(ok){RF.streak++;RF.best=Math.max(RF.best,RF.streak);S.best=Math.max(S.best||0,RF.best);}else{RF.streak=0;}
  if(!ok){
    if(!RF.misses.includes(cur.it))RF.misses.push(cur.it);
    if(!cur.retry){const at=Math.min(RF.q.length,RF.i+3+Math.floor(Math.random()*3));RF.q.splice(at,0,{it:cur.it,retry:true});}
  }
  save();
}
function answer(k){
  if(RF.answered)return;RF.answered=true;stopTimer();
  const cur=RF.q[RF.i],it=cur.it,s=it.set,p=it.p;
  const chosen=k>=0?cur.opts[k]:null, ok=chosen===p;
  let pts=0;if(ok){pts=100+Math.min(50,RF.streak*10);if(F.timer!=="off")pts+=Math.round(50*(RF.tleft||0));}
  RF.score+=pts;record(cur,ok);
  document.querySelectorAll(".opt[data-k]").forEach(b=>{const o=cur.opts[+b.dataset.k];b.disabled=true;if(o===p)b.classList.add("correct");else if(o===chosen)b.classList.add("wrong");else b.classList.add("dim");});
  const ansTxt=cur.rev?p.a:p.b;
  let also="";
  if(chosen&&!ok)also=`<p class="also">You picked <b>${esc(cur.rev?chosen.a:chosen.b)}</b>, which matches <b>${esc(cur.rev?chosen.b:chosen.a)}</b>.</p>`;
  $("#fbSlot").innerHTML=`<div class="fb ${ok?"ok":"bad"}">
    <h3>${ok?`Correct · +${pts}`:k<0?"Time's up":"Not quite"}</h3>
    ${ok?"":`<p>Correct match: <b>${esc(ansTxt)}</b></p>`}
    ${p.why?`<p>${esc(p.why)}</p>`:""}
    ${also}
    ${p.hy?`<div class="hybox"><b>High yield · Step 1</b>${esc(p.a)} → ${esc(p.b)}</div>`:""}
    <div class="navrow"><span class="kbd">${ok?"":"This one comes back later in the round. "}Enter = next</span><button class="btn primary" id="nextQ" type="button">Next &rarr;</button></div>
  </div>`;
  $("#nextQ").onclick=next;$("#nextQ").focus({preventScroll:true});
  $("#fbSlot").scrollIntoView({block:"nearest",behavior:"smooth"});
}
function next(){RF.i++;renderQ();}
function renderSeq(cur){
  const q=cur.it.q;
  if(!cur.order){cur.order=shuffle(q.steps.map((_,i)=>i));if(cur.order.every((v,i)=>v===i)&&q.steps.length>1)cur.order.reverse();}
  cur.placed=0;cur.err=0;
  const draw=()=>{
    $("#app").innerHTML=`${topBar()}
    <section class="qcard panel">
      <div class="qhead"><span class="kind" style="--kc:var(${KIND.sequence.c})">${KIND.sequence.l}</span>${lecTag(q.lec)}<span class="qset">${esc(q.title)}</span>${cur.retry?'<span class="hy" style="background:var(--once-bg);border-color:var(--once);color:var(--ink)">Retry</span>':""}</div>
      ${F.timer!=="off"?'<div class="timer" aria-hidden="true"><i id="tbar"></i></div>':""}
      <p class="prompt">${esc(q.prompt)}</p>
      <ol class="seq-done">${q.steps.map((s,i)=>i<cur.placed?`<li>${esc(s)}</li>`:i===cur.placed?`<li class="slot">Tap step ${i+1}…</li>`:"").join("")}</ol>
      <div class="seq-pool" role="group" aria-label="Steps to place">${cur.order.filter(i=>i>=cur.placed).map(i=>`<button type="button" class="opt" data-s="${i}"><span>${esc(q.steps[i])}</span></button>`).join("")}</div>
      <div class="navrow"><span class="kbd">Mistakes: ${cur.err}</span><button class="btn sm" type="button" id="giveUp">Show order</button></div>
      <div id="fbSlot"></div>
    </section>`;
    $("#quitRF").onclick=()=>go("rfend");
    $("#giveUp").onclick=()=>{cur.err=Math.max(cur.err,3);cur.placed=q.steps.length;finishSeq(cur,true);};
    document.querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>{
      const i=+b.dataset.s;
      if(i===cur.placed){cur.placed++;if(cur.placed>=q.steps.length){finishSeq(cur);}else draw();}
      else{cur.err++;b.classList.remove("shake");void b.offsetWidth;b.classList.add("shake");$(".navrow .kbd").textContent="Mistakes: "+cur.err;}
    });
  };
  draw();
  if(F.timer!=="off")runTimer(+F.timer*2,()=>{cur.err=Math.max(cur.err,3);cur.placed=q.steps.length;finishSeq(cur,true);});
}
function finishSeq(cur,gaveUp){
  if(RF.answered)return;RF.answered=true;stopTimer();
  const q=cur.it.q, ok=!gaveUp&&cur.err===0;
  const pts=gaveUp?0:Math.max(0,100-25*cur.err)+(ok?Math.min(50,RF.streak*10):0);
  RF.score+=pts;record(cur,ok);
  $("#app").querySelector(".seq-done").innerHTML=q.steps.map(s=>`<li>${esc(s)}</li>`).join("");
  $("#app").querySelector(".seq-pool").innerHTML="";
  $("#giveUp").remove();
  $("#fbSlot").innerHTML=`<div class="fb ${ok?"ok":"bad"}">
    <h3>${ok?`Perfect order · +${pts}`:gaveUp?"Here's the order":`Done with ${cur.err} mistake${cur.err===1?"":"s"} · +${pts}`}</h3>
    ${q.why?`<p>${esc(q.why)}</p>`:""}
    ${q.hy?`<div class="hybox"><b>High yield · Step 1</b>${esc(q.title)}: know this order cold.</div>`:""}
    <div class="navrow"><span class="kbd">${ok?"":"This one comes back later in the round. "}Enter = next</span><button class="btn primary" id="nextQ" type="button">Next &rarr;</button></div>
  </div>`;
  $("#nextQ").onclick=next;$("#nextQ").focus({preventScroll:true});
}
document.addEventListener("keydown",e=>{
  if(view!=="rfplay"||e.metaKey||e.ctrlKey||e.altKey)return;
  if(/^[1-4]$/.test(e.key)&&!RF.answered){const b=$(`.opt[data-k="${+e.key-1}"]`);if(b){e.preventDefault();b.click();}}
  else if(e.key==="Enter"&&RF.answered&&document.activeElement&&document.activeElement.id!=="quitRF"){const n=$("#nextQ");if(n&&document.activeElement!==n){e.preventDefault();n.click();}}
});
