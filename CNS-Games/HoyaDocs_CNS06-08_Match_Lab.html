/* ---------- GRID LOCK: play ---------- */
let G=null;
function startGrid(id){
  const g=DATA.grids.find(x=>x.id===id); if(!g){go("glist");return;}
  const hard=F.diff==="hard", given=new Set(hard?g.hardGiven:g.easyGiven);
  const cells=g.rows.map(r=>r.map((v,c)=>({v,given:given.has(c),filled:false})));
  if(!hard){ // reveal ~30% of the remaining cells, but leave at least 2 blanks per column
    g.cols.forEach((_,c)=>{if(given.has(c))return;const idx=shuffle(g.rows.map((_,r)=>r));const k=Math.min(Math.floor(g.rows.length*.3+Math.random()*.6),g.rows.length-2);idx.slice(0,Math.max(0,k)).forEach(r=>cells[r][c].given=true);});
  }
  const tileOrder={};g.cols.forEach((_,c)=>{tileOrder[c]=shuffle([...new Set(g.rows.map(r=>r[c])),...((g.decoys||{})[c]||[])]);});
  G={g,hard,cells,sel:null,mistakes:0,hints:0,t0:Date.now(),tried:{},tileOrder,doneRows:new Set(),done:false,msg:"",msgCls:""};
  g.rows.forEach((_,r)=>{if(rowDone(r))G.doneRows.add(r);});
  G.sel=nextOpen(-1);
  drawGrid();
}
const isOk=(r,c)=>G.cells[r][c].given||G.cells[r][c].filled;
const rowDone=r=>G.cells[r].every((_,c)=>isOk(r,c));
function locked(r,c){if(!G.hard)return false;const d=G.g.cols[c].dep;if(d===undefined||d===null)return false;return !isOk(r,d);}
function open(r,c){return !isOk(r,c)&&!locked(r,c);}
function nextOpen(from){const R=G.g.rows.length,C=G.g.cols.length,N=R*C;for(let k=1;k<=N;k++){const x=(from+k)%N,r=Math.floor(x/C),c=x%C;if(from<0&&k===N+1)break;if(open(r,c))return [r,c];}return null;}
function remaining(c){const m={};G.g.rows.forEach((row,r)=>{if(!isOk(r,c))m[row[c]]=(m[row[c]]||0)+1;});return m;}
function rowName(r){const g=G.g;const k=(G.hard?g.hardGiven:g.easyGiven)[0];return g.rows[r][k];}
function drawGrid(){
  const g=G.g,C=g.cols.length;
  const tot=g.rows.length*C, done=g.rows.reduce((a,_,r)=>a+g.cols.reduce((b,_,c)=>b+(isOk(r,c)?1:0),0),0);
  const givenCols=new Set(G.hard?g.hardGiven:g.easyGiven);
  const head=g.cols.map((col,c)=>{const clue=G.hard&&givenCols.has(c);const dep=col.dep;return `<th scope="col" class="${clue?"clue":""}">${esc(col.h)}${clue?"<small>Clue · given</small>":G.hard&&dep!=null?`<small>${LOCK.replace('aria-hidden','style="width:10px;height:10px;vertical-align:-1px" aria-hidden')} after ${esc(g.cols[dep].h)}</small>`:""}</th>`;}).join("");
  const body=g.rows.map((row,r)=>`<tr>${row.map((v,c)=>{
    const cl=G.cells[r][c];
    if(cl.given){const clue=G.hard&&givenCols.has(c);return `<td><div class="cell ${clue?"clue":"given"}">${esc(v)}</div></td>`;}
    if(cl.filled)return `<td><div class="cell filled${cl.pop?" pop":""}">${esc(v)}</div></td>`;
    if(locked(r,c))return `<td><button type="button" class="cell locked" disabled title="Solve ${esc(g.cols[g.cols[c].dep].h)} for this row first">${LOCK}<span>${esc(g.cols[g.cols[c].dep].h)} first</span></button></td>`;
    const sel=G.sel&&G.sel[0]===r&&G.sel[1]===c;
    return `<td><button type="button" class="cell empty${sel?" sel":""}${cl.err?" err":""}" data-r="${r}" data-c="${c}" aria-label="${esc(g.cols[c].h)}, row ${r+1}, empty">${sel?"Pick a tile":"—"}</button></td>`;
  }).join("")}</tr>`).join("");
  g.rows.forEach((_,r)=>g.cols.forEach((_,c)=>{G.cells[r][c].pop=false;G.cells[r][c].err=false;}));
  const elapsed=Math.round((Date.now()-G.t0)/1000);
  let bank="";
  if(!G.done){
    if(G.sel){
      const c=G.sel[1],rem=remaining(c),tried=G.tried[c]||new Set();
      const tiles=G.tileOrder[c].filter(v=>rem[v]||(!g.rows.some(rr=>rr[c]===v))).map(v=>{const dec=!g.rows.some(rr=>rr[c]===v);const out=dec&&tried.has(v);return `<button type="button" class="tile${out?" out":""}" ${out?"disabled":""} draggable="${!out}" data-v="${esc(v)}">${esc(v)}${rem[v]>1?`<span class="ct">×${rem[v]}</span>`:""}</button>`;}).join("");
      bank=`<div class="bank" id="bank"><div class="bh"><span>Tiles for <b>${esc(g.cols[c].h)}</b> · row ${G.sel[0]+1}${G.hard?"":` (${esc(rowName(G.sel[0]))})`}</span><span class="toast ${G.msgCls}" id="toast" role="status">${esc(G.msg)}</span></div><div class="tiles">${tiles}</div></div>`;
    } else bank=`<div class="bank"><span class="toast ${G.msgCls}" role="status">${esc(G.msg)||"Tap an empty cell to see its tiles."}</span></div>`;
  }
  const notes=[...G.doneRows].sort((a,b)=>a-b).filter(r=>g.notes&&g.notes[r]).map(r=>`<li><b>${esc(g.rows[r][g.easyGiven[0]])}:</b> ${esc(g.notes[r])}</li>`).join("");
  $("#app").innerHTML=`<section class="gwrap">
    <div class="rf-top">
      <div>${lecTag(g.lec)} <span class="qset">${G.hard?"Hard":"Easy"}</span><h2 style="margin-top:4px">${esc(g.title)}</h2><p class="ask">${esc(g.blurb)}</p></div>
      <div class="statrow"><div class="stat"><b>${done}/${tot}</b><span>Cells</span></div><div class="stat"><b>${G.mistakes}</b><span>Mistakes</span></div><div class="stat"><b>${G.hints}</b><span>Hints</span></div><div class="stat"><b id="clock">${fmt(elapsed)}</b><span>Time</span></div></div>
    </div>
    <div class="navrow"><button class="btn sm" type="button" id="gBack">&larr; All grids</button><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn sm" type="button" id="gHint" ${G.done?"disabled":""}>Hint (fill one cell)</button><button class="btn sm" type="button" id="gRestart">Restart</button><button class="btn sm" type="button" id="gSwap">Switch to ${G.hard?"Easy":"Hard"}</button></div></div>
    <div class="gtable-wrap"><table class="gt"><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>
    ${G.done?doneHTML():bank}
    ${notes&&!G.done?`<div><h3 style="font-size:1rem;margin-bottom:6px">Solved rows</h3><ul class="notes">${notes}</ul></div>`:""}
  </section>`;
  $("#gBack").onclick=()=>go("glist");
  $("#gRestart").onclick=()=>startGrid(g.id);
  $("#gSwap").onclick=()=>{F.diff=G.hard?"easy":"hard";startGrid(g.id);};
  $("#gHint").onclick=hint;
  document.querySelectorAll(".cell.empty").forEach(b=>{
    b.onclick=()=>{G.sel=[+b.dataset.r,+b.dataset.c];G.msg="";drawGrid();const t=$(".tile:not([disabled])");if(t)t.focus({preventScroll:true});const bk=$("#bank");if(bk)bk.scrollIntoView({block:"nearest",behavior:"smooth"});};
    b.ondragover=e=>{e.preventDefault();b.classList.add("drop");};
    b.ondragleave=()=>b.classList.remove("drop");
    b.ondrop=e=>{e.preventDefault();const v=e.dataTransfer.getData("text/plain");place(+b.dataset.r,+b.dataset.c,v);};
  });
  document.querySelectorAll(".tile[data-v]").forEach(t=>{
    t.onclick=()=>{if(G.sel)place(G.sel[0],G.sel[1],t.dataset.v);};
    t.ondragstart=e=>{e.dataTransfer.setData("text/plain",t.dataset.v);t.classList.add("dragging");};
    t.ondragend=()=>t.classList.remove("dragging");
  });
  const d=$("#gDone");if(d)d.onclick=()=>go("glist");
  const h=$("#gHard");if(h)h.onclick=()=>{F.diff="hard";startGrid(g.id);};
  const nx=$("#gNext");if(nx)nx.onclick=()=>{const L=DATA.grids;const i=L.indexOf(g);go("grid",L[(i+1)%L.length].id);};
  tickClock();
}
const fmt=s=>Math.floor(s/60)+":"+String(s%60).padStart(2,"0");
let clockT=null;
function tickClock(){clearTimeout(clockT);if(view!=="grid"||!G||G.done)return;clockT=setTimeout(()=>{const el=$("#clock");if(el)el.textContent=fmt(Math.round((Date.now()-G.t0)/1000));tickClock();},1000);}
function place(r,c,v){
  if(G.done||!open(r,c))return;
  const g=G.g;
  if(g.rows[r][c]===v){
    G.cells[r][c].filled=true;G.cells[r][c].pop=true;
    G.msg="Correct.";G.msgCls="ok";
    if(!G.doneRows.has(r)&&rowDone(r))G.doneRows.add(r);
    const C=g.cols.length;G.sel=nextOpen(r*C+c);
    if(!G.sel&&g.rows.every((_,rr)=>rowDone(rr)))finishGrid();
  } else {
    G.mistakes++;G.cells[r][c].err=true;G.msgCls="bad";
    const inCol=g.rows.some(rr=>rr[c]===v);
    if(inCol){G.msg=`“${v}” belongs in this column, but not this row.`;}
    else{(G.tried[c]=G.tried[c]||new Set()).add(v);G.msg=`“${v}” is a decoy. It isn't in this chart.`;}
    G.sel=[r,c];
  }
  drawGrid();
}
function hint(){
  if(G.done)return;let t=G.sel&&open(...G.sel)?G.sel:nextOpen(-1);if(!t)return;
  G.hints++;G.cells[t[0]][t[1]].filled=true;G.cells[t[0]][t[1]].pop=true;
  if(rowDone(t[0]))G.doneRows.add(t[0]);
  G.msg=`Hint: filled “${G.g.rows[t[0]][t[1]]}”.`;G.msgCls="";
  const C=G.g.cols.length;G.sel=nextOpen(t[0]*C+t[1]);
  if(!G.sel&&G.g.rows.every((_,rr)=>rowDone(rr)))finishGrid();
  drawGrid();
}
function finishGrid(){
  G.done=true;G.secs=Math.round((Date.now()-G.t0)/1000);
  const pen=G.mistakes+2*G.hints;G.stars=pen===0?3:pen<=2?2:1;
  const st=S.grids[G.g.id]||(S.grids[G.g.id]={});const k=G.hard?"hard":"easy";st[k]=Math.max(st[k]||0,G.stars);save();
}
function doneHTML(){
  const g=G.g;
  return `<section class="panel gdone">
    <div class="statrow" style="align-items:center"><h2>Grid solved</h2>${stars(G.stars)}<span class="ask">${fmt(G.secs)} · ${G.mistakes} mistake${G.mistakes===1?"":"s"} · ${G.hints} hint${G.hints===1?"":"s"}</span></div>
    ${g.hy?`<div class="hybox"><b>High yield · Step 1</b>${esc(g.hy)}</div>`:""}
    <ul class="notes">${g.rows.map((row,r)=>g.notes&&g.notes[r]?`<li><b>${esc(row[g.easyGiven[0]])}:</b> ${esc(g.notes[r])}</li>`:"").join("")}</ul>
    <div class="navrow"><button class="btn" type="button" id="gDone">All grids</button><div style="display:flex;gap:8px;flex-wrap:wrap">${G.hard?"":'<button class="btn" type="button" id="gHard">Try it on Hard</button>'}<button class="btn primary" type="button" id="gNext">Next grid &rarr;</button></div></div>
  </section>`;
}

go("home");
})();
</script>
</body>
</html>
