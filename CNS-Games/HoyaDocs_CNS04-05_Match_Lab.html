<style>
/* HoyaDocs Match Lab engine v1.0
   Layout: header + mode tabs; Home (mode cards, filters, mastery), Rapid Fire (one match per card), Grid Lock (chart + tile bank).
   Colors are tokens on :root with a dark set. Every view stacks to one column on phones. */
:root{
  --bg:#f3f5f6; --surface:#ffffff; --sunk:#eef1f4; --ink:#18212b; --muted:#5a6570; --line:#dbe0e5; --chip:#eceff2;
  --neuro:#2c55a0; --path:#a02c4f; --drt:#0f6b6b; --pharm:#85600f; --accent:#2c55a0; --accent-ink:#ffffff;
  --ok:#1d7a3e; --ok-bg:#e3f4e8; --bad:#b3261e; --bad-bg:#fbe7e5; --once:#b7791f; --once-bg:#fdf1dc;
  --hy-bg:#fff6cc; --hy-line:#c9a227; --hy-ink:#4a3a00;
  --k1:#2c55a0; --k2:#6b46c1; --k3:#a02c4f; --k4:#b45309; --k5:#0f6b6b; --k6:#85600f; --k7:#1d7a3e; --k8:#0369a1;
  --given:#f5f7f9; --lock:#e9ecef; --clue-bg:#e3ecfa; --clue-ink:#1d3f7a; --clue-line:#9db6e3;
  --f-display:"Source Serif 4", Georgia, serif; --f-body:"Public Sans", Arial, sans-serif; --f-mono:"IBM Plex Mono", ui-monospace, monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#11161c; --surface:#19212a; --sunk:#141b22; --ink:#e6eaee; --muted:#9aa6b2; --line:#2c3642; --chip:#232c36;
  --neuro:#8fb1f0; --path:#f08aa5; --drt:#5cc2c0; --pharm:#e3bb63; --accent:#8fb1f0; --accent-ink:#0d1520;
  --ok:#6fd08f; --ok-bg:#16301f; --bad:#f28b82; --bad-bg:#3a1b19; --once:#f0c070; --once-bg:#3a2e12;
  --hy-bg:#3a3110; --hy-line:#b8952a; --hy-ink:#f5e6a8;
  --k1:#8fb1f0; --k2:#b9a3f5; --k3:#f08aa5; --k4:#f5a65b; --k5:#5cc2c0; --k6:#e3bb63; --k7:#6fd08f; --k8:#7cc4f0;
  --given:#1d262f; --lock:#161d24; --clue-bg:#1c2b44; --clue-ink:#c4d6f7; --clue-line:#3b5687; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#11161c; --surface:#19212a; --sunk:#141b22; --ink:#e6eaee; --muted:#9aa6b2; --line:#2c3642; --chip:#232c36;
  --neuro:#8fb1f0; --path:#f08aa5; --drt:#5cc2c0; --pharm:#e3bb63; --accent:#8fb1f0; --accent-ink:#0d1520;
  --ok:#6fd08f; --ok-bg:#16301f; --bad:#f28b82; --bad-bg:#3a1b19; --once:#f0c070; --once-bg:#3a2e12;
  --hy-bg:#3a3110; --hy-line:#b8952a; --hy-ink:#f5e6a8;
  --k1:#8fb1f0; --k2:#b9a3f5; --k3:#f08aa5; --k4:#f5a65b; --k5:#5cc2c0; --k6:#e3bb63; --k7:#6fd08f; --k8:#7cc4f0;
  --given:#1d262f; --lock:#161d24; --clue-bg:#1c2b44; --clue-ink:#c4d6f7; --clue-line:#3b5687; color-scheme:dark }
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font:15px/1.5 var(--f-body);margin:0}
.wrap{max-width:1120px;margin:0 auto;padding:20px 16px 48px;display:grid;gap:16px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;line-height:1.2}
button{font:inherit;color:inherit}
a{color:var(--accent)}
.meta{font:500 .74rem var(--f-mono);letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin:0}
header.top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:end;gap:12px}
header.top h1{font-size:clamp(1.5rem,3.4vw,2rem)}
header.top .lede{margin:4px 0 0;color:var(--muted);max-width:66ch}
.back{font:600 .8rem var(--f-body);text-decoration:none;color:var(--muted)}
.back:hover{color:var(--ink)}
.hdr-actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{font:600 .86rem var(--f-body);background:var(--chip);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px 13px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;text-decoration:none}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn[disabled]{opacity:.45;cursor:default}
.btn.sm{padding:5px 10px;font-size:.8rem}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{font:700 .82rem var(--f-body);letter-spacing:.04em;text-transform:uppercase;background:none;border:0;border-bottom:3px solid transparent;padding:10px 12px 8px;color:var(--muted);cursor:pointer;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0}
.panel h2{font-size:1.15rem}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media (max-width:760px){.grid2{grid-template-columns:minmax(0,1fr)}}
.mode-card{display:grid;gap:10px;align-content:start}
.mode-card .k{font:500 .7rem var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.mode-card h2{font-size:1.45rem}
.mode-card p{margin:0;color:var(--muted)}
.opts{display:grid;gap:8px}
.optrow{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.optrow .lab{font:500 .7rem var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);min-width:76px}
.seg{display:inline-flex;background:var(--chip);border-radius:9px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{font:600 .8rem var(--f-body);border:0;background:transparent;padding:5px 10px;border-radius:7px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.14)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:600 .78rem var(--f-body);border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 10px;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--c,var(--muted));flex:none}
.chip[aria-pressed="false"]{opacity:.5;text-decoration:line-through;text-decoration-color:var(--muted)}
.chip .n{font:500 .7rem var(--f-mono);color:var(--muted)}
.statrow{display:flex;flex-wrap:wrap;gap:18px}
.stat b{display:block;font:700 1.25rem var(--f-body);font-variant-numeric:tabular-nums}
.stat span{font:500 .68rem var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.bar{height:6px;background:var(--chip);border-radius:3px;overflow:hidden}
.bar > i{display:block;height:100%;background:var(--ok);border-radius:3px;transition:width .3s}
.lecrow{display:grid;grid-template-columns:auto minmax(0,1fr) 120px auto;gap:4px 10px;align-items:center;padding:6px 0;border-top:1px solid var(--line);font-size:.88rem}
.lecrow:first-of-type{border-top:0}
.lecrow .pct{font:500 .75rem var(--f-mono);color:var(--muted);font-variant-numeric:tabular-nums;min-width:52px;text-align:right}
@media (max-width:560px){.lecrow{grid-template-columns:auto minmax(0,1fr) auto}.lecrow .bar{grid-column:1/-1;order:5}}
.tag{font:600 .68rem var(--f-mono);letter-spacing:.05em;text-transform:uppercase;border-radius:5px;padding:2px 6px;color:#fff;background:var(--lc,var(--neuro));white-space:nowrap}
:root[data-theme="dark"] .tag{color:#0d1520}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .tag{color:#0d1520} }
.hy{font:700 .66rem var(--f-mono);letter-spacing:.06em;background:var(--hy-bg);color:var(--hy-ink);border:1px solid var(--hy-line);border-radius:5px;padding:1px 6px}
.hybox{background:var(--hy-bg);border:1.5px solid var(--hy-line);color:var(--hy-ink);border-radius:10px;padding:10px 12px;font-size:.9rem}
.hybox b{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;display:block;margin-bottom:2px}
details.how{font-size:.9rem}
details.how summary{cursor:pointer;font-weight:700}
details.how ul{margin:8px 0 0;padding-left:18px;color:var(--muted)}
details.how li{margin:3px 0}

/* Rapid fire */
.rf-top{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between}
.timer{height:5px;background:var(--chip);border-radius:3px;overflow:hidden}
.timer i{display:block;height:100%;background:var(--accent);width:100%}
.timer i.low{background:var(--bad)}
.qcard{display:grid;gap:14px;max-width:820px;margin:0 auto;width:100%}
.qhead{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.kind{font:700 .72rem var(--f-body);letter-spacing:.04em;text-transform:uppercase;color:var(--kc);border:1.5px solid var(--kc);border-radius:6px;padding:2px 8px}
.qset{font-size:.82rem;color:var(--muted)}
.prompt-lab{font:500 .7rem var(--f-mono);letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.prompt{font:600 clamp(1.15rem,2.6vw,1.45rem)/1.35 var(--f-display);margin:2px 0 0}
.ask{font-size:.88rem;color:var(--muted);margin:0}
.options{display:grid;gap:8px}
.opt{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;align-items:start;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:11px 12px;cursor:pointer;font-size:.95rem;line-height:1.4}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt .key{font:500 .75rem var(--f-mono);color:var(--muted);border:1px solid var(--line);border-radius:6px;height:24px;display:grid;place-items:center}
.opt.correct{border-color:var(--ok);background:var(--ok-bg)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt[disabled]{cursor:default}
.opt.dim{opacity:.55}
.fb{border-radius:10px;padding:12px 14px;display:grid;gap:8px;font-size:.92rem}
.fb.ok{background:var(--ok-bg);border:1px solid var(--ok)}
.fb.bad{background:var(--bad-bg);border:1px solid var(--bad)}
.fb h3{font:700 .95rem var(--f-body)}
.fb p{margin:0}
.fb .also{font-size:.86rem;color:var(--muted)}
.fb .also b{color:var(--ink)}
.navrow{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center}
.kbd{font:500 .72rem var(--f-mono);color:var(--muted)}
/* sequence */
.seq-done{display:grid;gap:6px;counter-reset:s;padding:0;margin:0;list-style:none}
.seq-done li{counter-increment:s;display:grid;grid-template-columns:26px minmax(0,1fr);gap:8px;align-items:start;background:var(--ok-bg);border:1px solid var(--ok);border-radius:8px;padding:7px 10px;font-size:.92rem}
.seq-done li::before{content:counter(s);font:700 .8rem var(--f-mono);color:var(--ok);text-align:center}
.seq-done li.slot{background:transparent;border:1.5px dashed var(--line);color:var(--muted)}
.seq-done li.slot::before{color:var(--muted)}
.seq-pool{display:grid;gap:6px}
.seq-pool .opt{grid-template-columns:minmax(0,1fr)}
.shake{animation:shake .32s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@media (prefers-reduced-motion:reduce){.shake{animation:none}}
/* end */
.end{display:grid;gap:14px;max-width:820px;margin:0 auto;width:100%}
.big{font:700 clamp(2rem,6vw,3rem)/1 var(--f-display)}
.misslist{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.misslist li{border:1px solid var(--line);border-left:4px solid var(--bad);border-radius:8px;padding:8px 12px;font-size:.9rem;background:var(--surface)}
.misslist .a{font-weight:700}
.misslist .b{color:var(--muted)}

/* Grid list */
.glist{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.gcard{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;cursor:pointer;display:grid;gap:6px;align-content:start}
.gcard:hover{border-color:var(--accent)}
.gcard h3{font-size:1.02rem}
.gcard p{margin:0;font-size:.84rem;color:var(--muted)}
.gcard .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font:500 .72rem var(--f-mono);color:var(--muted)}
.stars{font-size:.85rem;letter-spacing:1px;color:var(--once)}
.stars .off{color:var(--line)}
/* Grid play */
.gwrap{display:grid;gap:12px}
.gtable-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table.gt{border-collapse:separate;border-spacing:0;width:100%;min-width:560px}
.gt th{font:700 .74rem var(--f-body);letter-spacing:.04em;text-transform:uppercase;text-align:left;padding:10px;border-bottom:1px solid var(--line);background:var(--sunk);vertical-align:bottom}
.gt th small{display:block;font:500 .66rem var(--f-mono);letter-spacing:.03em;text-transform:none;color:var(--muted);margin-top:2px}
.gt th.clue{background:var(--clue-bg);color:var(--clue-ink)}
.gt th.clue small{color:var(--clue-ink)}
.gt td{padding:5px;border-bottom:1px solid var(--line);vertical-align:top;min-width:120px}
.gt tr:last-child td{border-bottom:0}
.gt td + td,.gt th + th{border-left:1px solid var(--line)}
.cell{width:100%;min-height:44px;border-radius:8px;padding:7px 9px;font-size:.88rem;line-height:1.3;text-align:left;display:flex;align-items:center;gap:6px}
.cell.given{background:var(--given);font-weight:600}
.cell.clue{background:var(--clue-bg);color:var(--clue-ink);border:1px solid var(--clue-line);font-weight:600}
.cell.empty{border:1.5px dashed var(--line);background:transparent;cursor:pointer;color:var(--muted)}
.cell.empty:hover,.cell.empty.drop{border-color:var(--accent);color:var(--ink)}
.cell.sel{border:2px solid var(--accent);background:color-mix(in srgb,var(--accent) 10%,transparent);color:var(--ink)}
.cell.locked{background:var(--lock);color:var(--muted);border:1px solid var(--line);cursor:not-allowed;font-size:.78rem}
.cell.locked svg{width:13px;height:13px;flex:none}
.cell.filled{background:var(--ok-bg);border:1px solid var(--ok);font-weight:600}
.cell.pop{animation:pop .35s}
@keyframes pop{0%{transform:scale(.94)}60%{transform:scale(1.03)}100%{transform:scale(1)}}
.cell.err{animation:shake .32s;border-color:var(--bad)}
.bank{background:var(--surface);border:1.5px solid var(--accent);border-radius:12px;padding:12px;display:grid;gap:8px;scroll-margin-bottom:16px}
.bank .bh{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center;font-size:.86rem}
.bank .bh b{font-weight:700}
.tiles{display:flex;flex-wrap:wrap;gap:6px;max-height:34vh;overflow:auto}
.tile{font:600 .84rem var(--f-body);background:var(--sunk);border:1.5px solid var(--line);border-radius:8px;padding:7px 10px;cursor:grab;display:inline-flex;gap:6px;align-items:center;max-width:100%;text-align:left}
.tile:hover:not([disabled]){border-color:var(--accent)}
.tile .ct{font:500 .7rem var(--f-mono);color:var(--muted)}
.tile.out{opacity:.45;text-decoration:line-through;cursor:default}
.tile.dragging{opacity:.4}
.toast{font-size:.86rem;font-weight:600}
.toast:empty{display:none}
@media (max-width:560px){.tabs .long{display:none}}
.toast.bad{color:var(--bad)}
.toast.ok{color:var(--ok)}
.notes{display:grid;gap:6px;margin:0;padding:0;list-style:none}
.notes li{border-left:3px solid var(--ok);background:var(--surface);border-radius:6px;padding:6px 10px;font-size:.88rem}
.notes li b{font-weight:700}
.gdone{display:grid;gap:12px}
footer{font-size:.78rem;color:var(--muted);border-top:1px solid var(--line);padding-top:12px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.empty-state{color:var(--muted);font-size:.9rem}
#app{display:grid;gap:16px;min-width:0}
</style>
</head>

<script>
const DATA = {"id": "cns04-05", "code": "CNS04–05", "title": "Spinal Cord, Brainstem & Touch Pathways", "blurb": "Cord levels, segments and dermatomes, motor neurons and Renshaw cells, brainstem and cranial nerve columns, then touch, face and taste pathways and their lesions.", "lectures": [{"k": "04", "name": "Spinal Cord & Brainstem Anatomy", "disc": "neuro"}, {"k": "05", "name": "Somatic Sensations & Ascending Pathways", "disc": "neuro"}], "los": {"04.1": "Relate the adult spinal cord, roots and coverings to the vertebral canal; predict developmental change; identify the level for a spinal tap", "04.2": "Draw, label and identify cross sections of the cervical, thoracic, lumbar and sacral spinal cord", "04.3": "State the number of cervical, thoracic, lumbar, sacral and coccygeal segments and relate a cord segment to its sensory dermatome", "04.4": "Know the function of α and γ motor neurons, the motor unit and motor neuron pool, and Renshaw cells and their role in tetanus", "04.5": "Identify brainstem cross sections at the closed and open medulla, pons and midbrain", "04.6": "Explain how brainstem and spinal cord organization (basal vs alar plate, functional columns) arises from the neural tube", "04.7": "List CN III–XII, assign each to a brainstem subdivision, and know their entry/exit points relative to surface landmarks", "05.1": "Identify the information carried by each skin receptor type and the pathway it uses from body or face to sensory cortex", "05.2": "For the DCML and principal trigeminal pathways, give modality, 1st/2nd/3rd-order cell bodies, synapse sites, tracts and crossing points", "05.3": "Draw cervical cord and brainstem cross sections and label the DCML and sensory trigeminal tracts and nuclei", "05.4": "Know blood supply territories of the brainstem and spinal cord and predict the resulting sensory and motor deficits", "05.5": "Describe how taste is transmitted from the tongue to the cortex"}, "sets": [{"id": "s01", "lec": "04", "lo": "04.1", "kind": "structure-function", "title": "Cord, roots & coverings → role in the vertebral canal", "left": "Structure", "right": "What it is / where it sits", "pairs": [{"a": "Conus medullaris", "b": "Tapered end of the adult spinal cord at about the L1–L2 vertebral level", "why": "The cord ends around L1–L2 in adults (near L3 at birth). A needle placed below L2 in an adult enters CSF without hitting cord.", "hy": true}, {"a": "Cauda equina", "b": "Bundle of lumbosacral roots floating in CSF below the end of the cord", "why": "The roots drift aside when a needle enters, which is why a lumbar puncture below the conus is safe. Compressing them gives saddle anesthesia and bladder/bowel dysfunction.", "hy": true}, {"a": "Filum terminale", "b": "Strand of pia that continues from the conus to anchor the cord to the coccyx", "why": "The filum terminale is pia, not neural tissue. A tight or thickened filum tethers the cord (tethered cord syndrome)."}, {"a": "Denticulate ligaments", "b": "Lateral pial extensions that tether the cord to the dura between the roots", "why": "These ligaments hold the cord in the middle of the dural sac. They are also landmarks separating dorsal from ventral roots."}, {"a": "Lumbar cistern", "b": "Enlarged subarachnoid space below the conus, ending near S2, sampled in a spinal tap", "why": "CSF is drawn from the lumbar cistern. The dural sac ends near S2, well below the conus at L1–L2, which leaves a safe window for the needle."}, {"a": "Dural root sleeve", "b": "Meningeal sleeve that follows the roots into the foramen and merges with epineurium", "why": "The dura continues out along the spinal nerve as its epineurium. This is why meningeal coverings reach the intervertebral foramen."}, {"a": "Intercristal (Tuffier) line", "b": "Line joining the iliac crest tops at about L4, used to locate the L3–L4 or L4–L5 space", "why": "A line across the top of the iliac crests crosses roughly the L4 spinous process. Insert the needle at L3–L4 or L4–L5, safely below the conus.", "hy": true}]}, {"id": "s02", "lec": "04", "lo": "04.3", "kind": "term-app", "title": "Dermatome landmark → spinal segment", "left": "Finding / landmark", "right": "Dermatome", "pairs": [{"a": "Shingles rash across the thumb and radial forearm", "b": "C6", "why": "C6 supplies the thumb (make a '6' with thumb and index finger). Each dermatome is skin supplied by a single dorsal root. VZV reactivates in that root's DRG.", "hy": true}, {"a": "Numbness of the middle finger only", "b": "C7", "why": "C7 supplies the middle finger. C6 covers the thumb and C8 the little finger, so the hand gives three quick reference points."}, {"a": "Numbness of the little finger and ulnar hand", "b": "C8", "why": "C8 supplies the little finger and ulnar side of the hand. Do not confuse C8 with T1, which supplies the medial forearm."}, {"a": "Shingles band at the level of the nipple", "b": "T4", "why": "T4 is at the nipple ('T4 at the teat pore'). Herpes zoster runs in a band along one dermatome and does not cross the midline.", "hy": true}, {"a": "Shingles band around the umbilicus", "b": "T10", "why": "T10 is at the umbilicus ('belly butTEN'). Periumbilical pain referred from early appendicitis also maps to T10.", "hy": true}, {"a": "Sensory loss over the inguinal ligament", "b": "L1", "why": "L1 lies along the inguinal ligament ('IL = Inguinal Ligament')."}, {"a": "Sensory loss over the knee and medial leg", "b": "L4", "why": "L4 covers the knee ('down on all fours') and the medial leg. L4 is also the patellar reflex segment.", "hy": true}, {"a": "Sensory loss over the lateral foot and little toe", "b": "S1", "why": "S1 supplies the lateral foot and little toe and carries the Achilles reflex. L5 supplies the dorsum of the foot and the big toe instead."}]}, {"id": "s03", "lec": "04", "lo": "04.4", "kind": "term-def", "title": "Spinal motor components → definition", "left": "Term", "right": "Definition", "pairs": [{"a": "Alpha (α) motor neuron", "b": "Large ventral horn LMN that innervates extrafusal fibers to generate force", "why": "α motor neurons drive ordinary (extrafusal) striated muscle. They are the final common pathway for all motor tracts.", "hy": true}, {"a": "Gamma (γ) motor neuron", "b": "Small ventral horn LMN that innervates intrafusal fibers of muscle spindles", "why": "γ neurons contract the ends of intrafusal fibers, keeping the spindle taut so it stays sensitive to stretch.", "hy": true}, {"a": "Motor unit", "b": "One α motor neuron plus every muscle fiber that its axon innervates", "why": "The motor unit is the smallest unit of force. Small units (about 1:10) give fine control and large units (about 1:1000) give high force."}, {"a": "Motor neuron pool", "b": "All motor neurons supplying one muscle, often spanning several cord segments", "why": "A pool is a column of neurons running along several segments. This is why one root lesion usually weakens a muscle without paralyzing it."}, {"a": "Renshaw cell", "b": "Glycinergic interneuron excited by α collaterals that feeds inhibition back onto them", "why": "Renshaw cells give recurrent inhibition that keeps α motor neurons from firing continuously. They are the target of tetanus toxin and strychnine.", "hy": true}, {"a": "Upper motor neuron", "b": "Neuron starting in the brain that synapses on LMNs and never directly on muscle", "why": "Corticospinal, corticobulbar, rubrospinal, vestibulospinal and reticulospinal neurons are all UMNs. Each acts through an LMN."}, {"a": "Intermediolateral cell column neuron", "b": "Sympathetic preganglionic neuron in the lateral horn from T1 to L2–L3", "why": "The lateral horn (IML) holds sympathetic preganglionic neurons from T1 to L2–L3. Parasympathetic preganglionic neurons are in the S2–S4 cord.", "hy": true}]}, {"id": "s04", "lec": "04", "lo": "04.4", "kind": "cause-effect", "title": "Motor neuron disturbance → consequence", "left": "Cause", "right": "Effect", "pairs": [{"a": "Tetanus toxin in Renshaw/inhibitory interneurons", "b": "Glycine release blocked → unchecked α firing: trismus, opisthotonos, spasms", "why": "Tetanospasmin cleaves synaptobrevin, so inhibitory interneurons cannot release glycine or GABA. The result is spastic paralysis ('lockjaw').", "hy": true}, {"a": "Strychnine poisoning", "b": "Glycine receptors on α motor neurons blocked → violent reflex convulsions", "why": "Strychnine produces the same disinhibition as tetanus at a different step. It blocks glycine receptors on the postsynaptic side, while tetanus blocks glycine release."}, {"a": "Botulinum toxin", "b": "ACh release blocked at the neuromuscular junction → descending flaccid paralysis", "why": "Botulinum and tetanus toxins both cleave SNAREs. Botulinum acts at the NMJ (flaccid paralysis) and tetanus acts in the cord's inhibitory interneurons (spastic paralysis).", "hy": true}, {"a": "Upper motor neuron lesion", "b": "Spastic weakness, hyperreflexia, upgoing Babinski, little muscle atrophy", "why": "Losing descending control releases the spinal reflex arcs, so tone and reflexes go up. Compare the left leg in the ladder-fall case.", "hy": true}, {"a": "Lower motor neuron lesion", "b": "Flaccid weakness, hyporeflexia, fasciculations and marked muscle atrophy", "why": "The reflex arc itself is broken and the muscle loses its trophic input. Expect wasting and fasciculations."}, {"a": "Loss of γ motor neuron drive", "b": "Spindles go slack during contraction → reduced stretch reflex sensitivity", "why": "α–γ coactivation shortens the spindle along with the muscle. Without γ drive, the spindle stops signaling during contraction."}, {"a": "Muscle built from small motor units (~1:10)", "b": "Finely graded force for precise movement, e.g., extraocular and hand muscles", "why": "Few fibers per neuron means each recruited unit adds a small step of force, so the muscle can be finely controlled."}, {"a": "Muscle built from large motor units (~1:1000)", "b": "Coarse but powerful force for posture and locomotion, e.g., gastrocnemius", "why": "Many fibers per neuron gives high force with little precision. This suits antigravity and postural muscles."}]}, {"id": "s05", "lec": "04", "lo": "04.6", "kind": "term-def", "title": "Functional column → what it carries", "left": "Functional column", "right": "Modality carried", "pairs": [{"a": "GSE (general somatic efferent)", "b": "Motor to somite-derived skeletal muscle: extraocular muscles and tongue", "why": "GSE nuclei (III, IV, VI, XII) come from the basal plate and lie most medially, next to the midline.", "hy": true}, {"a": "GVE (general visceral efferent)", "b": "Preganglionic parasympathetic motor to glands, smooth muscle and heart", "why": "Examples are Edinger–Westphal (III), the salivatory nuclei (VII, IX) and the dorsal motor nucleus of X. All come from the basal plate."}, {"a": "SVE (special visceral efferent)", "b": "Motor to pharyngeal (branchial) arch muscles of jaw, face, pharynx and larynx", "why": "SVE nuclei are motor V, the facial nucleus and nucleus ambiguus. They migrate ventrolaterally but are still basal-plate (motor)."}, {"a": "GSA (general sensory/somatic afferent)", "b": "Touch, pain, temperature and proprioception from skin and mucosa", "why": "The trigeminal sensory nuclei are GSA. They develop from the alar plate, so they lie lateral to the sulcus limitans."}, {"a": "GVA (general visceral afferent)", "b": "Visceral sensation from organs, e.g., carotid body, baroreceptors and gut", "why": "GVA input from IX and X ends in the middle and caudal solitary nucleus. This alar-plate input drives cardiorespiratory and GI reflexes."}, {"a": "SVA (special visceral afferent)", "b": "Chemical special sense of taste from the tongue and epiglottis", "why": "SVA taste fibers in VII, IX and X end in the rostral (gustatory) solitary nucleus."}, {"a": "SSA (special sensory/somatic afferent)", "b": "Special senses of vision, hearing and balance", "why": "In the brainstem, SSA means the vestibular and cochlear nuclei (VIII). They are the most lateral alar-plate column."}]}, {"id": "s06", "lec": "04", "lo": "04.7", "kind": "structure-function", "title": "Cranial nerve → brainstem exit point", "left": "Cranial nerve", "right": "Where it leaves the brainstem", "pairs": [{"a": "CN III (oculomotor)", "b": "Interpeduncular fossa, between the two cerebral peduncles of the midbrain", "why": "CN III exits ventrally between the peduncles, close to the PCA and SCA. A posterior communicating artery aneurysm can compress it."}, {"a": "CN IV (trochlear)", "b": "Dorsal midbrain just below the inferior colliculus, the only dorsal exit", "why": "CN IV is the only nerve that exits dorsally and the only one that crosses completely. It is also the thinnest and longest intracranial nerve.", "hy": true}, {"a": "CN V (trigeminal)", "b": "Ventrolateral mid-pons, where the basis pontis meets the middle cerebellar peduncle", "why": "The large sensory root and small motor root of V emerge at mid-pons, marking the boundary between the basis pontis and the middle cerebellar peduncle."}, {"a": "CN VI (abducens)", "b": "Pontomedullary junction close to the midline, just above the pyramid", "why": "VI exits medially at the pontomedullary junction and has a long intracranial course. It is easily stretched when ICP rises."}, {"a": "CN VIII (vestibulocochlear)", "b": "Cerebellopontine angle, most lateral nerve at the pontomedullary junction", "why": "From medial to lateral, VI, VII and VIII exit at the pontomedullary junction. A CP-angle vestibular schwannoma affects VIII first; as it grows it compresses V and VII."}, {"a": "CN IX and X", "b": "Postolivary sulcus, between the olive and inferior cerebellar peduncle", "why": "IX and X rootlets leave the medulla behind the olive. Their nucleus ambiguus is in the lateral medulla (PICA territory)."}, {"a": "CN XII (hypoglossal)", "b": "Preolivary sulcus, between the pyramid and the olive", "why": "XII exits next to the pyramid. This is why a medial medullary infarct hits the pyramid, the medial lemniscus and XII together.", "hy": true}, {"a": "CN XI (spinal accessory)", "b": "Rootlets from upper cervical cord that ascend through the foramen magnum", "why": "The spinal accessory nucleus lies in the C1–C5 ventral horn. Its rootlets climb into the skull and then exit through the jugular foramen with IX and X."}]}, {"id": "s07", "lec": "05", "lo": "05.1", "kind": "term-app", "title": "Bedside sensory test → receptor, fiber & pathway", "left": "Bedside test", "right": "Receptor → fiber → pathway tested", "pairs": [{"a": "128-Hz tuning fork on the great toe", "b": "Pacinian corpuscles → Aβ fibers → dorsal column–medial lemniscus", "why": "Pacinian corpuscles adapt rapidly and fire best to vibration. Vibration is lost early in B12 deficiency and diabetic neuropathy.", "hy": true}, {"a": "Two-point discrimination on a fingertip", "b": "Dense Merkel/Meissner endings → Aβ fibers → dorsal column–medial lemniscus", "why": "Fingertips have small receptive fields and large cortical areas on the homunculus, so two points are told apart at a few mm."}, {"a": "Sharp pinprick on the forearm", "b": "Free nerve endings → Aδ fibers → anterolateral (spinothalamic) system", "why": "Sharp, well-localized 'first pain' travels on thinly myelinated Aδ fibers in the ALS, not the DCML. In the ladder-fall case, pinprick and touch were split between the two legs.", "hy": true}, {"a": "Warm test tube on the shin", "b": "Free nerve endings → C fibers → anterolateral (spinothalamic) system", "why": "Warmth and slow burning pain travel on unmyelinated C fibers, the slowest class."}, {"a": "Great toe moved up or down with eyes closed", "b": "Muscle spindles/joint receptors → Ia/II fibers → dorsal column–medial lemniscus", "why": "Conscious proprioception travels with touch in the DCML. Losing it causes a positive Romberg sign and a stomping sensory-ataxic gait.", "hy": true}, {"a": "Skin stretched as a finger joint flexes", "b": "Ruffini endings → Aβ fibers → dorsal column–medial lemniscus", "why": "Ruffini endings are slowly adapting stretch receptors aligned with dermal collagen. They signal skin stretch and help sense finger position."}]}, {"id": "s08", "lec": "05", "lo": "05.3", "kind": "image-finding", "title": "Stained cross section → location of DCML & trigeminal structures", "left": "Structure", "right": "Location on a myelin-stained section", "pairs": [{"a": "Fasciculus gracilis", "b": "Medial dorsal column, between the posterior median and intermediate sulci", "why": "Gracilis carries the lower body (T7 and below). Axons enter in order (sacral, lumbar, thoracic, cervical), so sacral fibers lie most medially.", "hy": true}, {"a": "Fasciculus cuneatus", "b": "Lateral dorsal column, present only at T6 and above (upper thoracic and cervical)", "why": "Cuneatus (upper body) lies lateral to the posterior intermediate sulcus. Seeing it on a section rules out lumbar and sacral levels.", "hy": true}, {"a": "Nucleus gracilis", "b": "Dorsomedial closed medulla, beneath the gracile tubercle", "why": "First-order DCML axons from the lower body synapse ipsilaterally here, in the caudal (closed) medulla."}, {"a": "Nucleus cuneatus", "b": "Dorsolateral closed medulla, beneath the cuneate tubercle", "why": "Upper-body first-order axons synapse here, lateral to nucleus gracilis. The 2nd-order axons leave as internal arcuate fibers."}, {"a": "Internal arcuate fibers", "b": "Arcs sweeping ventromedially to cross the midline of the caudal medulla", "why": "This is where the DCML decussates. The fibers cross just rostral to the pyramidal (motor) decussation.", "hy": true}, {"a": "Medial lemniscus in the medulla", "b": "Vertical paramedian band lying directly dorsal to the pyramids", "why": "In the medulla the lemniscus stands vertically beside the midline. This puts it in the medial medullary (ASA) territory with the pyramid and XII."}, {"a": "Medial lemniscus in the pons", "b": "Horizontal band at the junction of the basis pontis and tegmentum", "why": "The lemniscus rotates to lie horizontally in the pons and moves laterally as it ascends toward the VPL."}, {"a": "Principal sensory nucleus of V", "b": "Lateral mid-pontine tegmentum, just lateral to the trigeminal motor nucleus", "why": "This nucleus is the face's version of nucleus gracilis/cuneatus. It is alar-plate (lateral) and sits next to motor V, which is basal-plate (medial)."}]}, {"id": "s09", "lec": "05", "lo": "05.2", "kind": "lesion-deficit", "title": "Lesion along the touch pathway → deficit", "left": "Lesion (right side unless stated)", "right": "Deficit", "pairs": [{"a": "Right fasciculus gracilis at T8", "b": "Right leg and lower trunk: ↓ vibration and position sense", "why": "First-order DCML axons ascend uncrossed, so a cord lesion causes loss on the same side at and below the level.", "hy": true}, {"a": "Right nucleus cuneatus", "b": "Right arm and upper trunk: ↓ vibration and position sense", "why": "The DCML has not crossed yet at the nucleus cuneatus. Loss is ipsilateral and limited to the upper body."}, {"a": "Right dorsal columns at C3", "b": "Right arm, trunk and leg: ↓ vibration and position sense", "why": "A high cervical lesion takes out both gracilis and cuneatus. All loss is still ipsilateral because nothing has crossed yet."}, {"a": "Right medial lemniscus in the medulla", "b": "Left arm, trunk and leg: ↓ vibration and position sense only", "why": "After the internal arcuate fibers cross, deficits become contralateral. Pain and temperature are spared because the ALS runs separately.", "hy": true}, {"a": "Right VPL nucleus of the thalamus", "b": "Left arm, trunk and leg: ↓ touch plus pain and temperature", "why": "Both the DCML and the ALS end in the VPL, so a thalamic lesion removes all modalities from the opposite body while sparing the face."}, {"a": "Right VPM nucleus of the thalamus", "b": "Left face: ↓ touch and pain/temperature sensation", "why": "VPM is the face relay ('M for Mouth'). The trigeminothalamic tracts reaching it have mainly crossed, so the deficit is contralateral."}, {"a": "Right principal sensory nucleus of V", "b": "Right face: ↓ fine touch, vibration and two-point sense", "why": "Face touch afferents synapse before they cross, so the loss is ipsilateral. Loss of the crossed VTTT alone is offset by the DTTT."}, {"a": "Midline lesion of the internal arcuate fibers", "b": "Both sides of the body: ↓ vibration and position sense", "why": "Fibers from both sides cross at the caudal medullary midline. A midline lesion there interrupts both pathways."}]}, {"id": "s10", "lec": "05", "lo": "05.4", "kind": "structure-function", "title": "Artery → territory supplied", "left": "Artery", "right": "Territory supplied", "pairs": [{"a": "Anterior spinal artery (cord)", "b": "Anterior 2/3 of cord: ventral horns, corticospinal and spinothalamic tracts", "why": "An ASA infarct spares the dorsal columns. Expect bilateral weakness and pain/temperature loss with vibration and proprioception intact.", "hy": true}, {"a": "Posterior spinal arteries", "b": "Posterior 1/3 of cord: dorsal columns and dorsal horns", "why": "The two posterior spinal arteries supply the DCML in the cord. Occlusion gives ipsilateral vibration and position loss with strength preserved."}, {"a": "Artery of Adamkiewicz", "b": "Main radicular feeder of the anterior spinal artery to the lower cord", "why": "This artery usually arises at T9–T12 on the left. Injury during aortic surgery causes an anterior cord syndrome in the lower body.", "hy": true}, {"a": "Anterior spinal artery branches (medulla)", "b": "Medial medulla: pyramid, medial lemniscus and hypoglossal nucleus", "why": "In medial medullary syndrome, the 3 'M's run near the midline: Motor (pyramid), Medial lemniscus and Medial hypoglossal. The tongue deviates toward the lesion.", "hy": true}, {"a": "PICA", "b": "Lateral medulla: spinal V, spinothalamic tract and nucleus ambiguus", "why": "In Wallenberg syndrome the medial lemniscus is spared. Dysphagia and hoarseness from nucleus ambiguus point to PICA.", "hy": true}, {"a": "Paramedian basilar branches", "b": "Medial pons: corticospinal fibers, medial lemniscus and abducens fibers", "why": "Medial pontine infarcts cause contralateral hemiparesis and touch loss, plus an ipsilateral lateral rectus palsy."}, {"a": "AICA", "b": "Lateral caudal pons: facial nucleus, vestibular and cochlear nuclei", "why": "Facial paralysis and hearing loss point to AICA (lateral pons), not PICA. The facial nucleus and cochlear nuclei are the discriminating structures."}, {"a": "PCA paramedian branches", "b": "Medial midbrain: cerebral peduncle and oculomotor nerve fibers", "why": "Weber syndrome is an ipsilateral CN III palsy with contralateral hemiparesis. The medial lemniscus sits more laterally in the midbrain and is usually spared."}]}, {"id": "s11", "lec": "05", "lo": "05.5", "kind": "structure-function", "title": "Taste & solitary nucleus → role", "left": "Structure", "right": "Role", "pairs": [{"a": "Chorda tympani (CN VII)", "b": "Carries taste from the anterior two-thirds of the tongue", "why": "Taste from the anterior 2/3 travels with VII through the chorda tympani, while general sensation from the same area travels in V3. A Bell palsy proximal to the chorda causes taste loss.", "hy": true}, {"a": "Glossopharyngeal nerve (CN IX)", "b": "Carries taste from the posterior one-third of the tongue", "why": "IX carries both taste and general sensation from the posterior 1/3, plus the gag reflex afferent limb.", "hy": true}, {"a": "Vagus nerve (CN X)", "b": "Carries minor taste input from the epiglottis and soft palate region", "why": "X has only a minor role in taste. Its fibers still end in the same rostral solitary nucleus."}, {"a": "Rostral solitary nucleus", "b": "Receives all gustatory fibers as the second-order taste nucleus", "why": "The rostral solitary nucleus is the gustatory nucleus. Fibers from VII, IX and X reach it through the solitary tract.", "hy": true}, {"a": "Middle (medial) solitary nucleus", "b": "Receives respiratory and baroreceptor afferent input", "why": "Carotid sinus (IX) and aortic (X) baroreceptor input lands here and drives the baroreflex."}, {"a": "Caudal solitary nucleus", "b": "Receives general visceral input from thoracic and abdominal organs", "why": "The solitary nucleus is organized rostral to caudal: taste, then cardiorespiratory, then visceral (GI)."}, {"a": "VPM nucleus of the thalamus", "b": "Third-order relay that sends taste signals on to the cortex", "why": "Taste reaches the VPM, the same nucleus that relays face touch. VPM lesions can therefore affect both."}, {"a": "Gustatory cortex (insula/frontal operculum)", "b": "Produces conscious perception and identification of taste", "why": "Third-order taste neurons project from the VPM to the insula and frontal operculum, next to the face area of S1."}]}, {"id": "s12", "lec": "05", "lo": "05.2", "kind": "structure-function", "title": "Thalamic relay nucleus → modality", "left": "Thalamic nucleus", "right": "What it relays", "pairs": [{"a": "VPL (ventral posterolateral)", "b": "Touch, proprioception, pain and temperature from the body", "why": "The VPL is the 3rd-order cell body for the DCML (and ALS). Its axons travel through the posterior limb of the internal capsule to S1.", "hy": true}, {"a": "VPM (ventral posteromedial)", "b": "Touch, pain and temperature from the face, plus taste", "why": "'VPM = Makeup': VPM handles the face, and taste from the solitary nucleus also arrives here.", "hy": true}, {"a": "LGN (lateral geniculate nucleus)", "b": "Vision from the retina to the primary visual cortex", "why": "'Lateral = Light.' The LGN receives the optic tract and projects through the optic radiations to the calcarine cortex."}, {"a": "MGN (medial geniculate nucleus)", "b": "Hearing from the inferior colliculus to the auditory cortex", "why": "'Medial = Music.' The inferior colliculus projects to the MGN through the brachium of the inferior colliculus."}, {"a": "VL (ventral lateral)", "b": "Cerebellar and basal ganglia output to the motor cortex", "why": "VL is a motor relay, not a sensory one. Its cerebellar-receiving part (VIM) is the thalamic DBS target for essential tremor."}, {"a": "No thalamic nucleus (olfactory tract)", "b": "Smell, sent directly to the olfactory (piriform) cortex", "why": "Every sensory system except olfaction relays through the thalamus before reaching the cortex."}]}], "seqs": [{"id": "q01", "lec": "05", "lo": "05.2", "title": "DCML relay: fingertip to cortex", "prompt": "Put the dorsal column–medial lemniscus relay for vibration on the right index finger in order (first → last).", "steps": ["Pacinian corpuscle depolarizes an Aβ fiber (cell body in the DRG)", "Axon enters via the medial division of the dorsal root", "Ascends ipsilaterally in the fasciculus cuneatus", "Synapses on 2nd-order neurons in the nucleus cuneatus (caudal medulla)", "2nd-order axons cross the midline as internal arcuate fibers", "Ascends in the contralateral medial lemniscus to the VPL nucleus", "3rd-order axons pass through the internal capsule to S1 (postcentral gyrus)"], "why": "This is a 3-neuron relay: DRG, then nucleus gracilis/cuneatus, then VPL. Crossing happens at the internal arcuate fibers, so a lesion below that point gives ipsilateral loss and a lesion above it gives contralateral loss.", "hy": true}, {"id": "q02", "lec": "05", "lo": "05.2", "title": "Face touch: principal sensory trigeminal pathway", "prompt": "Order the relay for light touch on the left cheek reaching the cortex (first → last).", "steps": ["Aβ afferent in CN V with its cell body in the trigeminal ganglion", "Root enters the brainstem at the lateral mid-pons", "Synapses in the principal sensory nucleus of V (mid-pons)", "Most 2nd-order axons cross and ascend in the VTTT", "Synapse in the contralateral VPM nucleus of the thalamus", "3rd-order axons reach the face area of the lateral postcentral gyrus"], "why": "This is the face's version of the DCML: the principal sensory nucleus replaces gracilis/cuneatus and the VPM replaces the VPL. The synapse comes before crossing, so a nucleus lesion gives ipsilateral face loss; the uncrossed DTTT backs up the VTTT.", "hy": false}, {"id": "q03", "lec": "05", "lo": "05.5", "title": "Taste from tongue tip to cortex", "prompt": "Order the pathway for sweet taste on the tip of the tongue (first → last).", "steps": ["Taste receptor cells in a fungiform taste bud are activated", "Chorda tympani (CN VII) afferent, cell body in the geniculate ganglion", "Central axon descends in the solitary tract", "Synapse in the rostral (gustatory) solitary nucleus", "2nd-order axons ascend ipsilaterally to the VPM nucleus", "3rd-order axons project to the gustatory cortex (insula/operculum)"], "why": "Taste fibers in VII, IX and X all converge on the rostral solitary nucleus. Unlike touch, the taste pathway mostly ascends ipsilaterally. Remember the solitary nucleus order: rostral taste, middle cardiorespiratory, caudal visceral.", "hy": true}, {"id": "q04", "lec": "04", "lo": "04.4", "title": "Tetanus: wound to spastic paralysis", "prompt": "Put the pathogenesis of generalized tetanus in order (first → last).", "steps": ["C. tetani spores germinate in an anaerobic puncture wound", "Tetanospasmin is taken up at lower motor neuron terminals", "Toxin travels by retrograde axonal transport to the spinal cord", "Toxin enters Renshaw cells and other inhibitory interneurons", "Synaptobrevin is cleaved, blocking glycine and GABA release", "α motor neurons fire unchecked: trismus, risus sardonicus, opisthotonos"], "why": "Normally Renshaw cells give glycinergic feedback that stops α motor neurons from firing continuously. Tetanus toxin removes that brake, while botulinum toxin acts at the NMJ and causes flaccid paralysis. Vaccination has cut global deaths dramatically.", "hy": true}, {"id": "q05", "lec": "04", "lo": "04.1", "title": "Cord ascent relative to the vertebral canal", "prompt": "Order the developmental change in the cord–vertebral canal relationship (earliest → adult).", "steps": ["Early fetal: cord fills the whole canal; each segment sits at its own vertebra", "Vertebral column and dura grow faster than the cord", "At birth the conus medullaris lies near the L3 vertebra", "In adults the conus sits at L1–L2 with long roots forming the cauda equina"], "why": "Uneven growth makes the cord 'ascend' within the canal and the roots run increasingly obliquely to their foramina. A tap is done at L3–L4 or L4–L5 in adults; in infants (conus near L3) it should be no higher than L4–L5.", "hy": false}], "grids": [{"id": "g01", "lec": "04", "lo": "04.2", "title": "Spinal cord level → cross-section features", "blurb": "Use the clinical segment clue to name the cord region, then predict how its cross section looks.", "cols": [{"h": "Segment clue"}, {"h": "Cord region", "dep": 0}, {"h": "Ventral horn", "dep": 1}, {"h": "Lateral horn", "dep": 1}, {"h": "White matter", "dep": 1}], "rows": [["Biceps reflex segment (C5–C6)", "Cervical", "Large (upper limb)", "Absent", "Most; oval section"], ["Nipple dermatome segment (T4)", "Thoracic", "Small and slender", "Present: IML sympathetic", "Moderate; small grey"], ["Patellar reflex segment (L4)", "Lumbar", "Large (lower limb)", "Absent", "Less; round section"], ["Bladder parasympathetics (S2–S4)", "Sacral", "Stout horns in a small section", "No horn; parasympathetic cells", "Least; mostly grey"]], "easyGiven": [1], "hardGiven": [0], "decoys": {"0": ["Phrenic nerve origin (C3–C5)", "Cremasteric reflex (L1–L2)"], "1": ["Coccygeal", "Medullary"], "2": ["Absent (no motor neurons)", "Large (trunk muscles)"], "3": ["Present: S2–S4 sympathetic", "Present: GSE motor neurons"], "4": ["Least; mostly white", "Most; round section"]}, "notes": ["Cervical: big ventral horns for the arm, both gracilis and cuneatus, and the most white matter, since every ascending and descending tract is present.", "Thoracic: slender ventral horns (trunk only) plus a pointed lateral horn, the IML, which holds T1–L2/3 sympathetic preganglionic neurons.", "Lumbar: big ventral horns for the leg, no cuneatus, and less white matter. White matter shrinks as you go caudally.", "Sacral: a small cord that is mostly grey with a thin white rim. S2–S4 parasympathetic preganglionic neurons sit in the lateral grey."], "hy": "To identify a section: lots of white matter and big horns = cervical. Lateral horn = thoracic (T1–L2). Big horns with less white = lumbar. Mostly grey = sacral. The cuneatus appears only at T6 and above."}, {"id": "g02", "lec": "04", "lo": "04.5", "title": "Brainstem section → level, nuclei & CSF space", "blurb": "Read the landmark on a stained brainstem section, name the level, then its cranial nerve nuclei and CSF space.", "cols": [{"h": "Section landmark"}, {"h": "Level", "dep": 0}, {"h": "CN nuclei at level", "dep": 1}, {"h": "CSF space", "dep": 1}], "rows": [["Superior colliculus + red nucleus", "Rostral midbrain", "III and Edinger–Westphal", "Cerebral aqueduct"], ["Inferior colliculus", "Caudal midbrain", "IV (trochlear)", "Cerebral aqueduct"], ["Middle cerebellar peduncle, V root", "Mid pons", "V: principal sensory + motor", "Fourth ventricle"], ["Facial colliculus on ventricle floor", "Caudal pons", "VI and VII", "Fourth ventricle"], ["Olives with ventricle open dorsally", "Open (rostral) medulla", "IX, X, XII, solitary nucleus", "Fourth ventricle"], ["Gracile/cuneate tubercles, decussations", "Closed (caudal) medulla", "XII (caudal), spinal V", "Central canal"]], "easyGiven": [1], "hardGiven": [0], "decoys": {"0": ["Mammillary bodies", "Pineal gland dorsally"], "1": ["Diencephalon", "Upper cervical cord"], "2": ["II (optic)", "VIII only", "XI only"], "3": ["Third ventricle", "Lateral ventricle"]}, "notes": ["Rostral midbrain: superior colliculi dorsally, red nucleus centrally and cerebral peduncles ventrally. CN III nuclei lie near the aqueduct.", "Caudal midbrain: inferior colliculi (auditory). The trochlear nucleus is here, and CN IV exits dorsally just below the colliculus.", "Mid pons: the bulky basis pontis and middle cerebellar peduncle. The principal sensory and motor nuclei of V sit laterally in the tegmentum.", "Caudal pons: abducens nucleus under the facial colliculus, wrapped by the internal genu of VII.", "Open medulla: olives ventrolaterally and the 4th ventricle open above. Holds nucleus ambiguus, the solitary nucleus and dorsal X/XII.", "Closed medulla: the central canal is still enclosed. Nucleus gracilis/cuneatus sit dorsally, with the internal arcuate and pyramidal decussations."], "hy": "Open vs closed medulla depends on whether the 4th ventricle roofs it (open) or a central canal is still enclosed (closed). Midbrain sections have the aqueduct, and a facial colliculus means caudal pons."}, {"id": "g03", "lec": "04", "lo": "04.6", "title": "Brainstem nucleus → functional column & plate", "blurb": "Classify each nucleus by functional column, the embryonic plate it comes from, and its cranial nerve(s).", "cols": [{"h": "Nucleus"}, {"h": "Functional column", "dep": 0}, {"h": "Embryonic plate", "dep": 1}, {"h": "Cranial nerve(s)", "dep": 0}], "rows": [["Hypoglossal nucleus", "GSE", "Basal plate (medial)", "XII"], ["Edinger–Westphal nucleus", "GVE", "Basal plate (medial)", "III"], ["Nucleus ambiguus", "SVE", "Basal plate (medial)", "IX, X"], ["Principal sensory nucleus of V", "GSA", "Alar plate (lateral)", "V"], ["Caudal solitary nucleus", "GVA", "Alar plate (lateral)", "IX, X (visceral)"], ["Rostral solitary nucleus", "SVA", "Alar plate (lateral)", "VII, IX, X"], ["Vestibular nuclei", "SSA", "Alar plate (lateral)", "VIII"]], "easyGiven": [0], "hardGiven": [0], "decoys": {"1": ["SSE", "GVS"], "2": ["Roof plate (dorsal)", "Floor plate (ventral)", "Neural crest"], "3": ["VI", "IV", "II"]}, "notes": ["GSE is the most medial motor column. XII lies just beside the midline under the hypoglossal trigone.", "GVE is parasympathetic preganglionic. Edinger–Westphal drives pupillary constriction and accommodation through III.", "SVE (branchial motor) supplies pharynx and larynx muscles through IX and X. It is basal-plate even though it migrates ventrolaterally.", "GSA covers general sensation from the face. The principal sensory nucleus handles touch and is alar-plate, lateral to the sulcus limitans.", "GVA is visceral afferent from IX (carotid) and X (thoracoabdominal) to the caudal and middle solitary nucleus.", "SVA is taste from VII, IX and X to the rostral (gustatory) solitary nucleus.", "SSA (hearing and balance) is the most lateral alar column in the brainstem, under the lateral floor of the 4th ventricle."], "hy": "Motor columns (GSE, GVE, SVE) come from the basal plate and lie medial. Sensory columns (GVA, SVA, GSA, SSA) come from the alar plate and lie lateral. The sulcus limitans divides them."}, {"id": "g04", "lec": "05", "lo": "05.4", "title": "Vascular syndrome localizer (hard chain)", "blurb": "Use the bedside finding to name the syndrome, then the artery, the structures hit, and what happens to body touch/vibration.", "cols": [{"h": "Bedside clue"}, {"h": "Syndrome", "dep": 0}, {"h": "Artery", "dep": 1}, {"h": "Key structures hit", "dep": 1}, {"h": "Body touch/vibration", "dep": 1}], "rows": [["Paraplegia + pain/temp loss; vibration OK", "Anterior cord syndrome", "Anterior spinal artery", "Corticospinal, ALS, ventral horns", "Preserved"], ["Vibration/position loss; strength intact", "Posterior cord infarct", "Posterior spinal arteries", "Dorsal columns", "Lost ipsilateral below lesion"], ["Contra hemiparesis; tongue toward lesion", "Medial medullary syndrome", "Anterior spinal artery", "Pyramid, medial lemniscus, XII", "Lost contralateral body"], ["Ipsi face + contra body pain loss; Horner", "Lateral medullary syndrome", "PICA", "Spinal V, ALS, nucleus ambiguus", "Preserved"], ["Contra hemiparesis; ipsi eye can't abduct", "Medial pontine syndrome", "Paramedian basilar branches", "Corticospinal, medial lemniscus, VI", "Lost contralateral body"], ["Ipsi down-and-out eye; contra weakness", "Weber syndrome", "PCA paramedian branches", "Cerebral peduncle, CN III fibers", "Preserved"]], "easyGiven": [1], "hardGiven": [0], "decoys": {"0": ["Cape-like bilateral pain/temp loss", "Ipsi hearing loss + facial palsy"], "1": ["Brown-Séquard syndrome", "Central cord syndrome"], "2": ["AICA", "Superior cerebellar artery"], "3": ["Spinocerebellar tracts only", "Vestibular nuclei, VIII"], "4": ["Lost ipsilateral face", "Lost bilaterally above lesion"]}, "notes": ["ASA infarct spares the posterior 1/3 of the cord, so dorsal columns stay intact. Motor and pain/temperature are lost bilaterally below the lesion.", "Posterior spinal artery occlusion knocks out the dorsal columns ipsilaterally because they have not crossed yet. Motor function is spared.", "Medial medulla: pyramid (contralateral weakness), medial lemniscus (contralateral touch loss) and XII (tongue licks toward the lesion).", "Wallenberg syndrome spares the medial lemniscus, so touch is normal. The crossed pain pattern plus nucleus ambiguus signs give it away.", "Medial pons: corticospinal and medial lemniscus give contralateral signs, while VI fibers cause an ipsilateral lateral rectus palsy.", "Weber: the CN III fascicle and cerebral peduncle are hit. The medial lemniscus lies more laterally in the midbrain and is usually spared."], "hy": "Medial brainstem syndromes hit the motor tracts, medial lemniscus and a midline CN (III, VI, XII). Lateral syndromes hit spinal V, ALS, sympathetics and lateral nuclei. Touch is lost only when the medial lemniscus or dorsal columns are in the territory."}, {"id": "g05", "lec": "05", "lo": "05.1", "title": "Receptor clue → modality, adaptation & fiber", "blurb": "Identify the receptor from its structure, then fill in what it senses, how it adapts and which afferent fiber carries it.", "cols": [{"h": "Structural clue"}, {"h": "Receptor", "dep": 0}, {"h": "Modality", "dep": 1}, {"h": "Adaptation", "dep": 1}, {"h": "Afferent fiber", "dep": 1}], "rows": [["Onion-like lamellae, deep dermis", "Pacinian corpuscle", "Vibration & deep pressure", "Rapid", "Aβ"], ["Dermal papillae of glabrous skin", "Meissner corpuscle", "Light touch & flutter", "Rapid", "Aβ"], ["Basal epidermis; serotonin-releasing cell", "Merkel disc", "Pressure & texture", "Slow", "Aβ"], ["Encapsulated, aligned with dermal collagen", "Ruffini ending", "Skin stretch", "Slow", "Aβ"], ["Unencapsulated terminals in epidermis", "Free nerve ending", "Pain & temperature", "Slow (non-adapting)", "Aδ and C"], ["Intrafusal fibers inside skeletal muscle", "Muscle spindle", "Muscle length & stretch", "Ia rate-sensitive; II static (slow)", "Ia and II"]], "easyGiven": [1], "hardGiven": [0], "decoys": {"0": ["Collagen bundles at myotendinous junction", "Plexus wrapped around hair follicles"], "1": ["Golgi tendon organ", "Hair follicle receptor"], "2": ["Muscle tension", "Itch only"], "3": ["Intermediate", "Rapid (Ib)"], "4": ["Ib", "B fibers", "Aγ"]}, "notes": ["Pacinian corpuscles have onion-skin layers that filter out sustained pressure, so they respond only to change. They are best at vibration (~250 Hz) and adapt rapidly.", "Meissner corpuscles sit in the dermal papillae of fingertips and lips. They adapt rapidly and sense light touch and flutter, giving fine spatial detail.", "Merkel cell–neurite complexes release serotonin onto the afferent. They adapt slowly and signal sustained pressure and texture, such as reading Braille.", "Ruffini endings adapt slowly. They sense skin stretch along collagen and help judge finger position and grip.", "Free nerve endings are unencapsulated nociceptors and thermoreceptors. Aδ carries fast sharp pain and cold; C carries slow burning pain and warmth. They travel in the ALS, not the DCML.", "Muscle spindles sense length: Ia endings signal rate of stretch as well as length, II endings signal static length. Conscious proprioception travels in the DCML."], "hy": "The four skin mechanoreceptors (Pacinian, Meissner, Merkel, Ruffini) use Aβ fibers and the DCML. Free nerve endings use Aδ/C fibers and the ALS. Vibration = Pacinian, texture = Merkel, flutter = Meissner, stretch = Ruffini."}, {"id": "g06", "lec": "05", "lo": "05.2", "title": "Stimulus → neuron relay map (body, face, taste)", "blurb": "From the stimulus, place the 1st-order cell body and 2nd-order nucleus, then where the pathway crosses and its thalamic relay.", "cols": [{"h": "Stimulus"}, {"h": "1st-order cell body", "dep": 0}, {"h": "2nd-order nucleus", "dep": 0}, {"h": "Where it crosses", "dep": 2}, {"h": "Thalamic relay", "dep": 2}], "rows": [["Vibration at the great toe", "DRG (lumbosacral)", "Nucleus gracilis", "Internal arcuate fibers", "VPL"], ["Two-point discrimination, index finger", "DRG (cervical)", "Nucleus cuneatus", "Internal arcuate fibers", "VPL"], ["Light touch on the cheek", "Trigeminal ganglion", "Principal sensory nucleus of V", "Pons, via the VTTT", "VPM"], ["Sweet taste, tip of tongue", "Geniculate ganglion (VII)", "Rostral solitary nucleus", "Does not cross (ipsilateral)", "VPM"], ["Bitter taste, back of tongue", "Inferior ganglion of IX", "Rostral solitary nucleus", "Does not cross (ipsilateral)", "VPM"]], "easyGiven": [0], "hardGiven": [0], "decoys": {"1": ["Dorsal horn lamina I", "Mesencephalic nucleus of V"], "2": ["Clarke's nucleus", "Spinal trigeminal nucleus", "Caudal solitary nucleus"], "3": ["Anterior white commissure", "Pyramidal decussation"], "4": ["LGN", "MGN", "VL"]}, "notes": ["Lower-body DCML: DRG, then nucleus gracilis in the closed medulla, crossing in the internal arcuate fibers, then the medial lemniscus to the VPL.", "Upper-body DCML: the same relay through the fasciculus and nucleus cuneatus. Fingertips have the finest two-point discrimination.", "Face touch: trigeminal ganglion, then the principal sensory nucleus (pons), crossing in the VTTT to the VPM. The DTTT is a largely uncrossed backup.", "Anterior 2/3 taste: chorda tympani (VII, geniculate ganglion) to the rostral solitary nucleus, then ipsilaterally to the VPM and the insula/operculum.", "Posterior 1/3 taste: IX (inferior ganglion) to the same rostral solitary nucleus, then the VPM. Converging on one nucleus is a hallmark of taste."], "hy": "The anterior white commissure is where pain/temperature (ALS) crosses, not the DCML. The DCML crosses in the internal arcuate fibers of the medulla. Body relays in the VPL, face and taste in the VPM."}]};
const META = {"block": "Block 6 · CNS", "updated": "October 22, 2026", "rev": "1.0"};

<script>
(function(){
"use strict";

  "term-def":{l:"Term → Definition",c:"--k1"},

  "lesion-deficit":{l:"Lesion → Deficit",c:"--k5"},
  "drug-mech":{l:"Drug → Mechanism",c:"--k6"},
  "structure-function":{l:"Structure → Function",c:"--k7"},
  "image-finding":{l:"Image → Finding",c:"--k8"},

};

const lecOf=k=>DATA.lectures.find(l=>l.k===k)||{k,name:"",disc:"neuro"};

const lecLabel=k=>(DATA.prefix||"CNS")+k;

/* ---------- storage (per-viewer convenience only) ---------- */
const SKEY="hoyadocs-matchlab-"+DATA.id;
let S={items:{},grids:{},best:0,rounds:0};
try{const raw=localStorage.getItem(SKEY);if(raw)S=Object.assign(S,JSON.parse(raw));}catch(e){}

document.title=`${DATA.code} Match Lab · HoyaDocs`;

/* ---------- shared bits ---------- */

function bindSeg(root,name,cb){root.querySelectorAll(`[data-${name}]`).forEach(b=>b.onclick=()=>{F[name]=b.dataset[name];root.querySelectorAll(`[data-${name}]`).forEach(x=>x.setAttribute("aria-pressed",String(x===b)));cb&&cb();});}
function lecChips(){return `<div class="optrow"><span class="lab">Lectures</span><div class="chips">${DATA.lectures.map(l=>`<button type="button" class="chip" data-lec="${l.k}" aria-pressed="${F.lecs.has(l.k)}" style="--c:var(--${l.disc})"><i></i>${esc(lecLabel(l.k))} · ${esc(l.name)}</button>`).join("")}</div></div>`;}
function kindChips(){const present=[...new Set(ITEMS.map(i=>i.kind))];return `<div class="optrow"><span class="lab">Match types</span><div class="chips">${present.map(k=>`<button type="button" class="chip" data-kind="${k}" aria-pressed="${F.kinds.has(k)}" style="--c:var(${KIND[k].c})"><i></i>${KIND[k].l} <span class="n">${ITEMS.filter(i=>i.kind===k).length}</span></button>`).join("")}</div></div>`;}
function bindChips(root,cb){
  root.querySelectorAll("[data-lec]").forEach(b=>b.onclick=()=>{const k=b.dataset.lec;if(F.lecs.has(k)){if(F.lecs.size>1)F.lecs.delete(k);}else F.lecs.add(k);b.setAttribute("aria-pressed",String(F.lecs.has(k)));cb&&cb();});
  root.querySelectorAll("[data-kind]").forEach(b=>b.onclick=()=>{const k=b.dataset.kind;if(F.kinds.has(k)){const vis=[...F.kinds].filter(x=>ITEMS.some(i=>i.kind===x));if(vis.length>1)F.kinds.delete(k);}else F.kinds.add(k);b.setAttribute("aria-pressed",String(F.kinds.has(k)));cb&&cb();});
}
function stars(n){return `<span class="stars" aria-label="${n} of 3 stars">${[1,2,3].map(i=>i<=n?"★":'<span class="off">★</span>').join("")}</span>`;}

/* ---------- RAPID FIRE: play ---------- */
let RF=null, timerId=null;
function stopTimer(){if(timerId){cancelAnimationFrame(timerId);timerId=null;}}
function startRF(){
  let p=shuffle(pool());
  // interleave so the same set doesn't come back to back
  const out=[];while(p.length){let i=p.findIndex(x=>!out.length||sid(x)!==sid(out[out.length-1]));if(i<0)i=0;out.push(p.splice(i,1)[0]);}
  const n=F.len==="all"?out.length:Math.min(out.length,+F.len);
  RF={q:out.slice(0,n).map(it=>({it,retry:false})),i:0,score:0,streak:0,best:0,first:0,firstOk:0,misses:[],answered:false};
  go("rfplay");
}
const sid=it=>it.t==="pair"?it.set.id:it.q.id;
function topBar(){
  const tot=RF.q.length;
  return `<div class="rf-top">
    <div class="statrow">
      <div class="stat"><b>${Math.min(RF.i+1,tot)}/${tot}</b><span>Card</span></div>
      <div class="stat"><b>${RF.score}</b><span>Score</span></div>
      <div class="stat"><b>${RF.streak}</b><span>Streak</span></div>
      <div class="stat"><b>${RF.first?Math.round(100*RF.firstOk/RF.first)+"%":"—"}</b><span>First-try accuracy</span></div>
    </div>
    <button class="btn sm" type="button" id="quitRF">End round</button>
  </div>
  <div class="bar"><i style="width:${100*RF.i/tot}%;background:var(--accent)"></i></div>`;
}
function renderQ(){
  if(RF.i>=RF.q.length){go("rfend");return;}
  const cur=RF.q[RF.i]; RF.answered=false;
  if(cur.it.t==="seq")return renderSeq(cur);
  const it=cur.it,s=it.set,p=it.p;
  if(cur.rev===undefined)cur.rev=F.dir==="mixed"&&Math.random()<.3;
  if(!cur.opts){
    const others=shuffle(s.pairs.filter((_,j)=>j!==it.i)).slice(0,3);
    cur.opts=shuffle([p,...others]);
  }
  const K=KIND[s.kind]||KIND["term-def"];
  const promptLab=cur.rev?s.right:s.left, ansLab=cur.rev?s.left:s.right;
  $("#app").innerHTML=`${topBar()}
  <section class="qcard panel">
    <div class="qhead"><span class="kind" style="--kc:var(${K.c})">${cur.rev?esc(K.l.split(" → ").reverse().join(" → ")):K.l}</span>${lecTag(it.lec)}<span class="qset">${esc(s.title)}</span>${cur.retry?'<span class="hy" style="background:var(--once-bg);border-color:var(--once);color:var(--ink)">Retry</span>':""}</div>
    ${F.timer!=="off"?'<div class="timer" aria-hidden="true"><i id="tbar"></i></div>':""}
    <div><div class="prompt-lab">${esc(promptLab)}</div><p class="prompt">${esc(cur.rev?p.b:p.a)}</p></div>
    <p class="ask">Pick the matching ${esc(ansLab.toLowerCase())}.</p>
    <div class="options" role="group" aria-label="Answer choices">
      ${cur.opts.map((o,k)=>`<button type="button" class="opt" data-k="${k}"><span class="key">${k+1}</span><span>${esc(cur.rev?o.a:o.b)}</span></button>`).join("")}
    </div>
    <div id="fbSlot"></div>
  </section>`;
  $("#quitRF").onclick=()=>go("rfend");
  document.querySelectorAll(".opt[data-k]").forEach(b=>b.onclick=()=>answer(+b.dataset.k));
  if(F.timer!=="off")runTimer(+F.timer,()=>answer(-1));
}
function runTimer(sec,onEnd){
  const t0=performance.now();
  const tick=now=>{const f=Math.max(0,1-(now-t0)/(sec*1000));const bar=$("#tbar");if(bar){bar.style.width=(f*100)+"%";bar.classList.toggle("low",f<.3);}RF.tleft=f;if(f<=0){timerId=null;onEnd();return;}timerId=requestAnimationFrame(tick);};
  timerId=requestAnimationFrame(tick);
}
function record(cur,ok){
  const st=itemStat(cur.it.key);st.n++;if(ok){st.ok++;st.run++;}else st.run=0;st.last=ok;
  if(!cur.retry){RF.first++;if(ok)RF.firstOk++;}
  if(ok){RF.streak++;RF.best=Math.max(RF.best,RF.streak);S.best=Math.max(S.best||0,RF.best);}else{RF.streak=0;}
  if(!ok){
    if(!RF.misses.includes(cur.it))RF.misses.push(cur.it);
    if(!cur.retry){const at=Math.min(RF.q.length,RF.i+3+Math.floor(Math.random()*3));RF.q.splice(at,0,{it:cur.it,retry:true});}
  }
  save();
}
function answer(k){
  if(RF.answered)return;RF.answered=true;stopTimer();
  const cur=RF.q[RF.i],it=cur.it,s=it.set,p=it.p;
  const chosen=k>=0?cur.opts[k]:null, ok=chosen===p;
  let pts=0;if(ok){pts=100+Math.min(50,RF.streak*10);if(F.timer!=="off")pts+=Math.round(50*(RF.tleft||0));}
  RF.score+=pts;record(cur,ok);
  document.querySelectorAll(".opt[data-k]").forEach(b=>{const o=cur.opts[+b.dataset.k];b.disabled=true;if(o===p)b.classList.add("correct");else if(o===chosen)b.classList.add("wrong");else b.classList.add("dim");});
  const ansTxt=cur.rev?p.a:p.b;
  let also="";
  if(chosen&&!ok)also=`<p class="also">You picked <b>${esc(cur.rev?chosen.a:chosen.b)}</b>, which matches <b>${esc(cur.rev?chosen.b:chosen.a)}</b>.</p>`;
  $("#fbSlot").innerHTML=`<div class="fb ${ok?"ok":"bad"}">
    <h3>${ok?`Correct · +${pts}`:k<0?"Time's up":"Not quite"}</h3>
    ${ok?"":`<p>Correct match: <b>${esc(ansTxt)}</b></p>`}
    ${p.why?`<p>${esc(p.why)}</p>`:""}
    ${also}
    ${p.hy?`<div class="hybox"><b>High yield · Step 1</b>${esc(p.a)} → ${esc(p.b)}</div>`:""}
    <div class="navrow"><span class="kbd">${ok?"":"This one comes back later in the round. "}Enter = next</span><button class="btn primary" id="nextQ" type="button">Next &rarr;</button></div>
  </div>`;
  $("#nextQ").onclick=next;$("#nextQ").focus({preventScroll:true});
  $("#fbSlot").scrollIntoView({block:"nearest",behavior:"smooth"});
}
function next(){RF.i++;renderQ();}
function renderSeq(cur){
  const q=cur.it.q;
  if(!cur.order){cur.order=shuffle(q.steps.map((_,i)=>i));if(cur.order.every((v,i)=>v===i)&&q.steps.length>1)cur.order.reverse();}
  cur.placed=0;cur.err=0;
  const draw=()=>{
    $("#app").innerHTML=`${topBar()}
    <section class="qcard panel">
      <div class="qhead"><span class="kind" style="--kc:var(${KIND.sequence.c})">${KIND.sequence.l}</span>${lecTag(q.lec)}<span class="qset">${esc(q.title)}</span>${cur.retry?'<span class="hy" style="background:var(--once-bg);border-color:var(--once);color:var(--ink)">Retry</span>':""}</div>
      ${F.timer!=="off"?'<div class="timer" aria-hidden="true"><i id="tbar"></i></div>':""}
      <p class="prompt">${esc(q.prompt)}</p>
      <ol class="seq-done">${q.steps.map((s,i)=>i<cur.placed?`<li>${esc(s)}</li>`:i===cur.placed?`<li class="slot">Tap step ${i+1}…</li>`:"").join("")}</ol>
      <div class="seq-pool" role="group" aria-label="Steps to place">${cur.order.filter(i=>i>=cur.placed).map(i=>`<button type="button" class="opt" data-s="${i}"><span>${esc(q.steps[i])}</span></button>`).join("")}</div>
      <div class="navrow"><span class="kbd">Mistakes: ${cur.err}</span><button class="btn sm" type="button" id="giveUp">Show order</button></div>
      <div id="fbSlot"></div>
    </section>`;
    $("#quitRF").onclick=()=>go("rfend");
    $("#giveUp").onclick=()=>{cur.err=Math.max(cur.err,3);cur.placed=q.steps.length;finishSeq(cur,true);};
    document.querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>{
      const i=+b.dataset.s;
      if(i===cur.placed){cur.placed++;if(cur.placed>=q.steps.length){finishSeq(cur);}else draw();}
      else{cur.err++;b.classList.remove("shake");void b.offsetWidth;b.classList.add("shake");$(".navrow .kbd").textContent="Mistakes: "+cur.err;}
    });
  };
  draw();
  if(F.timer!=="off")runTimer(+F.timer*2,()=>{cur.err=Math.max(cur.err,3);cur.placed=q.steps.length;finishSeq(cur,true);});
}
function finishSeq(cur,gaveUp){
  if(RF.answered)return;RF.answered=true;stopTimer();
  const q=cur.it.q, ok=!gaveUp&&cur.err===0;
  const pts=gaveUp?0:Math.max(0,100-25*cur.err)+(ok?Math.min(50,RF.streak*10):0);
  RF.score+=pts;record(cur,ok);
  $("#app").querySelector(".seq-done").innerHTML=q.steps.map(s=>`<li>${esc(s)}</li>`).join("");
  $("#app").querySelector(".seq-pool").innerHTML="";
  $("#giveUp").remove();
  $("#fbSlot").innerHTML=`<div class="fb ${ok?"ok":"bad"}">
    <h3>${ok?`Perfect order · +${pts}`:gaveUp?"Here's the order":`Done with ${cur.err} mistake${cur.err===1?"":"s"} · +${pts}`}</h3>
    ${q.why?`<p>${esc(q.why)}</p>`:""}
    ${q.hy?`<div class="hybox"><b>High yield · Step 1</b>${esc(q.title)}: know this order cold.</div>`:""}
    <div class="navrow"><span class="kbd">${ok?"":"This one comes back later in the round. "}Enter = next</span><button class="btn primary" id="nextQ" type="button">Next &rarr;</button></div>
  </div>`;
  $("#nextQ").onclick=next;$("#nextQ").focus({preventScroll:true});
}
document.addEventListener("keydown",e=>{
  if(view!=="rfplay"||e.metaKey||e.ctrlKey||e.altKey)return;
  if(/^[1-4]$/.test(e.key)&&!RF.answered){const b=$(`.opt[data-k="${+e.key-1}"]`);if(b){e.preventDefault();b.click();}}
  else if(e.key==="Enter"&&RF.answered&&document.activeElement&&document.activeElement.id!=="quitRF"){const n=$("#nextQ");if(n&&document.activeElement!==n){e.preventDefault();n.click();}}
});

/* ---------- GRID LOCK: play ---------- */
let G=null;
function startGrid(id){
  const g=DATA.grids.find(x=>x.id===id); if(!g){go("glist");return;}
  const hard=F.diff==="hard", given=new Set(hard?g.hardGiven:g.easyGiven);
  const cells=g.rows.map(r=>r.map((v,c)=>({v,given:given.has(c),filled:false})));
  if(!hard){ // reveal ~30% of the remaining cells, but leave at least 2 blanks per column
    g.cols.forEach((_,c)=>{if(given.has(c))return;const idx=shuffle(g.rows.map((_,r)=>r));const k=Math.min(Math.floor(g.rows.length*.3+Math.random()*.6),g.rows.length-2);idx.slice(0,Math.max(0,k)).forEach(r=>cells[r][c].given=true);});
  }
  const tileOrder={};g.cols.forEach((_,c)=>{tileOrder[c]=shuffle([...new Set(g.rows.map(r=>r[c])),...((g.decoys||{})[c]||[])]);});
  G={g,hard,cells,sel:null,mistakes:0,hints:0,t0:Date.now(),tried:{},tileOrder,doneRows:new Set(),done:false,msg:"",msgCls:""};
  g.rows.forEach((_,r)=>{if(rowDone(r))G.doneRows.add(r);});
  G.sel=nextOpen(-1);
  drawGrid();
}
const isOk=(r,c)=>G.cells[r][c].given||G.cells[r][c].filled;
const rowDone=r=>G.cells[r].every((_,c)=>isOk(r,c));
function locked(r,c){if(!G.hard)return false;const d=G.g.cols[c].dep;if(d===undefined||d===null)return false;return !isOk(r,d);}
function open(r,c){return !isOk(r,c)&&!locked(r,c);}
function nextOpen(from){const R=G.g.rows.length,C=G.g.cols.length,N=R*C;for(let k=1;k<=N;k++){const x=(from+k)%N,r=Math.floor(x/C),c=x%C;if(from<0&&k===N+1)break;if(open(r,c))return [r,c];}return null;}
function remaining(c){const m={};G.g.rows.forEach((row,r)=>{if(!isOk(r,c))m[row[c]]=(m[row[c]]||0)+1;});return m;}
function rowName(r){const g=G.g;const k=(G.hard?g.hardGiven:g.easyGiven)[0];return g.rows[r][k];}
function drawGrid(){
  const g=G.g,C=g.cols.length;
  const tot=g.rows.length*C, done=g.rows.reduce((a,_,r)=>a+g.cols.reduce((b,_,c)=>b+(isOk(r,c)?1:0),0),0);
  const givenCols=new Set(G.hard?g.hardGiven:g.easyGiven);
  const head=g.cols.map((col,c)=>{const clue=G.hard&&givenCols.has(c);const dep=col.dep;return `<th scope="col" class="${clue?"clue":""}">${esc(col.h)}${clue?"<small>Clue · given</small>":G.hard&&dep!=null?`<small>${LOCK.replace('aria-hidden','style="width:10px;height:10px;vertical-align:-1px" aria-hidden')} after ${esc(g.cols[dep].h)}</small>`:""}</th>`;}).join("");
  const body=g.rows.map((row,r)=>`<tr>${row.map((v,c)=>{
    const cl=G.cells[r][c];
    if(cl.given){const clue=G.hard&&givenCols.has(c);return `<td><div class="cell ${clue?"clue":"given"}">${esc(v)}</div></td>`;}
    if(cl.filled)return `<td><div class="cell filled${cl.pop?" pop":""}">${esc(v)}</div></td>`;
    if(locked(r,c))return `<td><button type="button" class="cell locked" disabled title="Solve ${esc(g.cols[g.cols[c].dep].h)} for this row first">${LOCK}<span>${esc(g.cols[g.cols[c].dep].h)} first</span></button></td>`;
    const sel=G.sel&&G.sel[0]===r&&G.sel[1]===c;
    return `<td><button type="button" class="cell empty${sel?" sel":""}${cl.err?" err":""}" data-r="${r}" data-c="${c}" aria-label="${esc(g.cols[c].h)}, row ${r+1}, empty">${sel?"Pick a tile":"—"}</button></td>`;
  }).join("")}</tr>`).join("");
  g.rows.forEach((_,r)=>g.cols.forEach((_,c)=>{G.cells[r][c].pop=false;G.cells[r][c].err=false;}));
  const elapsed=Math.round((Date.now()-G.t0)/1000);
  let bank="";
  if(!G.done){
    if(G.sel){
      const c=G.sel[1],rem=remaining(c),tried=G.tried[c]||new Set();
      const tiles=G.tileOrder[c].filter(v=>rem[v]||(!g.rows.some(rr=>rr[c]===v))).map(v=>{const dec=!g.rows.some(rr=>rr[c]===v);const out=dec&&tried.has(v);return `<button type="button" class="tile${out?" out":""}" ${out?"disabled":""} draggable="${!out}" data-v="${esc(v)}">${esc(v)}${rem[v]>1?`<span class="ct">×${rem[v]}</span>`:""}</button>`;}).join("");
      bank=`<div class="bank" id="bank"><div class="bh"><span>Tiles for <b>${esc(g.cols[c].h)}</b> · row ${G.sel[0]+1}${G.hard?"":` (${esc(rowName(G.sel[0]))})`}</span><span class="toast ${G.msgCls}" id="toast" role="status">${esc(G.msg)}</span></div><div class="tiles">${tiles}</div></div>`;
    } else bank=`<div class="bank"><span class="toast ${G.msgCls}" role="status">${esc(G.msg)||"Tap an empty cell to see its tiles."}</span></div>`;
  }
  const notes=[...G.doneRows].sort((a,b)=>a-b).filter(r=>g.notes&&g.notes[r]).map(r=>`<li><b>${esc(g.rows[r][g.easyGiven[0]])}:</b> ${esc(g.notes[r])}</li>`).join("");
  $("#app").innerHTML=`<section class="gwrap">
    <div class="rf-top">
      <div>${lecTag(g.lec)} <span class="qset">${G.hard?"Hard":"Easy"}</span><h2 style="margin-top:4px">${esc(g.title)}</h2><p class="ask">${esc(g.blurb)}</p></div>
      <div class="statrow"><div class="stat"><b>${done}/${tot}</b><span>Cells</span></div><div class="stat"><b>${G.mistakes}</b><span>Mistakes</span></div><div class="stat"><b>${G.hints}</b><span>Hints</span></div><div class="stat"><b id="clock">${fmt(elapsed)}</b><span>Time</span></div></div>
    </div>
    <div class="navrow"><button class="btn sm" type="button" id="gBack">&larr; All grids</button><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn sm" type="button" id="gHint" ${G.done?"disabled":""}>Hint (fill one cell)</button><button class="btn sm" type="button" id="gRestart">Restart</button><button class="btn sm" type="button" id="gSwap">Switch to ${G.hard?"Easy":"Hard"}</button></div></div>
    <div class="gtable-wrap"><table class="gt"><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>
    ${G.done?doneHTML():bank}
    ${notes&&!G.done?`<div><h3 style="font-size:1rem;margin-bottom:6px">Solved rows</h3><ul class="notes">${notes}</ul></div>`:""}
  </section>`;
  $("#gBack").onclick=()=>go("glist");
  $("#gRestart").onclick=()=>startGrid(g.id);
  $("#gSwap").onclick=()=>{F.diff=G.hard?"easy":"hard";startGrid(g.id);};
  $("#gHint").onclick=hint;
  document.querySelectorAll(".cell.empty").forEach(b=>{
    b.onclick=()=>{G.sel=[+b.dataset.r,+b.dataset.c];G.msg="";drawGrid();const t=$(".tile:not([disabled])");if(t)t.focus({preventScroll:true});const bk=$("#bank");if(bk)bk.scrollIntoView({block:"nearest",behavior:"smooth"});};
    b.ondragover=e=>{e.preventDefault();b.classList.add("drop");};
    b.ondragleave=()=>b.classList.remove("drop");
    b.ondrop=e=>{e.preventDefault();const v=e.dataTransfer.getData("text/plain");place(+b.dataset.r,+b.dataset.c,v);};
  });
  document.querySelectorAll(".tile[data-v]").forEach(t=>{
    t.onclick=()=>{if(G.sel)place(G.sel[0],G.sel[1],t.dataset.v);};
    t.ondragstart=e=>{e.dataTransfer.setData("text/plain",t.dataset.v);t.classList.add("dragging");};
    t.ondragend=()=>t.classList.remove("dragging");
  });
  const d=$("#gDone");if(d)d.onclick=()=>go("glist");
  const h=$("#gHard");if(h)h.onclick=()=>{F.diff="hard";startGrid(g.id);};
  const nx=$("#gNext");if(nx)nx.onclick=()=>{const L=DATA.grids;const i=L.indexOf(g);go("grid",L[(i+1)%L.length].id);};
  tickClock();
}
const fmt=s=>Math.floor(s/60)+":"+String(s%60).padStart(2,"0");
let clockT=null;
function tickClock(){clearTimeout(clockT);if(view!=="grid"||!G||G.done)return;clockT=setTimeout(()=>{const el=$("#clock");if(el)el.textContent=fmt(Math.round((Date.now()-G.t0)/1000));tickClock();},1000);}
function place(r,c,v){
  if(G.done||!open(r,c))return;
  const g=G.g;
  if(g.rows[r][c]===v){
    G.cells[r][c].filled=true;G.cells[r][c].pop=true;
    G.msg="Correct.";G.msgCls="ok";
    if(!G.doneRows.has(r)&&rowDone(r))G.doneRows.add(r);
    const C=g.cols.length;G.sel=nextOpen(r*C+c);
    if(!G.sel&&g.rows.every((_,rr)=>rowDone(rr)))finishGrid();
  } else {
    G.mistakes++;G.cells[r][c].err=true;G.msgCls="bad";
    const inCol=g.rows.some(rr=>rr[c]===v);
    if(inCol){G.msg=`“${v}” belongs in this column, but not this row.`;}
    else{(G.tried[c]=G.tried[c]||new Set()).add(v);G.msg=`“${v}” is a decoy. It isn't in this chart.`;}
    G.sel=[r,c];
  }
  drawGrid();
}
function hint(){
  if(G.done)return;let t=G.sel&&open(...G.sel)?G.sel:nextOpen(-1);if(!t)return;
  G.hints++;G.cells[t[0]][t[1]].filled=true;G.cells[t[0]][t[1]].pop=true;
  if(rowDone(t[0]))G.doneRows.add(t[0]);
  G.msg=`Hint: filled “${G.g.rows[t[0]][t[1]]}”.`;G.msgCls="";
  const C=G.g.cols.length;G.sel=nextOpen(t[0]*C+t[1]);
  if(!G.sel&&G.g.rows.every((_,rr)=>rowDone(rr)))finishGrid();
  drawGrid();
}
function finishGrid(){
  G.done=true;G.secs=Math.round((Date.now()-G.t0)/1000);
  const pen=G.mistakes+2*G.hints;G.stars=pen===0?3:pen<=2?2:1;
  const st=S.grids[G.g.id]||(S.grids[G.g.id]={});const k=G.hard?"hard":"easy";st[k]=Math.max(st[k]||0,G.stars);save();
}
function doneHTML(){
  const g=G.g;
  return `<section class="panel gdone">
    <div class="statrow" style="align-items:center"><h2>Grid solved</h2>${stars(G.stars)}<span class="ask">${fmt(G.secs)} · ${G.mistakes} mistake${G.mistakes===1?"":"s"} · ${G.hints} hint${G.hints===1?"":"s"}</span></div>
    ${g.hy?`<div class="hybox"><b>High yield · Step 1</b>${esc(g.hy)}</div>`:""}
    <ul class="notes">${g.rows.map((row,r)=>g.notes&&g.notes[r]?`<li><b>${esc(row[g.easyGiven[0]])}:</b> ${esc(g.notes[r])}</li>`:"").join("")}</ul>
    <div class="navrow"><button class="btn" type="button" id="gDone">All grids</button><div style="display:flex;gap:8px;flex-wrap:wrap">${G.hard?"":'<button class="btn" type="button" id="gHard">Try it on Hard</button>'}<button class="btn primary" type="button" id="gNext">Next grid &rarr;</button></div></div>
  </section>`;
}

go("home");
})();
</script>
</body>
</html>
