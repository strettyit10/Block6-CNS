<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CNS12 · CNS14 Match Lab · HoyaDocs</title>
<meta name="description" content="HoyaDocs CNS12 · CNS14 Match Lab: Pain Pathways &amp; Opioids. Rapid Fire matching and Grid Lock charts.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Graduate&family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600;700&display=swap">
<style>
/* HoyaDocs Match Lab engine v1.0
   Layout: header + mode tabs; Home (mode cards, filters, mastery), Rapid Fire (one match per card), Grid Lock (chart + tile bank).
   Colors are tokens on :root with a dark set. Every view stacks to one column on phones. */
:root{
  --bg:#EEF0F3; --surface:#FFFFFF; --sunk:#F5F7FA; --ink:#1A3363; --muted:#5B6274; --line:#D3D8E0; --chip:#E6E9EE;
  --navy:#0F2244; --navy2:#1A3363; --onnavy:#F4F1EA; --silver:#6E7787; --tan:#5AAEE6;
  --neuro:#5B4BC4; --path:#1F7F78; --drt:#C4631B; --pharm:#2368A8; --accent:#1D6FA8; --accent-ink:#ffffff;
  --ok:#1d7a3e; --ok-bg:#e3f4e8; --bad:#b3261e; --bad-bg:#fbe7e5; --once:#b7791f; --once-bg:#fdf1dc;
  --hy-bg:#FFF4C2; --hy-line:#D4A300; --hy-ink:#5E4700;
  --k1:#2c55a0; --k2:#6b46c1; --k3:#a02c4f; --k4:#b45309; --k5:#0f6b6b; --k6:#85600f; --k7:#1d7a3e; --k8:#0369a1;
  --given:#f5f7f9; --lock:#e9ecef; --clue-bg:#e3ecfa; --clue-ink:#1d3f7a; --clue-line:#9db6e3;
  --f-display:"Graduate","Rockwell","Georgia",serif; --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif; --f-mono:"Barlow Condensed","Arial Narrow",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#11161c; --surface:#19212a; --sunk:#141b22; --ink:#e6eaee; --muted:#9aa6b2; --line:#2c3642; --chip:#232c36;
  --neuro:#A99CF0; --path:#5CC2B8; --drt:#F0A060; --pharm:#7FB3EA; --navy:#0A1830; --navy2:#13284d; --onnavy:#F4F1EA; --silver:#9aa6b2; --tan:#5AAEE6; --accent:#8fb1f0; --accent-ink:#0d1520;
  --ok:#6fd08f; --ok-bg:#16301f; --bad:#f28b82; --bad-bg:#3a1b19; --once:#f0c070; --once-bg:#3a2e12;
  --hy-bg:#3a3110; --hy-line:#b8952a; --hy-ink:#f5e6a8;
  --k1:#8fb1f0; --k2:#b9a3f5; --k3:#f08aa5; --k4:#f5a65b; --k5:#5cc2c0; --k6:#e3bb63; --k7:#6fd08f; --k8:#7cc4f0;
  --given:#1d262f; --lock:#161d24; --clue-bg:#1c2b44; --clue-ink:#c4d6f7; --clue-line:#3b5687; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#11161c; --surface:#19212a; --sunk:#141b22; --ink:#e6eaee; --muted:#9aa6b2; --line:#2c3642; --chip:#232c36;
  --neuro:#A99CF0; --path:#5CC2B8; --drt:#F0A060; --pharm:#7FB3EA; --navy:#0A1830; --navy2:#13284d; --onnavy:#F4F1EA; --silver:#9aa6b2; --tan:#5AAEE6; --accent:#8fb1f0; --accent-ink:#0d1520;
  --ok:#6fd08f; --ok-bg:#16301f; --bad:#f28b82; --bad-bg:#3a1b19; --once:#f0c070; --once-bg:#3a2e12;
  --hy-bg:#3a3110; --hy-line:#b8952a; --hy-ink:#f5e6a8;
  --k1:#8fb1f0; --k2:#b9a3f5; --k3:#f08aa5; --k4:#f5a65b; --k5:#5cc2c0; --k6:#e3bb63; --k7:#6fd08f; --k8:#7cc4f0;
  --given:#1d262f; --lock:#161d24; --clue-bg:#1c2b44; --clue-ink:#c4d6f7; --clue-line:#3b5687; color-scheme:dark }
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font:15.5px/1.55 var(--f-body);margin:0}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px 56px;display:grid;gap:16px}
h1,h2,h3{margin:0;text-wrap:balance;line-height:1.2}
h1,h2{font-family:var(--f-display);font-weight:400;letter-spacing:.03em}
h3{font-family:var(--f-mono);font-weight:800;letter-spacing:.03em}
/* HoyaDocs CNS hub shell: wordmark bar, section nav, navy varsity hero */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:16px 0 0}
.word{font-family:var(--f-display);font-size:24px;letter-spacing:.04em;text-decoration:none;color:var(--ink);line-height:1}
.word span{color:var(--silver)}
.rev{font-family:var(--f-mono);font-weight:600;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.topr{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.themebtn{background:transparent;border:1.5px solid var(--line);border-radius:999px;font-family:var(--f-mono);font-weight:700;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);padding:5px 14px;cursor:pointer}
.themebtn:hover{color:var(--ink);border-color:var(--ink)}
.hubnav{display:flex;align-items:stretch;overflow-x:auto;scrollbar-width:none;border-top:3px solid var(--ink);border-bottom:1px solid var(--line)}
.hubnav::-webkit-scrollbar{display:none}
.hubnav a{flex:none;text-decoration:none;font-family:var(--f-mono);font-weight:700;font-size:15px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:11px 12px 9px;white-space:nowrap;border-bottom:3px solid transparent;margin-bottom:-1px;display:flex;align-items:center;gap:7px}
.hubnav a:hover{color:var(--ink)}
.hubnav a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--tan)}
.hubnav a i{width:9px;height:9px;border-radius:2px;flex:none}
.hubnav .sep{flex:none;width:1px;background:var(--line);margin:9px 6px}
header.hero{background:var(--navy);color:var(--onnavy);border-radius:14px;padding:clamp(20px,3.5vw,36px) clamp(20px,4vw,40px);position:relative;overflow:hidden}
header.hero::before{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(90deg, transparent 0 calc(10% - 1px), rgba(255,255,255,.045) calc(10% - 1px) 10%),radial-gradient(ellipse at 88% 115%, rgba(90,174,230,.34), transparent 58%)}
header.hero > *{position:relative}
.hero .k{font-family:var(--f-mono);font-weight:700;font-size:14px;letter-spacing:.22em;text-transform:uppercase;color:#8FCBF5}
.hero h1{font-family:var(--f-display);font-weight:400;font-size:clamp(28px,5.4vw,52px);line-height:1.02;letter-spacing:.02em;margin:10px 0 4px;color:#F4F1EA;text-shadow:2px 2px 0 #1A3363,4px 4px 0 #5AAEE6}
button{font:inherit;color:inherit}
a{color:var(--accent)}
.meta{font:500 .74rem var(--f-mono);letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin:0}
header.top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:end;gap:12px}
header.top h1{font-size:clamp(1.5rem,3.4vw,2rem)}
header.top .lede{margin:4px 0 0;color:var(--muted);max-width:66ch}
.back{font:600 .8rem var(--f-body);text-decoration:none;color:var(--muted)}
.back:hover{color:var(--ink)}
.hdr-actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{font:600 .86rem var(--f-body);background:var(--chip);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px 13px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;text-decoration:none}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn[disabled]{opacity:.45;cursor:default}
.btn.sm{padding:5px 10px;font-size:.8rem}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{font:700 .82rem var(--f-body);letter-spacing:.04em;text-transform:uppercase;background:none;border:0;border-bottom:3px solid transparent;padding:10px 12px 8px;color:var(--muted);cursor:pointer;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0}
.panel h2{font-size:1.15rem}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media (max-width:760px){.grid2{grid-template-columns:minmax(0,1fr)}}
.mode-card{display:grid;gap:10px;align-content:start}
.mode-card .k{font:500 .7rem var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.mode-card h2{font-size:1.45rem}
.mode-card p{margin:0;color:var(--muted)}
.opts{display:grid;gap:8px}
.optrow{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.optrow .lab{font:500 .7rem var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);min-width:76px}
.seg{display:inline-flex;background:var(--chip);border-radius:9px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{font:600 .8rem var(--f-body);border:0;background:transparent;padding:5px 10px;border-radius:7px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.14)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:600 .78rem var(--f-body);border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 10px;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--c,var(--muted));flex:none}
.chip[aria-pressed="false"]{opacity:.5;text-decoration:line-through;text-decoration-color:var(--muted)}
.chip .n{font:500 .7rem var(--f-mono);color:var(--muted)}
.statrow{display:flex;flex-wrap:wrap;gap:18px}
.stat b{display:block;font:700 1.25rem var(--f-body);font-variant-numeric:tabular-nums}
.stat span{font:500 .68rem var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.bar{height:6px;background:var(--chip);border-radius:3px;overflow:hidden}
.bar > i{display:block;height:100%;background:var(--ok);border-radius:3px;transition:width .3s}
.lecrow{display:grid;grid-template-columns:auto minmax(0,1fr) 120px auto;gap:4px 10px;align-items:center;padding:6px 0;border-top:1px solid var(--line);font-size:.88rem}
.lecrow:first-of-type{border-top:0}
.lecrow .pct{font:500 .75rem var(--f-mono);color:var(--muted);font-variant-numeric:tabular-nums;min-width:52px;text-align:right}
@media (max-width:560px){.lecrow{grid-template-columns:auto minmax(0,1fr) auto}.lecrow .bar{grid-column:1/-1;order:5}}
.tag{font:600 .68rem var(--f-mono);letter-spacing:.05em;text-transform:uppercase;border-radius:5px;padding:2px 6px;color:#fff;background:var(--lc,var(--neuro));white-space:nowrap}
:root[data-theme="dark"] .tag{color:#0d1520}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .tag{color:#0d1520} }
.hy{font:700 .66rem var(--f-mono);letter-spacing:.06em;background:var(--hy-bg);color:var(--hy-ink);border:1px solid var(--hy-line);border-radius:5px;padding:1px 6px}
.hybox{background:var(--hy-bg);border:1.5px solid var(--hy-line);color:var(--hy-ink);border-radius:10px;padding:10px 12px;font-size:.9rem}
.hybox b{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;display:block;margin-bottom:2px}
details.how{font-size:.9rem}
details.how summary{cursor:pointer;font-weight:700}
details.how ul{margin:8px 0 0;padding-left:18px;color:var(--muted)}
details.how li{margin:3px 0}

/* Rapid fire */
.rf-top{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between}
.timer{height:5px;background:var(--chip);border-radius:3px;overflow:hidden}
.timer i{display:block;height:100%;background:var(--accent);width:100%}
.timer i.low{background:var(--bad)}
.qcard{display:grid;gap:14px;max-width:820px;margin:0 auto;width:100%}
.qhead{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.kind{font:700 .72rem var(--f-body);letter-spacing:.04em;text-transform:uppercase;color:var(--kc);border:1.5px solid var(--kc);border-radius:6px;padding:2px 8px}
.qset{font-size:.82rem;color:var(--muted)}
.prompt-lab{font:500 .7rem var(--f-mono);letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.prompt{font:600 clamp(1.15rem,2.6vw,1.4rem)/1.35 var(--f-body);margin:2px 0 0}
.ask{font-size:.88rem;color:var(--muted);margin:0}
.options{display:grid;gap:8px}
.opt{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;align-items:start;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:11px 12px;cursor:pointer;font-size:.95rem;line-height:1.4}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt .key{font:500 .75rem var(--f-mono);color:var(--muted);border:1px solid var(--line);border-radius:6px;height:24px;display:grid;place-items:center}
.opt.correct{border-color:var(--ok);background:var(--ok-bg)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt[disabled]{cursor:default}
.opt.dim{opacity:.55}
.fb{border-radius:10px;padding:12px 14px;display:grid;gap:8px;font-size:.92rem}
.fb.ok{background:var(--ok-bg);border:1px solid var(--ok)}
.fb.bad{background:var(--bad-bg);border:1px solid var(--bad)}
.fb h3{font:800 1.05rem var(--f-mono);letter-spacing:.06em;text-transform:uppercase}
.fb p{margin:0}
.fb .also{font-size:.86rem;color:var(--muted)}
.fb .also b{color:var(--ink)}
.navrow{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center}
.kbd{font:500 .72rem var(--f-mono);color:var(--muted)}
/* sequence */
.seq-done{display:grid;gap:6px;counter-reset:s;padding:0;margin:0;list-style:none}
.seq-done li{counter-increment:s;display:grid;grid-template-columns:26px minmax(0,1fr);gap:8px;align-items:start;background:var(--ok-bg);border:1px solid var(--ok);border-radius:8px;padding:7px 10px;font-size:.92rem}
.seq-done li::before{content:counter(s);font:700 .8rem var(--f-mono);color:var(--ok);text-align:center}
.seq-done li.slot{background:transparent;border:1.5px dashed var(--line);color:var(--muted)}
.seq-done li.slot::before{color:var(--muted)}
.seq-pool{display:grid;gap:6px}
.seq-pool .opt{grid-template-columns:minmax(0,1fr)}
.shake{animation:shake .32s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@media (prefers-reduced-motion:reduce){.shake{animation:none}}
/* end */
.end{display:grid;gap:14px;max-width:820px;margin:0 auto;width:100%}
.big{font:700 clamp(2rem,6vw,3rem)/1 var(--f-display)}
.misslist{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.misslist li{border:1px solid var(--line);border-left:4px solid var(--bad);border-radius:8px;padding:8px 12px;font-size:.9rem;background:var(--surface)}
.misslist .a{font-weight:700}
.misslist .b{color:var(--muted)}

/* Grid list */
.glist{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.gcard{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;cursor:pointer;display:grid;gap:6px;align-content:start}
.gcard:hover{border-color:var(--accent)}
.gcard h3{font-size:1.02rem}
.gcard p{margin:0;font-size:.84rem;color:var(--muted)}
.gcard .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font:500 .72rem var(--f-mono);color:var(--muted)}
.stars{font-size:.85rem;letter-spacing:1px;color:var(--once)}
.stars .off{color:var(--line)}
/* Grid play */
.gwrap{display:grid;gap:12px}
.gtable-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table.gt{border-collapse:separate;border-spacing:0;width:100%;min-width:560px}
.gt th{font:700 .74rem var(--f-body);letter-spacing:.04em;text-transform:uppercase;text-align:left;padding:10px;border-bottom:1px solid var(--line);background:var(--sunk);vertical-align:bottom}
.gt th small{display:block;font:500 .66rem var(--f-mono);letter-spacing:.03em;text-transform:none;color:var(--muted);margin-top:2px}
.gt th.clue{background:var(--clue-bg);color:var(--clue-ink)}
.gt th.clue small{color:var(--clue-ink)}
.gt td{padding:5px;border-bottom:1px solid var(--line);vertical-align:top;min-width:120px}
.gt tr:last-child td{border-bottom:0}
.gt td + td,.gt th + th{border-left:1px solid var(--line)}
.cell{width:100%;min-height:44px;border-radius:8px;padding:7px 9px;font-size:.88rem;line-height:1.3;text-align:left;display:flex;align-items:center;gap:6px}
.cell.given{background:var(--given);font-weight:600}
.cell.clue{background:var(--clue-bg);color:var(--clue-ink);border:1px solid var(--clue-line);font-weight:600}
.cell.empty{border:1.5px dashed var(--line);background:transparent;cursor:pointer;color:var(--muted)}
.cell.empty:hover,.cell.empty.drop{border-color:var(--accent);color:var(--ink)}
.cell.sel{border:2px solid var(--accent);background:color-mix(in srgb,var(--accent) 10%,transparent);color:var(--ink)}
.cell.locked{background:var(--lock);color:var(--muted);border:1px solid var(--line);cursor:not-allowed;font-size:.78rem}
.cell.locked svg{width:13px;height:13px;flex:none}
.cell.filled{background:var(--ok-bg);border:1px solid var(--ok);font-weight:600}
.cell.pop{animation:pop .35s}
@keyframes pop{0%{transform:scale(.94)}60%{transform:scale(1.03)}100%{transform:scale(1)}}
.cell.err{animation:shake .32s;border-color:var(--bad)}
.bank{background:var(--surface);border:1.5px solid var(--accent);border-radius:12px;padding:12px;display:grid;gap:8px;scroll-margin-bottom:16px}
.bank .bh{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center;font-size:.86rem}
.bank .bh b{font-weight:700}
.tiles{display:flex;flex-wrap:wrap;gap:6px;max-height:34vh;overflow:auto}
.tile{font:600 .84rem var(--f-body);background:var(--sunk);border:1.5px solid var(--line);border-radius:8px;padding:7px 10px;cursor:grab;display:inline-flex;gap:6px;align-items:center;max-width:100%;text-align:left}
.tile:hover:not([disabled]){border-color:var(--accent)}
.tile .ct{font:500 .7rem var(--f-mono);color:var(--muted)}
.tile.out{opacity:.45;text-decoration:line-through;cursor:default}
.tile.dragging{opacity:.4}
.toast{font-size:.86rem;font-weight:600}
.toast:empty{display:none}
@media (max-width:560px){.tabs .long{display:none}}
.toast.bad{color:var(--bad)}
.toast.ok{color:var(--ok)}
.notes{display:grid;gap:6px;margin:0;padding:0;list-style:none}
.notes li{border-left:3px solid var(--ok);background:var(--surface);border-radius:6px;padding:6px 10px;font-size:.88rem}
.notes li b{font-weight:700}
.gdone{display:grid;gap:12px}
footer{font-size:.78rem;color:var(--muted);border-top:1px solid var(--line);padding-top:12px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.empty-state{color:var(--muted);font-size:.9rem}
/* condensed label sizing (Barlow Condensed reads small) */
.mode-card .k,.optrow .lab,.stat span,.prompt-lab,.gcard .row{font-size:.82rem!important;font-weight:700!important;letter-spacing:.1em!important}
.tag{font-size:.8rem!important;font-weight:800!important}
.hy,.hybox b{font-size:.78rem!important;font-weight:800!important}
.kbd,.lecrow .pct,.chip .n,.tile .ct,.opt .key{font-size:.85rem!important;font-weight:600!important}
.gt th small{font-size:.76rem!important;font-weight:600!important}
.seq-done li::before{font-size:.95rem!important}
.btn,.seg button,.chip,.tabs button,.kind,.gt th{font-family:var(--f-mono)!important;letter-spacing:.06em;text-transform:uppercase}
.btn{font-size:.95rem!important;font-weight:700!important}
.btn.sm{font-size:.85rem!important}
.seg button{font-size:.88rem!important;font-weight:700!important}
.chip{font-size:.86rem!important;font-weight:700!important;text-transform:none;letter-spacing:.03em}
.tabs button{font-size:15px!important;letter-spacing:.08em}
.kind{font-size:.85rem!important;font-weight:800!important}
.gt th{font-size:.86rem!important}

<script>
const DATA = {"id": "cns12-14", "code": "CNS12 · CNS14", "title": "Pain Pathways & Opioids", "lectures": [{"k": "12", "name": "Pain Pathways", "disc": "neuro"}, {"k": "14", "name": "Opioid Drugs", "disc": "pharm"}], "los": {"12.1": "Describe the sensory fiber types (Aδ, C, and others) and inflammatory mediators involved in detecting nociceptive stimuli", "12.2": "Describe the pathways carrying pain from body and face to cortex, including where and in which commissure pain decussates", "12.3": "Explain how pain is processed centrally (cortical pain matrix, referred pain) and why pain has an emotional component", "12.4": "Explain central pain modulation: gate control, descending brainstem influences, endogenous opioids, and placebo", "12.5": "Know brainstem and spinal cord vascular territories and predict effects on ascending sensory and descending motor tracts", "12.6": "Predict how lesions at different points in the body and face pain pathways disrupt pain and temperature sensation", "14.1": "Describe opioid receptor classes (μ, κ, δ, ORL1), their endogenous ligands, and characteristic effects", "14.2": "Explain Gi/o opioid receptor signaling and the spinal and supraspinal mechanisms of opioid analgesia", "14.3": "Describe the pharmacologic effects of opioids (CNS, respiratory, GI, urinary, skin, neuroendocrine) and their mechanisms", "14.4": "Distinguish tolerance, physical dependence, withdrawal, and addiction; explain genetic variation in opioid response", "14.5": "Compare clinically used opioid agonists by potency, kinetics, metabolism, adverse effects, and uses", "14.6": "Compare mixed agonist-antagonists, opioid antagonists, and abuse-deterrent opioid combinations"}, "sets": [{"id": "s01", "lec": "12", "lo": "12.1", "kind": "structure-function", "title": "Sensory fiber → what it carries", "left": "Fiber / ending", "right": "Structure and role", "pairs": [{"a": "Aδ fiber", "b": "Thinly myelinated, medium-speed axon carrying sharp, well-localized 'first' pain and cold", "why": "Aδ = 'fast pain': the immediate, pricking pain you can localize. Thin myelin gives ~5–30 m/s conduction.", "hy": true}, {"a": "C fiber", "b": "Unmyelinated, slowest axon carrying dull, burning, poorly localized 'second' pain and warmth", "why": "C fibers (0.5–2 m/s) carry the lingering ache after the initial prick. Opioids preferentially inhibit C-fiber nociceptive transmission.", "hy": true}, {"a": "Aβ fiber", "b": "Large myelinated axon carrying touch and vibration; can close the dorsal horn pain 'gate'", "why": "Aβ input excites inhibitory interneurons in the substantia gelatinosa, which is why rubbing a bumped elbow dulls the pain."}, {"a": "Aα fiber", "b": "Largest, heavily myelinated, fastest axon carrying proprioception from spindles and tendon organs", "why": "Aα (Ia/Ib) fibers serve proprioception and reflexes, not pain. Trap: thicker myelin = faster, so pain fibers are the slow ones."}, {"a": "Nociceptor terminal", "b": "Unspecialized free nerve ending with a high activation threshold; found everywhere except brain tissue", "why": "Nociceptors are free nerve endings of DRG (or trigeminal) neurons. Brain parenchyma has none, so brain surgery can be done awake."}]}, {"id": "s02", "lec": "12", "lo": "12.1", "kind": "cause-effect", "title": "Tissue-damage mediator → effect on nociceptors", "left": "Mediator", "right": "Source / action", "pairs": [{"a": "Prostaglandins (arachidonic acid)", "b": "Block K⁺ efflux from injured nociceptors → extra depolarization and sensitization", "why": "Prostaglandins sensitize rather than strongly activate nociceptors. NSAIDs block COX → less prostaglandin → less sensitization (why NSAIDs pair well with opioids).", "hy": true}, {"a": "Histamine", "b": "Released by tissue mast cells during inflammation; directly excites nearby nociceptors", "why": "Mast-cell histamine excites nociceptors (and itch fibers). Opioids like morphine also release histamine → itch and flushing."}, {"a": "Substance P", "b": "Neuropeptide released by nociceptive fibers; excites nociceptors and dorsal horn neurons", "why": "Substance P is co-released with glutamate by C fibers in the dorsal horn; presynaptic μ receptors reduce its release."}, {"a": "Potassium (K⁺)", "b": "Ion spilled from lysed damaged cells that raises its extracellular level and depolarizes endings", "why": "↑ extracellular K⁺ shifts the nociceptor resting potential toward threshold, activating free nerve endings directly."}, {"a": "Serotonin (5-HT)", "b": "Monoamine released into injured tissue (largely from platelets) that excites nociceptors", "why": "Peripheral 5-HT excites nociceptors; centrally, raphe 5-HT projections instead INHIBIT dorsal horn pain transmission. Know both roles."}, {"a": "Globulin", "b": "Plasma protein escaping from damaged tissue; itself an intensely painful substance", "why": "Globulin from damaged tissue is listed as a very painful substance among the inflammatory 'soup' that activates nociceptors."}]}, {"id": "s03", "lec": "12", "lo": "12.2", "kind": "structure-function", "title": "Spinothalamic pathway structure → role", "left": "Structure", "right": "Role in body pain pathway", "pairs": [{"a": "Dorsal root ganglion", "b": "Holds cell bodies of 1st-order pain neurons whose free endings innervate skin and viscera", "why": "1st-order neuron = DRG cell (pseudounipolar). Its central process enters the dorsal horn laterally."}, {"a": "Lissauer's tract", "b": "Dorsolateral fasciculus where pain fibers ascend or descend 1–2 segments before synapsing", "why": "Because fibers spread 1–2 segments in Lissauer's tract, the level of a cord lesion is hard to pinpoint by pinprick testing.", "hy": true}, {"a": "Substantia gelatinosa", "b": "Dorsal horn lamina II where pain fibers synapse and the 'gate' interneurons sit", "why": "Substantia gelatinosa = gate-control site; inhibitory (enkephalinergic) interneurons here are targets of descending control."}, {"a": "Nucleus proprius", "b": "Dorsal horn region holding 2nd-order neurons that get both somatic and visceral input", "why": "Somatic + visceral convergence on nucleus proprius neurons is the anatomic basis of referred pain."}, {"a": "Anterior white commissure", "b": "Site where 2nd-order spinothalamic axons cross the midline, just ventral to the central canal", "why": "Pain decussates in the anterior white commissure, so a central cord lesion (syrinx) cuts crossing fibers bilaterally.", "hy": true}, {"a": "VPL nucleus of thalamus", "b": "Holds 3rd-order neurons relaying contralateral body pain to postcentral gyrus", "why": "VPL = body (DCML and spinothalamic both end here); VPM = face. 3rd-order axons pass through the internal capsule to S1."}]}, {"id": "s04", "lec": "12", "lo": "12.2", "kind": "structure-function", "title": "Trigeminal pain structure → role", "left": "Structure", "right": "Role in face pain pathway", "pairs": [{"a": "Spinal trigeminal tract", "b": "Descending bundle of uncrossed 1st-order CN V pain fibers running down to upper cervical cord", "why": "1st-order face pain fibers enter at the pons and DESCEND in the spinal trigeminal tract before synapsing — still ipsilateral.", "hy": true}, {"a": "Pars caudalis", "b": "Most caudal subnucleus; pain and temperature from skin and viscera, like nucleus proprius", "why": "Pars caudalis is the brainstem continuation of the dorsal horn (substantia gelatinosa/nucleus proprius column)."}, {"a": "Pars interpolaris", "b": "Middle subnucleus of the spinal trigeminal nucleus; receives oral and dental pain", "why": "Interpolaris = 'in-between' subnucleus for tooth and oral pain."}, {"a": "Pars oralis", "b": "Rostral subnucleus handling oral tactile input together with the main sensory nucleus", "why": "Oralis is the most rostral part and works with the main (principal) sensory nucleus for oral touch, not skin pain."}, {"a": "Ventral trigeminothalamic tract", "b": "Crossed 2nd-order pathway carrying face pain from spinal trigeminal nucleus upward", "why": "VTTT axons cross, so a lesion of the VTTT gives CONTRALATERAL face pain/temp loss.", "hy": true}, {"a": "VPM nucleus of thalamus", "b": "Holds 3rd-order neurons relaying contralateral face pain to lateral postcentral gyrus", "why": "VPM = face (think 'M for Mouth/Make-up'). Projects to the lateral (face) part of S1."}, {"a": "Main sensory nucleus of CN V", "b": "Pontine nucleus for discriminative face touch with bilateral (dorsal tract) output", "why": "The main sensory nucleus has crossed VTTT plus an uncrossed DTTT; the spinal trigeminal (pain) system lacks this bilateral redundancy."}]}, {"id": "s05", "lec": "12", "lo": "12.6", "kind": "lesion-deficit", "title": "Pain-pathway lesion → deficit", "left": "Lesion", "right": "Pain/temperature deficit", "pairs": [{"a": "R lateral spinothalamic tract at T8", "b": "Left body pain/temp loss beginning about 1–2 dermatomes below the lesion", "why": "Fibers cross within 1–2 segments, so the sensory level is contralateral and a bit lower than the lesion.", "hy": true}, {"a": "Cervical syringomyelia", "b": "Bilateral cape-like pain/temp loss over shoulders and arms with touch spared", "why": "A syrinx expands the central canal and severs crossing fibers in the anterior white commissure; DCML spared → feels the Q-tip, not the pinprick.", "hy": true}, {"a": "R spinal trigeminal tract/nucleus", "b": "Right face pain/temp loss; tract fibers are still uncrossed here", "why": "CN V, spinal trigeminal tract, and nucleus lesions are IPSILATERAL — the crossing happens after the nucleus.", "hy": true}, {"a": "R ventral trigeminothalamic tract", "b": "Left face pain/temp loss; no backup uncrossed pain pathway for the face", "why": "VTTT has already crossed → contralateral face loss. No DTTT redundancy exists for pain, so the loss is complete."}, {"a": "R cord hemisection at T8", "b": "Left pain/temp loss below lesion plus right vibration loss and right weakness", "why": "Brown-Séquard: ipsilateral DCML + corticospinal loss, contralateral spinothalamic loss (plus ipsilateral loss at the level)."}, {"a": "R VPL nucleus of thalamus", "b": "Left body loss of pain, temp, and touch; face sensation spared", "why": "VPL receives both spinothalamic and DCML for the body; VPM (face) is separate, so a pure VPL lesion spares the face."}]}, {"id": "s06", "lec": "12", "lo": "12.5", "kind": "lesion-deficit", "title": "Vascular territory infarct → deficit", "left": "Infarcted territory", "right": "Expected deficits", "pairs": [{"a": "Anterior spinal artery (cord)", "b": "Bilateral weakness and pain/temp loss below lesion; vibration and position sense spared", "why": "ASA supplies anterior 2/3 of cord (corticospinal, spinothalamic, anterior horns) but not the dorsal columns.", "hy": true}, {"a": "Posterior spinal artery (cord)", "b": "Loss of vibration and position sense below lesion; pain/temp and strength largely spared", "why": "PSAs supply the dorsal columns (and dorsal horn tip), so DCML modalities drop out while ALS function is preserved."}, {"a": "PICA (lateral medulla)", "b": "Ipsilateral face and contralateral body pain/temp loss, dysphagia, hoarseness, Horner", "why": "Wallenberg: hits spinal trigeminal tract/nucleus (ipsi face) + spinothalamic tract (contra body) + nucleus ambiguus.", "hy": true}, {"a": "Paramedian medulla (ASA branch)", "b": "Contralateral hemiparesis and DCML loss with ipsilateral tongue deviation", "why": "Medial medullary syndrome: pyramid, medial lemniscus, CN XII. Pain/temp is spared because the spinothalamic tract is lateral."}, {"a": "AICA (lateral pons)", "b": "Ipsilateral face pain loss and facial paralysis, contralateral body pain loss, hearing loss", "why": "Lateral pontine syndrome resembles Wallenberg but adds CN VII and VIII nuclei (facial palsy, deafness, vertigo)."}, {"a": "PCA thalamic branches", "b": "Contralateral loss of all modalities in face and body, sometimes later severe pain", "why": "Thalamic (VPL/VPM) stroke → contralateral hemisensory loss; Dejerine-Roussy thalamic pain syndrome can follow."}]}, {"id": "s07", "lec": "12", "lo": "12.3", "kind": "structure-function", "title": "Pain matrix region → contribution", "left": "Region", "right": "Contribution to pain experience", "pairs": [{"a": "Primary somatosensory cortex (S1)", "b": "Localizes pain and encodes its intensity on the somatotopic map", "why": "S1 (postcentral gyrus) provides the sensory-discriminative 'where and how much' of pain.", "hy": true}, {"a": "Anterior cingulate cortex", "b": "Unpleasantness of pain; active when feeling, thinking about, or watching others in pain", "why": "ACC = affective/emotional dimension (suffering). Opioids make pain feel 'less discomforting' partly by acting here.", "hy": true}, {"a": "Insular cortex", "b": "Interoceptive cortex that integrates pain with awareness of the body's internal state", "why": "The insula integrates internal-body signals with pain and is part of the emotional/visceral pain matrix."}, {"a": "Hypothalamus", "b": "Visceral and autonomic stress response to pain: ↑BP, ↑HR, ↑cortisol", "why": "Acute pain triggers an intense stress response; the hypothalamus drives its autonomic/endocrine limb."}, {"a": "Periaqueductal gray", "b": "Midbrain hub that triggers descending inhibition of dorsal horn pain transmission", "why": "PAG has one of the highest opioid-receptor densities; it drives raphe (5-HT) and other brainstem outputs to the cord."}, {"a": "Medial anterolateral system", "b": "Ascending fibers to brainstem and medial thalamus driving arousal and affect", "why": "Medial ALS (spinoreticular/spinomesencephalic) feeds the emotional and arousal aspects; lateral ALS feeds discrimination."}]}, {"id": "s08", "lec": "12", "lo": "12.4", "kind": "cause-effect", "title": "Pain modulation mechanism → effect", "left": "Mechanism", "right": "Effect on pain signaling", "pairs": [{"a": "Resting inhibitory interneuron tone", "b": "Keeps the projection neuron silent so no pain signal reaches the brain", "why": "At rest the gate is closed: tonically active substantia gelatinosa interneurons inhibit the projection neuron."}, {"a": "Strong Aδ/C fiber input", "b": "Inhibits the inhibitory interneuron, opening the gate for the projection neuron", "why": "Noxious input both excites the projection neuron and silences the interneuron → gate opens.", "hy": true}, {"a": "Rubbing or shaking an injured area", "b": "Aβ input excites the inhibitory interneuron and temporarily closes the gate", "why": "Gate control: touch/pressure fibers override pain — the basis for TENS and shaking a hammered thumb.", "hy": true}, {"a": "Descending brainstem projections", "b": "NE, 5-HT, and opioid release onto dorsal horn suppresses ascending transmission", "why": "Cortex acts via brainstem nuclei (PAG → raphe, locus coeruleus) that release NE/5-HT/enkephalin in the dorsal horn. Basis for SNRIs/TCAs in chronic pain.", "hy": true}, {"a": "Presynaptic opioid receptor activation", "b": "↓ Voltage-gated Ca²⁺ entry → less glutamate and substance P release", "why": "Presynaptic action on primary afferent terminals reduces transmitter release onto 2nd-order neurons."}, {"a": "Postsynaptic opioid receptor activation", "b": "↑ K⁺ conductance → hyperpolarized, less excitable 2nd-order neuron", "why": "Postsynaptic action makes the projection neuron harder to fire even if transmitter is released."}, {"a": "Placebo analgesia", "b": "Expectation releases endogenous opioids; the relief can be blocked by naloxone", "why": "Placebo relief is at least partly a real endogenous-opioid effect, shown by its blockade with naloxone."}]}, {"id": "s09", "lec": "14", "lo": "14.2", "kind": "cause-effect", "title": "Opioid signaling event → consequence", "left": "Signaling event", "right": "Cellular / circuit consequence", "pairs": [{"a": "Coupling to Gi/Go proteins", "b": "Inhibits adenylyl cyclase → ↓ cAMP and ↓ PKA-dependent phosphorylation", "why": "All classic opioid receptors are Gi/o-coupled GPCRs. Gαi inhibits adenylyl cyclase.", "hy": true}, {"a": "Gβγ action on presynaptic terminals", "b": "Suppresses voltage-gated Ca²⁺ currents → reduced transmitter release", "why": "Less Ca²⁺ entry = fewer vesicles fused = less glutamate/substance P from C-fiber terminals.", "hy": true}, {"a": "Gβγ action on postsynaptic membrane", "b": "Opens receptor-operated K⁺ channels → hyperpolarization, ↓ excitability", "why": "K⁺ efflux (GIRK) moves membrane potential away from threshold in dorsal horn and other neurons."}, {"a": "β-arrestin recruitment", "b": "Linked to tolerance, respiratory depression, and constipation", "why": "β-arrestin signaling is implicated in tolerance and in key side effects — the target of 'biased agonist' drug design."}, {"a": "μ activation in PAG", "b": "Disinhibits descending pathways that suppress dorsal horn pain transmission", "why": "Supraspinal analgesia: opioids excite descending inhibitory pathways. Spinal + supraspinal dosing is synergistic (~10-fold dose reduction)."}, {"a": "μ activation on VTA GABA interneurons", "b": "Disinhibits dopamine neurons → ↑ dopamine in nucleus accumbens", "why": "Euphoria and reinforcement come from mesolimbic dopamine release via disinhibition — the basis of addiction liability.", "hy": true}]}, {"id": "s10", "lec": "14", "lo": "14.3", "kind": "cause-effect", "title": "Central opioid effect → mechanism", "left": "Effect", "right": "Mechanism", "pairs": [{"a": "Respiratory depression", "b": "↓ Responsiveness of brainstem respiratory centers to CO₂", "why": "Cause of nearly all opioid overdose deaths. RR may fall to 3–4/min; worse with alcohol, benzodiazepines, or lung disease.", "hy": true}, {"a": "Miosis", "b": "Excitation of parasympathetic nerve supply to the pupillary sphincter", "why": "Pinpoint pupils persist even in tolerant users — a classic overdose sign (with coma and respiratory depression).", "hy": true}, {"a": "Nausea and vomiting", "b": "Direct stimulation of the area postrema chemoreceptor trigger zone; ↑ vestibular sensitivity", "why": "More common in ambulatory than recumbent patients (vestibular component); motion-sickness drugs can help."}, {"a": "Anxiolysis", "b": "μ inhibition of norepinephrine release from the locus coeruleus", "why": "LC hyperactivity on withdrawal produces anxiety — the reason clonidine (α2 agonist) eases opioid withdrawal."}, {"a": "Cough suppression", "b": "Direct depression of the medullary cough center, separable from breathing effects", "why": "Codeine and dextromethorphan are antitussives; cough suppression does not obligatorily track respiratory depression."}, {"a": "Seizures at high doses", "b": "Inhibition of GABA interneurons disinhibits hippocampal pyramidal cells", "why": "Rare with morphine; meperidine's active metabolite (normeperidine) is the classic convulsant opioid."}, {"a": "Indifference to pain", "b": "Reduced emotional 'suffering' via forebrain pain-matrix actions", "why": "Patients still sense the pain but report it as less discomforting. Continuous dull pain responds better than sharp intermittent pain."}]}, {"id": "s11", "lec": "14", "lo": "14.3", "kind": "cause-effect", "title": "Peripheral opioid effect → mechanism", "left": "Effect", "right": "Mechanism", "pairs": [{"a": "Constipation", "b": "↓ Propulsive motility, ↑ resting tone and spasm, more water absorbed from stool", "why": "No tolerance develops to constipation, so every chronic opioid user needs a bowel regimen (or methylnaltrexone).", "hy": true}, {"a": "Biliary colic", "b": "Prolonged sphincter of Oddi constriction raising common bile duct pressure", "why": "Morphine can raise bile duct pressure up to 10-fold for ~2 h — caution in gallbladder/pancreatic disease.", "hy": true}, {"a": "Urinary retention", "b": "Inhibited voiding reflex with ↑ external sphincter tone and ↑ bladder volume", "why": "Sometimes requires catheterization, especially in older men or post-op patients."}, {"a": "Pruritus and flushing", "b": "Histamine release plus reduced C-fiber activity that normally suppresses itch", "why": "Classic with morphine. This is pseudo-allergy (direct mast cell histamine release), not true IgE allergy.", "hy": true}, {"a": "Orthostatic hypotension", "b": "Peripheral vasodilation (partly histamine) and blunted baroreceptor reflex", "why": "Not seen lying in bed; standing up can cause fainting. Naloxone may be needed in extreme cases."}, {"a": "Low testosterone and cortisol", "b": "Hypothalamic inhibition of GnRH and CRF release → ↓ LH, FSH, ACTH", "why": "Chronic opioid use → hypogonadism (↓ libido, menstrual changes, infertility) and ↓ cortisol."}, {"a": "Galactorrhea", "b": "μ-mediated increase in prolactin release", "why": "μ agonists ↑ prolactin (opioids reduce tuberoinfundibular dopamine), which may cause milk production."}]}, {"id": "s12", "lec": "14", "lo": "14.5", "kind": "drug-mech", "title": "Opioid agonist → key fact", "left": "Drug", "right": "Distinguishing fact", "pairs": [{"a": "Morphine", "b": "Hydrophilic; ~25% oral bioavailability; active M6G accumulates in renal failure", "why": "M3G (inactive) and M6G (active, ~2× more potent) are renally cleared — reduce dose in kidney disease.", "hy": true}, {"a": "Codeine", "b": "Prodrug needing CYP2D6 demethylation to morphine; 2D6 inhibitors (fluoxetine) blunt it", "why": "Poor 2D6 metabolizers (~10%) get no analgesia; ultra-rapid metabolizers risk morphine toxicity. Paroxetine/fluoxetine inhibit 2D6.", "hy": true}, {"a": "Heroin", "b": "Diacetylated, lipophilic; rapidly converted to 6-MAM then morphine in the CNS", "why": "2–3× morphine potency due to better CNS penetration. 6-MAM in urine proves heroin (not morphine) use."}, {"a": "Oxycodone", "b": "Codeine analog with intrinsic μ activity; analgesia persists despite CYP2D6 block", "why": "Unlike codeine, hydrocodone/oxycodone act directly; only a small fraction becomes oxymorphone (~1%)."}, {"a": "Fentanyl", "b": "~100× morphine potency from lipophilicity; transdermal patch for cancer pain", "why": "Its μ affinity (~1 nM) is similar to morphine; potency comes from lipophilicity. Peak IV analgesia ~5 min.", "hy": true}, {"a": "Methadone", "b": "Long half-life (15–40 h), NMDA block by D-isomer, prolongs QT interval", "why": "Used for detox/maintenance; watch for torsades. Long half-life suppresses withdrawal with once-daily dosing.", "hy": true}, {"a": "Tramadol", "b": "Partial μ agonist that also inhibits NE and 5-HT reuptake; analgesic ceiling", "why": "Dual mechanism; limited respiratory depression. Risk of serotonin syndrome with SSRIs and lowered seizure threshold.", "hy": true}, {"a": "Diphenoxylate", "b": "GI-selective opioid antidiarrheal formulated with atropine to deter abuse", "why": "Atropine causes unpleasant anticholinergic effects at high doses. Loperamide is the other poorly CNS-penetrant antidiarrheal."}]}, {"id": "s13", "lec": "14", "lo": "14.6", "kind": "drug-mech", "title": "Antagonist / mixed agent → key fact", "left": "Drug or combination", "right": "Distinguishing fact", "pairs": [{"a": "Buprenorphine", "b": "μ partial agonist and κ antagonist; ceiling on respiration; sublingual, t½ 20–70 h", "why": "Partial agonist with high affinity → can precipitate withdrawal in a full-agonist-dependent patient. Used for maintenance.", "hy": true}, {"a": "Naloxone", "b": "Pure competitive μ antagonist given IV/IM/intranasal; acts only ~30–60 min", "why": "First-line for overdose. Useless orally (complete first-pass). Short action → may wear off before a long-acting opioid.", "hy": true}, {"a": "Naltrexone", "b": "Oral competitive antagonist with higher μ affinity; once-daily (24 h) dosing", "why": "Oral, long-acting antagonist used for relapse prevention in opioid (and alcohol) use disorder."}, {"a": "Methylnaltrexone", "b": "Quaternary antagonist that cannot cross the BBB; treats opioid constipation", "why": "Peripheral-only: reverses gut effects without reversing analgesia or causing central withdrawal.", "hy": true}, {"a": "Nalmefene", "b": "Prescription antagonist with ~1 nM μ affinity and t½ ~10–12 h; high withdrawal risk", "why": "Longer-acting than naloxone (less renarcotization) but precipitates prolonged withdrawal in dependent users."}, {"a": "Suboxone", "b": "Sublingual buprenorphine + naloxone 4:1; naloxone acts only if tablet is injected", "why": "Naloxone is inactive sublingually/orally but blocks the high if the tablet is dissolved and injected."}, {"a": "Targin", "b": "Oral oxycodone + naloxone 2:1; naloxone inert by mouth due to first-pass metabolism", "why": "Same abuse-deterrent principle as Suboxone, but with a full agonist (oxycodone) for pain."}, {"a": "Embeda", "b": "Extended-release morphine with sequestered naltrexone freed only when crushed", "why": "Naltrexone stays locked in the bead core if swallowed intact; crushing releases it to block euphoria."}]}, {"id": "s14", "lec": "14", "lo": "14.4", "kind": "term-app", "title": "Clinical scenario → concept", "left": "Scenario", "right": "Best-fitting concept", "pairs": [{"a": "Morphine need climbs from 30 mg to 300 mg over 10 days", "b": "Tolerance", "why": "Tolerance = reduced effect at the same dose. Develops to all effects EXCEPT constipation and miosis.", "hy": true}, {"a": "Cancer patient on stable opioids has diarrhea when dose is stopped", "b": "Physical dependence", "why": "Dependence = altered homeostatic set point revealed by withdrawal. Seen in all chronic users; not a sign of addiction.", "hy": true}, {"a": "Compulsive use and fixation on obtaining the drug despite harm", "b": "Addiction", "why": "Addiction is a behavioral pattern. Tolerance and dependence are physiological and do NOT predict it."}, {"a": "Naloxone given to a dependent user → yawning, mydriasis, cramps", "b": "Precipitated withdrawal", "why": "An antagonist abruptly strips agonist from receptors, unmasking dependence. Withdrawal signs are opposite to opioid effects."}, {"a": "Patient on paroxetine gets no relief from codeine", "b": "CYP2D6 inhibition", "why": "Paroxetine/fluoxetine inhibit 2D6, so codeine is not converted to morphine. Oxycodone would still work."}, {"a": "Opioid-naive patient with a μ-receptor gene variant needs 2× morphine", "b": "A118G OPRM1 variant", "why": "~12% carry A118G (N40D, Asn→Asp) in OPRM1. Carriers show reduced opioid-induced miosis; homozygotes needed ~2× morphine. Opioid-naive rules out tolerance."}, {"a": "Higher buprenorphine doses give no further respiratory depression", "b": "Ceiling effect", "why": "Partial agonists produce a sub-maximal response even at high dose — safer for respiration, limited for severe pain."}]}], "seqs": [{"id": "q01", "lec": "12", "lo": "12.2", "title": "Body pain: spinothalamic relay", "prompt": "Put the steps of pain transmission from the left foot to cortex in order.", "steps": ["Free nerve ending (Aδ/C) on left foot transduces noxious stimulus", "1st-order DRG neuron sends central process into dorsal horn", "Axon ascends 1–2 segments in Lissauer's tract", "Synapse in substantia gelatinosa / nucleus proprius", "2nd-order axon crosses in anterior white commissure", "Ascends in right lateral spinothalamic tract", "3rd-order neuron in right VPL nucleus of thalamus", "Projects to right postcentral gyrus (S1)"], "why": "Three-neuron relay: DRG → dorsal horn → VPL. The decussation is in the cord (anterior white commissure), so cord lesions cause contralateral loss beginning 1–2 segments below.", "hy": true}, {"id": "q02", "lec": "12", "lo": "12.2", "title": "Face pain: trigeminal relay", "prompt": "Put the steps of pain transmission from the right cheek to cortex in order.", "steps": ["Noxious stimulus on right cheek activates CN V free endings", "1st-order cell body in trigeminal ganglion; fiber enters pons", "Descends in right spinal trigeminal tract", "Synapses in right spinal trigeminal nucleus (pars caudalis)", "2nd-order axon crosses to the left", "Ascends in left ventral trigeminothalamic tract", "3rd-order neuron in left VPM nucleus of thalamus", "Projects to face area of left postcentral gyrus"], "why": "Face pain fibers first DESCEND (spinal trigeminal tract) before synapsing, then cross. Lesions before the crossing → ipsilateral face loss; VTTT or above → contralateral.", "hy": true}, {"id": "q03", "lec": "12", "lo": "12.4", "title": "Gate control: hammer and thumb", "prompt": "Order the events of gate control when you hit your thumb and then shake it.", "steps": ["At rest, inhibitory interneurons keep projection neuron silent", "Hammer strike fires Aδ and C fibers", "Pain fibers inhibit the inhibitory interneuron (gate opens)", "Projection neuron signals pain to the brain", "Shaking the thumb fires Aβ touch/pressure fibers", "Aβ input excites the substantia gelatinosa interneuron", "Projection neuron is inhibited; pain temporarily eases"], "why": "Substantia gelatinosa interneurons are the 'gate.' Pain fibers inhibit them (open); Aβ fibers excite them (close). Clinical use: TENS, rubbing a bumped shin.", "hy": false}, {"id": "q04", "lec": "12", "lo": "12.3", "title": "Referred pain in myocardial ischemia", "prompt": "Order the events that make cardiac ischemia feel like left arm pain.", "steps": ["Ischemic myocardium activates visceral nociceptors", "Visceral afferents enter upper thoracic cord segments", "Synapse on nucleus proprius neurons that also get arm skin input", "Shared 2nd-order neuron crosses and ascends in spinothalamic tract", "Cortex attributes signal to the more familiar somatic source: left arm"], "why": "Referred pain = somatic and visceral convergence on the same dorsal horn neuron. The brain defaults to the body region that usually sends pain on that line (MI → arm/jaw, diaphragm → shoulder).", "hy": true}, {"id": "q05", "lec": "14", "lo": "14.5", "title": "Heroin metabolism", "prompt": "Order the fate of injected heroin from injection to excretion.", "steps": ["IV heroin (diacetylmorphine) enters circulation", "Rapidly deacetylated to 6-monoacetylmorphine (6-MAM)", "6-MAM deacetylated to morphine", "Morphine glucuronidated to M3G (inactive) and M6G (active)", "Morphine and glucuronides excreted by the kidneys"], "why": "Heroin is a lipophilic delivery form of morphine — 2–3× more potent from faster CNS entry. 6-MAM is the heroin-specific marker. Renal clearance → M6G builds up in renal failure.", "hy": false}, {"id": "q06", "lec": "14", "lo": "14.6", "title": "Opioid overdose and reversal", "prompt": "Order the events of a fentanyl overdose treated with intranasal naloxone.", "steps": ["Fentanyl binds μ receptors in brainstem respiratory centers", "Respiratory centers lose responsiveness to rising CO₂", "Breathing slows to a few breaths/min; pinpoint pupils, coma", "Bystander gives intranasal naloxone", "Naloxone competitively displaces agonist; breathing resumes", "Naloxone wears off in 30–60 min; monitor for re-sedation"], "why": "Overdose triad: coma, miosis, respiratory depression. Naloxone is short-acting, so a longer-acting opioid can outlast it — observe and redose.", "hy": true}], "grids": [{"id": "g01", "lec": "12", "lo": "12.1", "title": "Sensory fiber chart", "blurb": "Identify each fiber from what it carries, then fill in its myelination and speed.", "cols": [{"h": "Modality"}, {"h": "Fiber", "dep": 0}, {"h": "Myelination", "dep": 1}, {"h": "Speed (m/s)", "dep": 1}], "rows": [["Proprioception (spindle, GTO)", "Aα (Ia/Ib)", "Heavily myelinated", "80–120"], ["Touch, vibration, pressure", "Aβ", "Myelinated", "35–75"], ["Sharp 'first' pain; cold", "Aδ", "Thinly myelinated", "5–30"], ["Dull burning 'second' pain; warmth", "C", "Unmyelinated", "0.5–2"]], "easyGiven": [1], "hardGiven": [0], "decoys": {"0": ["Taste and smell", "Visceral stretch only"], "1": ["Aγ", "B fiber"], "2": ["Myelinated by astrocytes", "Myelinated by oligodendrocytes"], "3": ["150–200", "0.01–0.1"]}, "notes": ["Aα: largest, fastest; serves proprioception and stretch reflexes, not pain.", "Aβ: touch/vibration; its input closes the pain gate in the substantia gelatinosa.", "Aδ: fast, localized pinprick pain — the initial 'ouch.'", "C: slow, poorly localized burning pain; preferentially inhibited by opioids."], "hy": "Pain = Aδ (fast, sharp) + C (slow, dull). Diameter and myelin set speed. Opioids preferentially inhibit C-fiber transmission, so dull continuous pain responds better than sharp pain."}, {"id": "g02", "lec": "12", "lo": "12.6", "title": "Localize the pain lesion (all right-sided)", "blurb": "Use the clinical picture to name the lesion, then predict which side of face and body lose pain/temp.", "cols": [{"h": "Clinical clue"}, {"h": "Lesion", "dep": 0}, {"h": "Face pain/temp loss", "dep": 1}, {"h": "Body pain/temp loss", "dep": 1}], "rows": [["Hoarse, dysphagia, Horner, vertigo", "R lateral medulla (PICA)", "Right (ipsilateral)", "Left (contralateral)"], ["Slowly progressive cape loss, touch intact", "Cervical syrinx", "Spared", "Both sides, at lesion levels"], ["R leg weak, R vibration loss below T10", "R hemisection at T10", "Spared", "Left (contralateral)"], ["R corneal reflex absent, R jaw weak", "R trigeminal nerve root", "Right (ipsilateral)", "Spared"], ["Lateral midbrain lesion; pain/temp only", "R lateral midbrain (VTTT + STT)", "Left (contralateral)", "Left (contralateral)"], ["Hemisensory loss, later burning pain", "R VPL + VPM thalamus", "Left (contralateral)", "Left (contralateral)"]], "easyGiven": [1], "hardGiven": [0], "decoys": {"1": ["R dorsal columns", "R medial medulla", "R internal capsule genu"], "2": ["Bilateral", "Right, V1 only"], "3": ["Right (ipsilateral)", "Right, below lesion"]}, "notes": ["Wallenberg: spinal trigeminal (uncrossed) + spinothalamic (crossed) → crossed findings; nucleus ambiguus → hoarseness, dysphagia.", "Syrinx severs crossing fibers in the anterior white commissure → bilateral segmental loss, DCML spared.", "Brown-Séquard: ipsilateral motor + DCML loss, contralateral pain/temp loss below.", "CN V lesion: ipsilateral loss of all face modalities, corneal reflex afferent, and muscles of mastication.", "Rostral to the trigeminal nuclei (upper pons/midbrain), VTTT and spinothalamic fibers have both crossed → contralateral face and body.", "Thalamic VPL/VPM (PCA branch) stroke → contralateral loss of all modalities; Dejerine-Roussy pain may follow."], "hy": "Crossed signs (ipsilateral face, contralateral body) = lateral medulla/caudal pons. Face and body both contralateral = rostral pons, midbrain, or thalamus. Bilateral cape = syringomyelia."}, {"id": "g03", "lec": "14", "lo": "14.1", "title": "Opioid receptor chart", "blurb": "Identify each receptor from its signature effects, then add its endogenous ligand and gene.", "cols": [{"h": "Signature effects"}, {"h": "Receptor", "dep": 0}, {"h": "Endogenous ligand", "dep": 1}, {"h": "Gene", "dep": 1}], "rows": [["Analgesia, euphoria, resp depression", "μ (mu)", "β-endorphin, enkephalins", "MOR-1"], ["Spinal analgesia, dysphoria, diuresis", "κ (kappa)", "Dynorphin A", "KOR-1"], ["Analgesia (peptides need intraspinal)", "δ (delta)", "Enkephalins", "DOR-1"], ["Non-classical opioid-like receptor", "ORL1", "Nociceptin / orphanin FQ", "NOR-1"]], "easyGiven": [1], "hardGiven": [0], "decoys": {"1": ["σ (sigma)", "ε (epsilon)"], "2": ["Substance P", "Anandamide", "Met-endorphin"], "3": ["POMC-1", "OPR-5"]}, "notes": ["μ mediates most clinical opioid effects, including euphoria and fatal respiratory depression.", "κ agonists cause dysphoria/psychotomimesis and diuresis (↓ ADH), with less miosis and respiratory depression.", "δ agonists are potent analgesics in animals, but peptide agents don't cross the BBB; δ also mediates immune effects.", "ORL1 binds nociceptin/orphanin FQ; shares structure with opioid receptors but is not a classical opioid site."], "hy": "Opioid peptides share the Tyr-Gly-Gly-Phe-(Met/Leu) motif. Precursors: POMC → β-endorphin; proenkephalin → enkephalins; prodynorphin → dynorphins. μ = target of nearly all clinical opioids."}, {"id": "g04", "lec": "14", "lo": "14.6", "title": "Name that opioid (clue → drug → class → caveat)", "blurb": "Deduce the drug from the clue, then classify it and give its key caveat.", "cols": [{"h": "Clue"}, {"h": "Drug", "dep": 0}, {"h": "Class", "dep": 1}, {"h": "Key caveat", "dep": 1}], "rows": [["Prodrug needing CYP2D6", "Codeine", "Weak μ agonist (prodrug)", "Ultra-rapid metabolizers → toxicity"], ["Patch for chronic cancer pain", "Fentanyl", "Full μ agonist", "Lipophilic; rapid fatal overdose"], ["Maintenance drug; D-isomer blocks NMDA", "Methadone", "Full μ agonist", "QT prolongation → torsades"], ["Analgesia partly via NE/5-HT reuptake", "Tramadol", "Partial μ agonist + SNRI", "Serotonin syndrome; seizures"], ["Sublingual; κ antagonist", "Buprenorphine", "Mixed agonist-antagonist", "Precipitates withdrawal"], ["Intranasal overdose rescue", "Naloxone", "Pure μ antagonist", "Short-acting → re-sedation"], ["Antidiarrheal with poor CNS entry", "Loperamide", "Peripheral μ agonist", "No euphoria or analgesia"]], "easyGiven": [1], "hardGiven": [0], "decoys": {"1": ["Morphine", "Naltrexone", "Hydromorphone"], "2": ["Pure κ agonist", "δ-selective agonist"], "3": ["Ototoxicity", "Agranulocytosis", "M3G seizures in liver failure"]}, "notes": ["Codeine is inactive until O-demethylated to morphine by CYP2D6; 2D6 inhibitors (fluoxetine, paroxetine) block it.", "Fentanyl is ~100× morphine because of lipophilicity, not higher receptor affinity.", "Methadone's 15–40 h half-life suppresses withdrawal once daily; get an ECG for QT.", "Tramadol's SNRI action adds analgesia but interacts with SSRIs/MAOIs and lowers seizure threshold.", "Buprenorphine: high-affinity partial agonist → displaces full agonists; ceiling on respiratory depression.", "Naloxone lasts ~30–60 min; a long-acting opioid can outlast it.", "Loperamide stays in the gut, so it keeps the constipating effect without central actions."], "hy": "Step 1 pairs: codeine–CYP2D6; methadone–QT; tramadol–serotonin syndrome/seizures; buprenorphine–precipitated withdrawal; naloxone–overdose; methylnaltrexone–opioid constipation."}, {"id": "g05", "lec": "14", "lo": "14.4", "title": "Withdrawal mirrors opioid effects", "blurb": "Match each withdrawal sign to the opioid effect it reverses, whether tolerance develops, and where it arises.", "cols": [{"h": "Withdrawal sign"}, {"h": "Opposite opioid effect", "dep": 0}, {"h": "Tolerance develops?", "dep": 1}, {"h": "Site / mechanism", "dep": 1}], "rows": [["Dysphoria", "Euphoria", "Yes", "Mesolimbic DA disinhibition"], ["Anxiety, agitation", "Tranquility, sedation", "Yes", "↓ Locus coeruleus NE release"], ["Diarrhea, cramps", "Constipation", "No", "↓ Propulsive gut motility"], ["Mydriasis", "Miosis", "No (minimal)", "Parasympathetic pupil excitation"], ["Hyperalgesia", "Analgesia", "Yes", "Dorsal horn + PAG μ receptors"]], "easyGiven": [0], "hardGiven": [0], "decoys": {"1": ["Hypertension", "Bradycardia"], "2": ["Only with κ agonists", "Only after IV use"], "3": ["Area postrema CTZ", "Sphincter of Oddi spasm"]}, "notes": ["Euphoria arises from VTA GABA disinhibition → dopamine; its loss produces dysphoria.", "Rebound locus coeruleus firing drives withdrawal anxiety; clonidine blunts it.", "No tolerance to constipation — the major chronic opioid side effect; withdrawal flips it to diarrhea.", "Tolerant users keep pinpoint pupils; withdrawal brings dilated pupils.", "Analgesia shows tolerance (e.g., 30 → 300 mg morphine in ~10 days); withdrawal can bring heightened pain."], "hy": "Tolerance develops to everything EXCEPT constipation and miosis. Opioid withdrawal is miserable but rarely fatal: dysphoria, anxiety, mydriasis, diarrhea, yawning, piloerection."}, {"id": "g06", "lec": "14", "lo": "14.5", "title": "Opioid agonists by chemical name", "blurb": "From the chemical name, identify the drug, its relative potency, and its key pharmacokinetic fact.", "cols": [{"h": "Chemical name"}, {"h": "Drug", "dep": 0}, {"h": "Relative potency", "dep": 1}, {"h": "Key PK fact", "dep": 1}], "rows": [["Parent phenanthrene (10% of opium)", "Morphine", "Reference (1×)", "Oral F ~25%; active M6G, renal"], ["Methylmorphine", "Codeine", "~10–15% of morphine", "CYP2D6 → morphine"], ["Diacetylmorphine", "Heroin", "2–3× morphine", "→ 6-MAM → morphine in CNS"], ["Dihydromorphinone", "Hydromorphone", "6–10× morphine", "More lipophilic; faster onset"], ["Dihydrocodeinone", "Hydrocodone", "6–8× oral codeine", "Intrinsic activity; <10% → hydromorphone"], ["Dihydrohydroxycodeinone", "Oxycodone", "9–10× oral codeine", "Intrinsic activity; ~1% → oxymorphone"], ["Synthetic phenylpiperidine", "Fentanyl", "~100× morphine", "Very lipophilic; IV peak ~5 min"]], "easyGiven": [1], "hardGiven": [0], "decoys": {"1": ["Thebaine", "Oxymorphone", "Papaverine"], "2": ["1000× morphine", "1/50 of morphine"], "3": ["Zero-order kinetics", "Excreted unchanged in bile"]}, "notes": ["Morphine is hydrophilic with high first-pass loss; oral dose ≈ 3× the injected dose.", "Codeine is a weak prodrug — analgesia depends on CYP2D6 conversion to morphine.", "Heroin's acetyl groups add lipophilicity → faster brain entry and a bigger 'rush.'", "Hydromorphone (Dilaudid) is a lipophilic morphine analog with faster onset.", "Hydrocodone works directly at μ, so CYP2D6 inhibition does not abolish its analgesia.", "Oxycodone also has intrinsic activity; misuse of hydro/oxycodone drove rising overdose deaths.", "Fentanyl's lipophilicity gives rapid onset and termination (peak 5 min vs 15 min for IV morphine)."], "hy": "Prodrug vs direct: codeine needs CYP2D6; hydrocodone/oxycodone do not. Rapid-onset (lipophilic) opioids — heroin, fentanyl — drive addiction and overdose."}]};

/* ---------- RAPID FIRE: play ---------- */
let RF=null, timerId=null;
function stopTimer(){if(timerId){cancelAnimationFrame(timerId);timerId=null;}}
function startRF(){
  let p=shuffle(pool());
  // interleave so the same set doesn't come back to back
  const out=[];while(p.length){let i=p.findIndex(x=>!out.length||sid(x)!==sid(out[out.length-1]));if(i<0)i=0;out.push(p.splice(i,1)[0]);}
  const n=F.len==="all"?out.length:Math.min(out.length,+F.len);
  RF={q:out.slice(0,n).map(it=>({it,retry:false})),i:0,score:0,streak:0,best:0,first:0,firstOk:0,misses:[],answered:false};
  go("rfplay");
}
const sid=it=>it.t==="pair"?it.set.id:it.q.id;
function topBar(){
  const tot=RF.q.length;
  return `<div class="rf-top">
    <div class="statrow">
      <div class="stat"><b>${Math.min(RF.i+1,tot)}/${tot}</b><span>Card</span></div>
      <div class="stat"><b>${RF.score}</b><span>Score</span></div>
      <div class="stat"><b>${RF.streak}</b><span>Streak</span></div>
      <div class="stat"><b>${RF.first?Math.round(100*RF.firstOk/RF.first)+"%":"—"}</b><span>First-try accuracy</span></div>
    </div>
    <button class="btn sm" type="button" id="quitRF">End round</button>
  </div>
  <div class="bar"><i style="width:${100*RF.i/tot}%;background:var(--accent)"></i></div>`;
}
function renderQ(){
  if(RF.i>=RF.q.length){go("rfend");return;}
  const cur=RF.q[RF.i]; RF.answered=false;
  if(cur.it.t==="seq")return renderSeq(cur);
  const it=cur.it,s=it.set,p=it.p;
  if(cur.rev===undefined)cur.rev=F.dir==="mixed"&&Math.random()<.3;
  if(!cur.opts){
    const others=shuffle(s.pairs.filter((_,j)=>j!==it.i)).slice(0,3);
    cur.opts=shuffle([p,...others]);
  }
  const K=KIND[s.kind]||KIND["term-def"];
  const promptLab=cur.rev?s.right:s.left, ansLab=cur.rev?s.left:s.right;
  $("#app").innerHTML=`${topBar()}
  <section class="qcard panel">
    <div class="qhead"><span class="kind" style="--kc:var(${K.c})">${cur.rev?esc(K.l.split(" → ").reverse().join(" → ")):K.l}</span>${lecTag(it.lec)}<span class="qset">${esc(s.title)}</span>${cur.retry?'<span class="hy" style="background:var(--once-bg);border-color:var(--once);color:var(--ink)">Retry</span>':""}</div>
    ${F.timer!=="off"?'<div class="timer" aria-hidden="true"><i id="tbar"></i></div>':""}
    <div><div class="prompt-lab">${esc(promptLab)}</div><p class="prompt">${esc(cur.rev?p.b:p.a)}</p></div>
    <p class="ask">Pick the matching ${esc(ansLab.toLowerCase())}.</p>
    <div class="options" role="group" aria-label="Answer choices">
      ${cur.opts.map((o,k)=>`<button type="button" class="opt" data-k="${k}"><span class="key">${k+1}</span><span>${esc(cur.rev?o.a:o.b)}</span></button>`).join("")}
    </div>
    <div id="fbSlot"></div>
  </section>`;
  $("#quitRF").onclick=()=>go("rfend");
  document.querySelectorAll(".opt[data-k]").forEach(b=>b.onclick=()=>answer(+b.dataset.k));
  if(F.timer!=="off")runTimer(+F.timer,()=>answer(-1));
}
function runTimer(sec,onEnd){
  const t0=performance.now();
  const tick=now=>{const f=Math.max(0,1-(now-t0)/(sec*1000));const bar=$("#tbar");if(bar){bar.style.width=(f*100)+"%";bar.classList.toggle("low",f<.3);}RF.tleft=f;if(f<=0){timerId=null;onEnd();return;}timerId=requestAnimationFrame(tick);};
  timerId=requestAnimationFrame(tick);
}
function record(cur,ok){
  const st=itemStat(cur.it.key);st.n++;if(ok){st.ok++;st.run++;}else st.run=0;st.last=ok;
  if(!cur.retry){RF.first++;if(ok)RF.firstOk++;}
  if(ok){RF.streak++;RF.best=Math.max(RF.best,RF.streak);S.best=Math.max(S.best||0,RF.best);}else{RF.streak=0;}
  if(!ok){
    if(!RF.misses.includes(cur.it))RF.misses.push(cur.it);
    if(!cur.retry){const at=Math.min(RF.q.length,RF.i+3+Math.floor(Math.random()*3));RF.q.splice(at,0,{it:cur.it,retry:true});}
  }
  save();
}
function answer(k){
  if(RF.answered)return;RF.answered=true;stopTimer();
  const cur=RF.q[RF.i],it=cur.it,s=it.set,p=it.p;
  const chosen=k>=0?cur.opts[k]:null, ok=chosen===p;
  let pts=0;if(ok){pts=100+Math.min(50,RF.streak*10);if(F.timer!=="off")pts+=Math.round(50*(RF.tleft||0));}
  RF.score+=pts;record(cur,ok);
  document.querySelectorAll(".opt[data-k]").forEach(b=>{const o=cur.opts[+b.dataset.k];b.disabled=true;if(o===p)b.classList.add("correct");else if(o===chosen)b.classList.add("wrong");else b.classList.add("dim");});
  const ansTxt=cur.rev?p.a:p.b;
  let also="";
  if(chosen&&!ok)also=`<p class="also">You picked <b>${esc(cur.rev?chosen.a:chosen.b)}</b>, which matches <b>${esc(cur.rev?chosen.b:chosen.a)}</b>.</p>`;
  $("#fbSlot").innerHTML=`<div class="fb ${ok?"ok":"bad"}">
    <h3>${ok?`Correct · +${pts}`:k<0?"Time's up":"Not quite"}</h3>
    ${ok?"":`<p>Correct match: <b>${esc(ansTxt)}</b></p>`}
    ${p.why?`<p>${esc(p.why)}</p>`:""}
    ${also}
    ${p.hy?`<div class="hybox"><b>High yield · Step 1</b>${esc(p.a)} → ${esc(p.b)}</div>`:""}
    <div class="navrow"><span class="kbd">${ok?"":"This one comes back later in the round. "}Enter = next</span><button class="btn primary" id="nextQ" type="button">Next &rarr;</button></div>
  </div>`;
  $("#nextQ").onclick=next;$("#nextQ").focus({preventScroll:true});
  $("#fbSlot").scrollIntoView({block:"nearest",behavior:"smooth"});
}
function next(){RF.i++;renderQ();}
function renderSeq(cur){
  const q=cur.it.q;
  if(!cur.order){cur.order=shuffle(q.steps.map((_,i)=>i));if(cur.order.every((v,i)=>v===i)&&q.steps.length>1)cur.order.reverse();}
  cur.placed=0;cur.err=0;
  const draw=()=>{
    $("#app").innerHTML=`${topBar()}
    <section class="qcard panel">
      <div class="qhead"><span class="kind" style="--kc:var(${KIND.sequence.c})">${KIND.sequence.l}</span>${lecTag(q.lec)}<span class="qset">${esc(q.title)}</span>${cur.retry?'<span class="hy" style="background:var(--once-bg);border-color:var(--once);color:var(--ink)">Retry</span>':""}</div>
      ${F.timer!=="off"?'<div class="timer" aria-hidden="true"><i id="tbar"></i></div>':""}
      <p class="prompt">${esc(q.prompt)}</p>
      <ol class="seq-done">${q.steps.map((s,i)=>i<cur.placed?`<li>${esc(s)}</li>`:i===cur.placed?`<li class="slot">Tap step ${i+1}…</li>`:"").join("")}</ol>
      <div class="seq-pool" role="group" aria-label="Steps to place">${cur.order.filter(i=>i>=cur.placed).map(i=>`<button type="button" class="opt" data-s="${i}"><span>${esc(q.steps[i])}</span></button>`).join("")}</div>
      <div class="navrow"><span class="kbd">Mistakes: ${cur.err}</span><button class="btn sm" type="button" id="giveUp">Show order</button></div>
      <div id="fbSlot"></div>
    </section>`;
    $("#quitRF").onclick=()=>go("rfend");
    $("#giveUp").onclick=()=>{cur.err=Math.max(cur.err,3);cur.placed=q.steps.length;finishSeq(cur,true);};
    document.querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>{
      const i=+b.dataset.s;
      if(i===cur.placed){cur.placed++;if(cur.placed>=q.steps.length){finishSeq(cur);}else draw();}
      else{cur.err++;b.classList.remove("shake");void b.offsetWidth;b.classList.add("shake");$(".navrow .kbd").textContent="Mistakes: "+cur.err;}
    });
  };
  draw();
  if(F.timer!=="off")runTimer(+F.timer*2,()=>{cur.err=Math.max(cur.err,3);cur.placed=q.steps.length;finishSeq(cur,true);});
}
function finishSeq(cur,gaveUp){
  if(RF.answered)return;RF.answered=true;stopTimer();
  const q=cur.it.q, ok=!gaveUp&&cur.err===0;
  const pts=gaveUp?0:Math.max(0,100-25*cur.err)+(ok?Math.min(50,RF.streak*10):0);
  RF.score+=pts;record(cur,ok);
  $("#app").querySelector(".seq-done").innerHTML=q.steps.map(s=>`<li>${esc(s)}</li>`).join("");
  $("#app").querySelector(".seq-pool").innerHTML="";
  $("#giveUp").remove();
  $("#fbSlot").innerHTML=`<div class="fb ${ok?"ok":"bad"}">
    <h3>${ok?`Perfect order · +${pts}`:gaveUp?"Here's the order":`Done with ${cur.err} mistake${cur.err===1?"":"s"} · +${pts}`}</h3>
    ${q.why?`<p>${esc(q.why)}</p>`:""}
    ${q.hy?`<div class="hybox"><b>High yield · Step 1</b>${esc(q.title)}: know this order cold.</div>`:""}
    <div class="navrow"><span class="kbd">${ok?"":"This one comes back later in the round. "}Enter = next</span><button class="btn primary" id="nextQ" type="button">Next &rarr;</button></div>
  </div>`;
  $("#nextQ").onclick=next;$("#nextQ").focus({preventScroll:true});
}
document.addEventListener("keydown",e=>{
  if(view!=="rfplay"||e.metaKey||e.ctrlKey||e.altKey)return;
  if(/^[1-4]$/.test(e.key)&&!RF.answered){const b=$(`.opt[data-k="${+e.key-1}"]`);if(b){e.preventDefault();b.click();}}
  else if(e.key==="Enter"&&RF.answered&&document.activeElement&&document.activeElement.id!=="quitRF"){const n=$("#nextQ");if(n&&document.activeElement!==n){e.preventDefault();n.click();}}
});

/* ---------- GRID LOCK: play ---------- */
let G=null;
function startGrid(id){
  const g=DATA.grids.find(x=>x.id===id); if(!g){go("glist");return;}
  const hard=F.diff==="hard", given=new Set(hard?g.hardGiven:g.easyGiven);
  const cells=g.rows.map(r=>r.map((v,c)=>({v,given:given.has(c),filled:false})));
  if(!hard){ // reveal ~30% of the remaining cells, but leave at least 2 blanks per column
    g.cols.forEach((_,c)=>{if(given.has(c))return;const idx=shuffle(g.rows.map((_,r)=>r));const k=Math.min(Math.floor(g.rows.length*.3+Math.random()*.6),g.rows.length-2);idx.slice(0,Math.max(0,k)).forEach(r=>cells[r][c].given=true);});
  }
  const tileOrder={};g.cols.forEach((_,c)=>{tileOrder[c]=shuffle([...new Set(g.rows.map(r=>r[c])),...((g.decoys||{})[c]||[])]);});
  G={g,hard,cells,sel:null,mistakes:0,hints:0,t0:Date.now(),tried:{},tileOrder,doneRows:new Set(),done:false,msg:"",msgCls:""};
  g.rows.forEach((_,r)=>{if(rowDone(r))G.doneRows.add(r);});
  G.sel=nextOpen(-1);
  drawGrid();
}
const isOk=(r,c)=>G.cells[r][c].given||G.cells[r][c].filled;
const rowDone=r=>G.cells[r].every((_,c)=>isOk(r,c));
function locked(r,c){if(!G.hard)return false;const d=G.g.cols[c].dep;if(d===undefined||d===null)return false;return !isOk(r,d);}
function open(r,c){return !isOk(r,c)&&!locked(r,c);}
function nextOpen(from){const R=G.g.rows.length,C=G.g.cols.length,N=R*C;for(let k=1;k<=N;k++){const x=(from+k)%N,r=Math.floor(x/C),c=x%C;if(from<0&&k===N+1)break;if(open(r,c))return [r,c];}return null;}
function remaining(c){const m={};G.g.rows.forEach((row,r)=>{if(!isOk(r,c))m[row[c]]=(m[row[c]]||0)+1;});return m;}
function rowName(r){const g=G.g;const k=(G.hard?g.hardGiven:g.easyGiven)[0];return g.rows[r][k];}
function drawGrid(){
  const g=G.g,C=g.cols.length;
  const tot=g.rows.length*C, done=g.rows.reduce((a,_,r)=>a+g.cols.reduce((b,_,c)=>b+(isOk(r,c)?1:0),0),0);
  const givenCols=new Set(G.hard?g.hardGiven:g.easyGiven);
  const head=g.cols.map((col,c)=>{const clue=G.hard&&givenCols.has(c);const dep=col.dep;return `<th scope="col" class="${clue?"clue":""}">${esc(col.h)}${clue?"<small>Clue · given</small>":G.hard&&dep!=null?`<small>${LOCK.replace('aria-hidden','style="width:10px;height:10px;vertical-align:-1px" aria-hidden')} after ${esc(g.cols[dep].h)}</small>`:""}</th>`;}).join("");
  const body=g.rows.map((row,r)=>`<tr>${row.map((v,c)=>{
    const cl=G.cells[r][c];
    if(cl.given){const clue=G.hard&&givenCols.has(c);return `<td><div class="cell ${clue?"clue":"given"}">${esc(v)}</div></td>`;}
    if(cl.filled)return `<td><div class="cell filled${cl.pop?" pop":""}">${esc(v)}</div></td>`;
    if(locked(r,c))return `<td><button type="button" class="cell locked" disabled title="Solve ${esc(g.cols[g.cols[c].dep].h)} for this row first">${LOCK}<span>${esc(g.cols[g.cols[c].dep].h)} first</span></button></td>`;
    const sel=G.sel&&G.sel[0]===r&&G.sel[1]===c;
    return `<td><button type="button" class="cell empty${sel?" sel":""}${cl.err?" err":""}" data-r="${r}" data-c="${c}" aria-label="${esc(g.cols[c].h)}, row ${r+1}, empty">${sel?"Pick a tile":"—"}</button></td>`;
  }).join("")}</tr>`).join("");
  g.rows.forEach((_,r)=>g.cols.forEach((_,c)=>{G.cells[r][c].pop=false;G.cells[r][c].err=false;}));
  const elapsed=Math.round((Date.now()-G.t0)/1000);
  let bank="";
  if(!G.done){
    if(G.sel){
      const c=G.sel[1],rem=remaining(c),tried=G.tried[c]||new Set();
      const tiles=G.tileOrder[c].filter(v=>rem[v]||(!g.rows.some(rr=>rr[c]===v))).map(v=>{const dec=!g.rows.some(rr=>rr[c]===v);const out=dec&&tried.has(v);return `<button type="button" class="tile${out?" out":""}" ${out?"disabled":""} draggable="${!out}" data-v="${esc(v)}">${esc(v)}${rem[v]>1?`<span class="ct">×${rem[v]}</span>`:""}</button>`;}).join("");
      bank=`<div class="bank" id="bank"><div class="bh"><span>Tiles for <b>${esc(g.cols[c].h)}</b> · row ${G.sel[0]+1}${G.hard?"":` (${esc(rowName(G.sel[0]))})`}</span><span class="toast ${G.msgCls}" id="toast" role="status">${esc(G.msg)}</span></div><div class="tiles">${tiles}</div></div>`;
    } else bank=`<div class="bank"><span class="toast ${G.msgCls}" role="status">${esc(G.msg)||"Tap an empty cell to see its tiles."}</span></div>`;
  }
  const notes=[...G.doneRows].sort((a,b)=>a-b).filter(r=>g.notes&&g.notes[r]).map(r=>`<li><b>${esc(g.rows[r][g.easyGiven[0]])}:</b> ${esc(g.notes[r])}</li>`).join("");
  $("#app").innerHTML=`<section class="gwrap">
    <div class="rf-top">
      <div>${lecTag(g.lec)} <span class="qset">${G.hard?"Hard":"Easy"}</span><h2 style="margin-top:4px">${esc(g.title)}</h2><p class="ask">${esc(g.blurb)}</p></div>
      <div class="statrow"><div class="stat"><b>${done}/${tot}</b><span>Cells</span></div><div class="stat"><b>${G.mistakes}</b><span>Mistakes</span></div><div class="stat"><b>${G.hints}</b><span>Hints</span></div><div class="stat"><b id="clock">${fmt(elapsed)}</b><span>Time</span></div></div>
    </div>
    <div class="navrow"><button class="btn sm" type="button" id="gBack">&larr; All grids</button><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn sm" type="button" id="gHint" ${G.done?"disabled":""}>Hint (fill one cell)</button><button class="btn sm" type="button" id="gRestart">Restart</button><button class="btn sm" type="button" id="gSwap">Switch to ${G.hard?"Easy":"Hard"}</button></div></div>
    <div class="gtable-wrap"><table class="gt"><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>
    ${G.done?doneHTML():bank}
    ${notes&&!G.done?`<div><h3 style="font-size:1rem;margin-bottom:6px">Solved rows</h3><ul class="notes">${notes}</ul></div>`:""}
  </section>`;
  $("#gBack").onclick=()=>go("glist");
  $("#gRestart").onclick=()=>startGrid(g.id);
  $("#gSwap").onclick=()=>{F.diff=G.hard?"easy":"hard";startGrid(g.id);};
  $("#gHint").onclick=hint;
  document.querySelectorAll(".cell.empty").forEach(b=>{
    b.onclick=()=>{G.sel=[+b.dataset.r,+b.dataset.c];G.msg="";drawGrid();const t=$(".tile:not([disabled])");if(t)t.focus({preventScroll:true});const bk=$("#bank");if(bk)bk.scrollIntoView({block:"nearest",behavior:"smooth"});};
    b.ondragover=e=>{e.preventDefault();b.classList.add("drop");};
    b.ondragleave=()=>b.classList.remove("drop");
    b.ondrop=e=>{e.preventDefault();const v=e.dataTransfer.getData("text/plain");place(+b.dataset.r,+b.dataset.c,v);};
  });
  document.querySelectorAll(".tile[data-v]").forEach(t=>{
    t.onclick=()=>{if(G.sel)place(G.sel[0],G.sel[1],t.dataset.v);};
    t.ondragstart=e=>{e.dataTransfer.setData("text/plain",t.dataset.v);t.classList.add("dragging");};
    t.ondragend=()=>t.classList.remove("dragging");
  });
  const d=$("#gDone");if(d)d.onclick=()=>go("glist");
  const h=$("#gHard");if(h)h.onclick=()=>{F.diff="hard";startGrid(g.id);};
  const nx=$("#gNext");if(nx)nx.onclick=()=>{const L=DATA.grids;const i=L.indexOf(g);go("grid",L[(i+1)%L.length].id);};
  tickClock();
}
const fmt=s=>Math.floor(s/60)+":"+String(s%60).padStart(2,"0");
let clockT=null;
function tickClock(){clearTimeout(clockT);if(view!=="grid"||!G||G.done)return;clockT=setTimeout(()=>{const el=$("#clock");if(el)el.textContent=fmt(Math.round((Date.now()-G.t0)/1000));tickClock();},1000);}
function place(r,c,v){
  if(G.done||!open(r,c))return;
  const g=G.g;
  if(g.rows[r][c]===v){
    G.cells[r][c].filled=true;G.cells[r][c].pop=true;
    G.msg="Correct.";G.msgCls="ok";
    if(!G.doneRows.has(r)&&rowDone(r))G.doneRows.add(r);
    const C=g.cols.length;G.sel=nextOpen(r*C+c);
    if(!G.sel&&g.rows.every((_,rr)=>rowDone(rr)))finishGrid();
  } else {
    G.mistakes++;G.cells[r][c].err=true;G.msgCls="bad";
    const inCol=g.rows.some(rr=>rr[c]===v);
    if(inCol){G.msg=`“${v}” belongs in this column, but not this row.`;}
    else{(G.tried[c]=G.tried[c]||new Set()).add(v);G.msg=`“${v}” is a decoy. It isn't in this chart.`;}
    G.sel=[r,c];
  }
  drawGrid();
}
function hint(){
  if(G.done)return;let t=G.sel&&open(...G.sel)?G.sel:nextOpen(-1);if(!t)return;
  G.hints++;G.cells[t[0]][t[1]].filled=true;G.cells[t[0]][t[1]].pop=true;
  if(rowDone(t[0]))G.doneRows.add(t[0]);
  G.msg=`Hint: filled “${G.g.rows[t[0]][t[1]]}”.`;G.msgCls="";
  const C=G.g.cols.length;G.sel=nextOpen(t[0]*C+t[1]);
  if(!G.sel&&G.g.rows.every((_,rr)=>rowDone(rr)))finishGrid();
  drawGrid();
}
function finishGrid(){
  G.done=true;G.secs=Math.round((Date.now()-G.t0)/1000);
  const pen=G.mistakes+2*G.hints;G.stars=pen===0?3:pen<=2?2:1;
  const st=S.grids[G.g.id]||(S.grids[G.g.id]={});const k=G.hard?"hard":"easy";st[k]=Math.max(st[k]||0,G.stars);save();
}
function doneHTML(){
  const g=G.g;
  return `<section class="panel gdone">
    <div class="statrow" style="align-items:center"><h2>Grid solved</h2>${stars(G.stars)}<span class="ask">${fmt(G.secs)} · ${G.mistakes} mistake${G.mistakes===1?"":"s"} · ${G.hints} hint${G.hints===1?"":"s"}</span></div>
    ${g.hy?`<div class="hybox"><b>High yield · Step 1</b>${esc(g.hy)}</div>`:""}
    <ul class="notes">${g.rows.map((row,r)=>g.notes&&g.notes[r]?`<li><b>${esc(row[g.easyGiven[0]])}:</b> ${esc(g.notes[r])}</li>`:"").join("")}</ul>
    <div class="navrow"><button class="btn" type="button" id="gDone">All grids</button><div style="display:flex;gap:8px;flex-wrap:wrap">${G.hard?"":'<button class="btn" type="button" id="gHard">Try it on Hard</button>'}<button class="btn primary" type="button" id="gNext">Next grid &rarr;</button></div></div>
  </section>`;
}

go("home");
})();
</script>
</body>
</html>
